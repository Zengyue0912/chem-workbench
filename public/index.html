window.CHEM_PRACTICE_DEFAULT={"schema":"chem-practice/2","id":"highschool-workbook","version":"2.5","title":"高中化学同步练习","description":"按人教版高中常见知识范围编写，共 241 题：60 道原创同步练习、36 道原创概念题、25 道高考真题（已注明试卷与题号，解析自写）、120 道新增同步练习。不是《五年高考三年模拟》原题。","topics":["物质与反应","元素及其化合物","结构与有机","反应原理","定量分析","实验探究"],"questions":[{"id":"s01","topic":"物质与反应","title":"离子共存","stem":"25°C、pH=1的无色溶液中，以下哪组离子能大量共存？","type":"single","points":4,"options":["Na⁺、K⁺、NO₃⁻、Cl⁻","Fe³⁺、K⁺、Cl⁻、SO₄²⁻","Na⁺、HCO₃⁻、Cl⁻、NO₃⁻","NH₄⁺、OH⁻、Na⁺、Cl⁻"],"answer":0,"analysis":{"approach":"先圈条件：pH=1 是强酸性，H⁺ 浓度约 0.1 mol/L；无色排除有色离子。再看每组离子之间是否发生反应（生成沉淀、气体、弱电解质或发生氧化还原）。","focus":"离子共存：把题干的限制条件（强酸性、无色）逐条翻译成“哪些离子不能存在”，再逐组排查。","pitfalls":"别只看离子之间是否反应，还要看离子与题干条件是否冲突：强酸性要排除 HCO₃⁻、CO₃²⁻、OH⁻ 等；“无色”要排除 Fe³⁺（黄色）、Fe²⁺（浅绿）、Cu²⁺（蓝色）、MnO₄⁻（紫红）等有色离子。","steps":["A 项正确：Na⁺、K⁺、NO₃⁻、Cl⁻ 在强酸性条件下互不反应，且都无色，可以大量共存。","B 项错误：Fe³⁺ 的溶液呈黄色（棕黄色），与“无色”矛盾，不能大量存在。","C 项错误：强酸性条件下 HCO₃⁻ 会与 H⁺ 反应：HCO₃⁻+H⁺→CO₂↑+H₂O，HCO₃⁻ 不能大量存在。","D 项错误：NH₄⁺ 与 OH⁻ 会反应生成弱电解质 NH₃·H₂O（NH₄⁺+OH⁻→NH₃·H₂O），且 OH⁻ 在 pH=1 的溶液中也不能大量存在。"]},"source":"原创同步练习","level":"巩固"},{"id":"s02","topic":"物质与反应","title":"离子方程式","stem":"下列反应的离子方程式正确的是哪项？","type":"single","points":4,"options":["稀盐酸与铁：2Fe+6H⁺→2Fe³⁺+3H₂↑","氢氧化钡与稀硫酸：Ba²⁺+SO₄²⁻→BaSO₄↓","碳酸钙与稀盐酸：CaCO₃+2H⁺→Ca²⁺+CO₂↑+H₂O","醋酸与NaOH：H⁺+OH⁻→H₂O"],"answer":2,"analysis":{"approach":"逐项检查三点：①强酸、强碱、可溶性盐拆成离子，弱电解质、难溶物、气体、单质保留化学式；②反应物、生成物是否齐全；③元素守恒与电荷守恒。","focus":"离子方程式的正误判断：拆分规则、产物是否写全、元素与电荷是否守恒。","pitfalls":"常见错误有三类：把 Fe 与稀盐酸的产物记成 Fe³⁺；复分解反应只写沉淀、漏写水的生成；把弱酸、弱碱、难溶物拆成离子。写完后用元素守恒和电荷守恒各验算一遍。","steps":["A 项错误：铁与稀盐酸反应生成 Fe²⁺ 而非 Fe³⁺，正确的是 Fe+2H⁺→Fe²⁺+H₂↑。盐酸的氧化性不足以把铁氧化到 +3 价。","B 项错误：只写了沉淀的生成，漏掉了 H⁺ 与 OH⁻ 生成水。完整写法：Ba²⁺+2OH⁻+2H⁺+SO₄²⁻→BaSO₄↓+2H₂O。","C 项正确：CaCO₃ 难溶保留化学式；CO₃²⁻ 与 H⁺ 反应生成 CO₂ 和 H₂O，元素与电荷都守恒。","D 项错误：醋酸（CH₃COOH）是弱电解质，不能拆成 H⁺，应写为 CH₃COOH+OH⁻→CH₃COO⁻+H₂O。"]},"source":"原创同步练习","level":"巩固"},{"id":"s03","topic":"元素及其化合物","title":"碳酸盐鉴别","stem":"两瓶等物质的量浓度的Na₂CO₃、NaHCO₃溶液，取等体积分别逐滴加入足量同浓度盐酸。忽略CO₂溶解，哪项判断合理？","type":"single","points":4,"options":["两者最初均必须立即有相同量气体","Na₂CO₃先转化为HCO₃⁻，继续加酸才明显放气","两者完全反应消耗HCl相同","Na₂CO₃完全反应生成CO₂较多"],"answer":1,"analysis":{"approach":"逐滴加酸时 Na₂CO₃ 分两步反应：先 CO₃²⁻+H⁺→HCO₃⁻（无气体），再 HCO₃⁻+H⁺→CO₂↑+H₂O（放气）。NaHCO₃ 则一步放气。再用计量关系比较耗酸量与产气量。","focus":"Na₂CO₃ 与 NaHCO₃ 跟盐酸反应的分步过程：CO₃²⁻ 先变成 HCO₃⁻，再变成 CO₂。","pitfalls":"注意题干是“逐滴加入”，才能观察到 Na₂CO₃ 先无气泡后放气的分步现象；若把盐酸一次性倒入足量盐酸中，两者都会立即放气。实际观察还受混合速度、局部酸过量和 CO₂ 溶解的影响。","steps":["A 项错误：Na₂CO₃ 溶液开始滴酸时先转化为 HCO₃⁻，没有明显气体；NaHCO₃ 一开始就放气，两者最初现象不同。","B 项正确：Na₂CO₃ 先转化为 HCO₃⁻，继续加酸后 HCO₃⁻ 再与 H⁺ 反应，才明显放出 CO₂。","C 项错误：完全反应时 1 mol Na₂CO₃ 耗 2 mol HCl，1 mol NaHCO₃ 只耗 1 mol HCl，耗酸量不同。","D 项错误：等物质的量的 Na₂CO₃ 与 NaHCO₃ 完全反应最终都生成等量的 CO₂（各 1 mol CO₂ / mol 盐），不存在谁更多。"]},"source":"原创同步练习","level":"巩固"},{"id":"s04","topic":"元素及其化合物","title":"铁离子的检验","stem":"检验某溶液中的Fe²⁺，下列方案中哪项体现了对原有Fe³⁺干扰的检查？","type":"single","points":4,"options":["直接加入KSCN，变红即有Fe²⁺","先检验原液与KSCN的现象；另取样先氧化再用KSCN，并比较","只凭溶液浅绿色即可确定","加入NaOH出现沉淀，即证明有Fe²⁺且无其他离子"],"answer":1,"analysis":{"approach":"关键是理解试剂“测的是什么”：KSCN 遇 Fe³⁺ 变红，遇 Fe²⁺ 不变红。所以要先测原液（看有没有现成的 Fe³⁺），再把 Fe²⁺ 氧化成 Fe³⁺ 后测，两次结果对照才能下结论。","focus":"Fe²⁺ 的检验：KSCN 只能直接指示 Fe³⁺，检验 Fe²⁺ 必须先排除原有 Fe³⁺ 的干扰。","pitfalls":"检验题的通用思路是“先排除干扰，再确证目标”。若原液已经显红（本来就有 Fe³⁺），单凭氧化前后定性显色不足以充分证明 Fe²⁺，需补充其他检验。","steps":["A 项错误：KSCN 变红只能说明有 Fe³⁺，不能证明有 Fe²⁺；若原液本来就含 Fe³⁺，会直接得出错误结论。","B 项正确：先检验原液与 KSCN 的现象，确认原有 Fe³⁺ 的情况；另取样先氧化（如加氯水）再加 KSCN，若原液不显红、氧化后显红，可支持原液含有 Fe²⁺。","C 项错误：浅绿色只是 Fe²⁺ 溶液的常见颜色，浓度低时不明显，其他离子也可能使溶液带色，不能作为确证依据。","D 项错误：加 NaOH 出现沉淀可能是多种金属氢氧化物（如 Fe(OH)₃、Mg(OH)₂ 等），且 Fe(OH)₂ 白色沉淀迅速变色，难以单独确证 Fe²⁺，更不能证明“无其他离子”。"]},"source":"原创同步练习","level":"巩固"},{"id":"s05","topic":"结构与有机","title":"分子的空间结构","stem":"关于CH₄、NH₃、H₂O的空间结构与极性，哪项正确？","type":"single","points":4,"options":["三者中心原子均无孤电子对","CH₄为正四面体形、非极性；NH₃为三角锥形、有极性","H₂O为直线形，两个O—H键偶极抵消","NH₃为平面三角形、非极性"],"answer":1,"analysis":{"approach":"先数每个分子中心原子的价层电子对：CH₄ 是 4 对成键、0 对孤对；NH₃ 是 3 对成键、1 对孤对；H₂O 是 2 对成键、2 对孤对。构型只看原子的位置；极性看键偶极的空间合成是否抵消。","focus":"VSEPR 模型：由中心原子的成键电子对数与孤电子对数判断分子构型，再由构型的对称性判断分子极性。","pitfalls":"不要把“含极性键”直接等同于“分子有极性”：CO₂ 含极性键但因直线形对称而整体非极性；也不要把电子对的排布（如四面体排布）与分子的构型（如三角锥形、V 形）混为一谈。","steps":["A 项错误：NH₃ 的氮原子有 1 对孤电子对，H₂O 的氧原子有 2 对孤电子对，只有 CH₄ 的碳原子没有孤电子对。","B 项正确：CH₄ 为正四面体形，结构高度对称，键偶极相互抵消，是非极性分子；NH₃ 为三角锥形，结构不对称，是极性分子。","C 项错误：H₂O 是 V 形（弯曲形），不是直线形，两条 O—H 键的偶极不能抵消，水分子有极性。","D 项错误：NH₃ 因孤电子对的排斥呈三角锥形而非平面三角形，且分子有极性。"]},"source":"原创同步练习","level":"巩固"},{"id":"s06","topic":"结构与有机","title":"同分异构体","stem":"分子式C₄H₁₀O的饱和一元醇，仅考虑碳骨架与羟基位置，不考虑立体异构，共有多少种？","type":"single","points":4,"options":["2","3","4","5"],"answer":2,"analysis":{"approach":"C₄H₁₀O 的饱和一元醇：先列出丁烷的两种碳骨架（直链、支链），再在每种骨架上移动 —OH 的位置，用“对称性去重”避免重复计数。","focus":"同分异构体的计数：先定碳骨架，再定羟基位置，注意题设只计一元醇、不计立体异构。","pitfalls":"计数时最容易漏掉支链骨架，或把对称位置重复计算。固定“先骨架、后官能团位置”的顺序，并利用对称性判断哪些位置等价，就不容易漏数或多数。","steps":["直链骨架（正丁烷）：羟基在 1 号碳上是丁-1-醇，在 2 号碳上是丁-2-醇；羟基在 3、4 号碳上与 2、1 号碳重复，共 2 种。","支链骨架（异丁烷，2-甲基丙烷）：羟基连在端基碳上是 2-甲基丙-1-醇，连在中间碳上是 2-甲基丙-2-醇，共 2 种。","两类合计 2+2=4 种，选 C。","注意：C₄H₁₀O 的醚（如乙醚）也是同分异构体，但题设限定为“一元醇”，不计入；否则总数会超过 4。"]},"source":"原创同步练习","level":"巩固"},{"id":"s07","topic":"反应原理","title":"平衡移动","stem":"恒温恒容密闭容器中N₂O₄(g)⇌2NO₂(g)已平衡。加入少量N₂O₄后重新平衡，哪些量一定与原平衡相同？","type":"single","points":4,"options":["NO₂物质的量","N₂O₄转化率","体系总压","该温度下的平衡常数"],"answer":3,"analysis":{"approach":"恒温条件下 K 不变，这是判断的锚点。加入 N₂O₄ 后反应商 Q 小于 K，平衡正向移动，重新平衡时各组分的量与总压都与原来不同。","focus":"化学平衡常数只与温度有关；加料后体系会建立新平衡，组成与总压都会改变。","pitfalls":"平衡常数 K 只随温度改变，浓度、压强、催化剂都不能改变 K；但“温度不变”不等于“各组分浓度不变”——加料、改压都会建立组成不同的新平衡。","steps":["A 项错误：加入 N₂O₄ 后平衡正向移动，NO₂ 的物质的量增大，与原平衡不同。","B 项错误：新平衡时 N₂O₄ 的总量与转化程度都变了，转化率与原平衡不同（恒容加料相当于增大压强，转化率会降低）。","C 项错误：加入反应物后体系总物质的量增大，恒温恒容下总压增大。","D 项正确：平衡常数只由温度决定（同一反应），温度不变则 K 不变。"]},"source":"原创同步练习","level":"巩固"},{"id":"s08","topic":"反应原理","title":"原电池方向","stem":"锌铜原电池以酸性溶液为电解质，铜电极上H⁺得电子生成H₂，忽略其他反应。下列说法正确的是？","type":"single","points":4,"options":["电子经电解质溶液从Zn流向Cu","Zn为负极，反应Zn→Zn²⁺+2e⁻","Cu发生氧化，H⁺在Zn表面还原","盐桥中的离子不移动"],"answer":1,"analysis":{"approach":"锌比铜活泼，Zn 作负极失电子被氧化，Cu 作正极，H⁺ 在正极得电子。电子只走外电路导线，溶液内部靠离子迁移传导电流。","focus":"原电池的工作原理：电极判断、电极反应、电子与离子的移动路径。","pitfalls":"最常见的错误是认为电子穿过溶液：记住“外电路走电子、内电路走离子”。正负极判断看电子得失：失电子被氧化的是负极，得电子被还原的是正极。","steps":["A 项错误：电子沿外电路导线从负极 Zn 流向正极 Cu，不会穿过电解质溶液；溶液中是离子的定向移动。","B 项正确：Zn 为负极，发生氧化反应：Zn→Zn²⁺+2e⁻。","C 项错误：Cu 是正极，发生还原反应；H⁺ 在 Cu 表面得电子生成 H₂，不是 Cu 被氧化、也不是 H⁺ 在 Zn 表面还原。","D 项错误：盐桥中的离子会定向移动（阳离子移向正极区、阴离子移向负极区），以保持溶液电中性、维持电流，绝不是不移动。"]},"source":"原创同步练习","level":"巩固"},{"id":"s09","topic":"定量分析","title":"标准状况的限制","stem":"关于物质的量的说法，哪项正确？取NA为阿伏加德罗常数。","type":"single","points":4,"options":["标准状况下22.4L液态水含NA个分子","1molNaCl晶体含NA个NaCl分子","0.10molCO₂完全与足量NaOH生成Na₂CO₃，需0.20molNaOH","任何温度、压强下，1mol气体体积均为22.4L"],"answer":2,"analysis":{"approach":"逐项核对概念的适用条件：22.4 L/mol 只适用于标准状况下的气体；离子晶体由离子构成，没有分子；再用方程式验算 C 项的计量关系。","focus":"物质的量的基本概念：气体摩尔体积的适用条件、离子晶体的组成、化学计量关系。","pitfalls":"22.4 L/mol 有两个前提：标准状况、气体，缺一不可。离子化合物、共价网络晶体都没有“分子”这个概念，计数时用化学式单位。","steps":["A 项错误：22.4 L/mol 是标准状况下气体的摩尔体积，液态水不是气体；22.4 L 液态水约 1244 mol，远多于 N_A 个分子。","B 项错误：NaCl 晶体由 Na⁺ 和 Cl⁻ 按 1∶1 构成，不存在 NaCl 分子，1 mol NaCl 晶体含 N_A 个 Na⁺ 和 N_A 个 Cl⁻，应按化学式单位计数。","C 项正确：CO₂+2NaOH→Na₂CO₃+H₂O，0.10 mol CO₂ 完全反应需 0.20 mol NaOH。","D 项错误：1 mol 气体的体积随温度、压强变化，只有在标准状况（0 ℃、101 kPa）下才约为 22.4 L。"]},"source":"原创同步练习","level":"巩固"},{"id":"s10","topic":"定量分析","title":"滴定误差","stem":"用已标定NaOH滴定准确移取的HCl。若NaOH滴定管尖嘴初有气泡、滴定后气泡消失，按读数差计算HCl浓度，会怎样？","type":"single","points":4,"options":["偏高","偏低","无影响","必定恰好抵消终点误差"],"answer":0,"analysis":{"approach":"先画体积去向：读数差 = 进入锥形瓶的体积 + 填充尖嘴气泡的体积。读数差偏大，代入公式的 V(碱) 偏大，算出的 c(酸) 就偏高。","focus":"滴定误差分析：读数差与实际进入锥形瓶的体积并不相等，找出两者之差的去向。","pitfalls":"误差分析不要死记结论，要追问“多算的体积去哪了”或“少算的体积去哪了”。D 项“必定恰好抵消”没有依据：终点误差与气泡误差是两个独立的误差，无法保证恰好抵消。","steps":["第一步：滴定前尖嘴有气泡，液面读数对应的液体体积比读数显示的少，气泡占据了一部分刻度体积。","第二步：滴定过程中气泡消失，NaOH 溶液填充了尖嘴，原来气泡占的位置也被液体占据。","第三步：读数差（末读数 − 初读数）中包含填充尖嘴的液体体积，实际进入锥形瓶的 NaOH 体积比读数差小。","第四步：按 c(HCl)=c(NaOH)·V(碱)/V(酸) 计算，V(碱) 用了偏大的读数差，所以 c(HCl) 偏高，选 A。"]},"source":"原创同步练习","level":"巩固"},{"id":"s11","topic":"实验探究","title":"分离方法选择","stem":"分离含NaCl、少量泥沙的水样并得到NaCl固体，合理的操作顺序是？","type":"single","points":4,"options":["蒸馏后取馏出液蒸干","过滤后蒸发结晶","先分液后过滤","直接用分液漏斗分离泥沙"],"answer":1,"analysis":{"approach":"泥沙不溶于水、NaCl 易溶于水：先过滤除去泥沙，再把滤液蒸发结晶得到 NaCl 固体。分液只用于互不相溶的液体混合物。","focus":"混合物分离方法的选择：按“不溶性固体—可溶性固体—液体”的性质差异确定操作顺序。","pitfalls":"选分离方法先看混合物各组分的性质差异：溶解性不同用过滤，沸点不同用蒸馏，互不相溶的液体用分液，溶解度随温度变化不同用结晶。这里讨论的是操作原理，不是将未知水样直接饮用。","steps":["A 项错误：蒸馏得到的是馏出液（水），NaCl 留在蒸馏烧瓶的残液里；把馏出液蒸干得不到 NaCl 固体。","B 项正确：过滤除去不溶性泥沙，再对滤液蒸发结晶，析出 NaCl 固体，顺序合理。","C 项错误：分液用于分离互不相溶的液体（如油水混合物），泥沙与水不是互不相溶的液体，不能用分液分离。","D 项错误：分液漏斗分离的是互不相溶的液体，泥沙是固体颗粒，不能用分液漏斗分离。"]},"source":"原创同步练习","level":"巩固"},{"id":"s12","topic":"实验探究","title":"实验设计与变量","stem":"比较温度对反应速率的影响，应该怎样设计对照？","type":"single","points":4,"options":["温度、浓度、用量同时增加","只改变温度，尽量保持浓度、用量等其他条件相同","只比较最终气体体积，不记录时间","用两种完全不同的反应作对照"],"answer":1,"analysis":{"approach":"实验设计看两点：①是否只改变温度这一个变量；②比较的指标是否真正反映速率快慢（相同进程所需时间，或相同时间内反应程度）。","focus":"控制变量法：研究一个因素对反应速率的影响时，只能改变该因素，其他条件保持相同。","pitfalls":"速率比较的指标是“单位时间内的变化量”，常见做法是比较达到同一反应进程所需的时间，或比较相同时间内的反应程度。只比较最终量（如最终气体体积）得不出速率结论。","steps":["A 项错误：温度、浓度、用量同时改变，无法判断速率变化是由哪个因素引起的。","B 项正确：只改变温度，浓度、用量、催化剂等其他条件尽量保持相同，才能把速率差异归因于温度。","C 项错误：最终气体体积反映的是反应进行的程度（产率），不是快慢；比较速率需要记录时间，如达到同一进程所需的时间。","D 项错误：两种完全不同的反应，可比性不存在，速率差异无法归因于温度。"]},"source":"原创同步练习","level":"巩固"},{"id":"m01","topic":"物质与反应","title":"氧化还原判断","stem":"对于反应Cl₂+2OH⁻→Cl⁻+ClO⁻+H₂O，选择所有正确说法。","type":"multi","points":6,"options":["Cl₂既是氧化剂又是还原剂","Cl⁻中的Cl由0价降到−1价","生成1molClO⁻对应转移2mol电子","反应中Cl元素发生歧化"],"answer":[0,1,3],"analysis":{"approach":"先标化合价：Cl₂ 中 Cl 为 0 价，产物 Cl⁻ 中为 −1 价、ClO⁻ 中为 +1 价。同一反应物一部分升价、一部分降价，就是歧化；再按升降价的量算电子转移数。","focus":"歧化反应：同一种元素一部分被氧化、一部分被还原，Cl₂ 既作氧化剂又作还原剂。","pitfalls":"歧化反应中电子转移数按“生成 1 mol 某产物对应的升降价原子数”计算，不要把方程式中 Cl₂ 的系数 1 当成电子数。生成 1 mol ClO⁻ 只有 1 个 Cl 原子升价 1 价，转移 1 mol 电子。","steps":["A 项正确：Cl₂ 中一部分 Cl 原子降价为 Cl⁻（得电子，作氧化剂），另一部分升价为 ClO⁻（失电子，作还原剂），所以 Cl₂ 既是氧化剂又是还原剂。","B 项正确：Cl⁻ 中的 Cl 由 Cl₂ 中的 0 价降到 −1 价，化合价降低。","C 项错误：每生成 1 mol ClO⁻，只有 1 mol Cl 原子由 0 价升到 +1 价，转移 1 mol 电子，不是 2 mol。","D 项正确：同一元素（Cl）在反应中同时发生氧化和还原，属于歧化反应。"]},"source":"原创同步练习","level":"综合"},{"id":"m02","topic":"元素及其化合物","title":"硅及其化合物","stem":"选择所有正确说法。","type":"multi","points":6,"options":["SiO₂属于酸性氧化物，但不与水直接反应生成硅酸","玻璃中的硅酸盐能在一定条件下与NaOH反应","CO₂和SiO₂都是由独立分子构成的分子晶体","盛放NaOH溶液通常不用磨口玻璃塞"],"answer":[0,1,3],"analysis":{"approach":"逐项判断：SiO₂ 是酸性氧化物但不与水反应；玻璃中的硅酸盐可与 NaOH 反应；晶体类型看构成微粒；磨口玻璃塞的问题来自硅酸钠的黏结作用。","focus":"硅及其化合物：SiO₂ 的性质与晶体类型、玻璃与碱的反应、试剂瓶塞的选择。","pitfalls":"酸性氧化物不一定都与水反应生成对应的酸（如 SiO₂、CO 不与水直接反应）。判断晶体类型看构成微粒和作用力：SiO₂ 是由 Si、O 原子通过共价键形成的三维网络，不是独立分子。","steps":["A 项正确：SiO₂ 能与碱反应生成盐和水，属于酸性氧化物；但它不与水直接反应生成硅酸，硅酸通常由可溶性硅酸盐与酸反应制得。","B 项正确：玻璃中的硅酸盐（如 Na₂SiO₃、CaSiO₃）在一定条件下能与 NaOH 反应，例如 SiO₂+2NaOH→Na₂SiO₃+H₂O。","C 项错误：CO₂ 是分子晶体，但 SiO₂ 是共价晶体（原子晶体），由硅原子和氧原子以共价键连接成三维网络，不存在独立的 SiO₂ 分子。","D 项正确：NaOH 能与玻璃缓慢反应生成有黏性的 Na₂SiO₃，会使磨口玻璃塞黏结打不开，所以盛放 NaOH 溶液通常用橡皮塞而不用磨口玻璃塞。"]},"source":"原创同步练习","level":"综合"},{"id":"m03","topic":"结构与有机","title":"有机反应辨析","stem":"关于乙醇与乙酸的反应，选择所有正确说法。","type":"multi","points":6,"options":["酯化属于可逆反应","生成物为乙酸乙酯和水","加入催化剂能改变该温度下的平衡常数","在合适条件下分离产物可促进反应继续进行"],"answer":[0,1,3],"analysis":{"approach":"酯化反应是乙酸与乙醇在浓硫酸催化、加热下生成乙酸乙酯和水的可逆反应。判断时抓住两点：催化剂只改速率不改 K；移去产物使 Q 小于 K，平衡正向移动。","focus":"酯化反应：可逆反应、生成物、催化剂对平衡常数的影响、分离产物对平衡的促进。","pitfalls":"催化剂能同等程度地加快正、逆反应速率，缩短达到平衡的时间，但不能改变平衡常数，也不能改变平衡转化率。改变 K 的唯一因素是温度。","steps":["A 项正确：酯化反应是可逆反应，在一定条件下正、逆反应同时进行，不能进行到底。","B 项正确：CH₃COOH+C₂H₅OH⇌CH₃COOC₂H₅+H₂O，生成物为乙酸乙酯和水。","C 项错误：催化剂只影响达到平衡的速率，不改变给定温度下的平衡常数 K。","D 项正确：在合适条件下及时分离出产物（如蒸出乙酸乙酯或移走水），反应商 Q 减小，平衡正向移动，可促进反应继续进行。"]},"source":"原创同步练习","level":"综合"},{"id":"m04","topic":"反应原理","title":"速率与平衡","stem":"密闭体系中某可逆反应达到化学平衡，选择所有正确说法。","type":"multi","points":6,"options":["正、逆反应速率都为0","各组分浓度保持宏观不变","同一组分的正、逆反应速率相等","平衡状态是动态平衡"],"answer":[1,2,3],"analysis":{"approach":"化学平衡的本质是“动态平衡”：正、逆反应速率相等且都不为零，各组分浓度宏观不变。判断时注意：比较速率必须针对同一组分，不同组分的速率数值要按计量系数换算。","focus":"化学平衡状态的特征：正逆反应速率相等、浓度不变、动态平衡。","pitfalls":"“平衡”不是反应停止，而是正、逆反应速率相等。不同物质表示的反应速率数值不同（如 N₂O₄ 与 NO₂ 的速率比为 1∶2），比较时必须先换算到同一物质或按计量系数折算。","steps":["A 项错误：达到平衡时正、逆反应仍在进行，速率都不为 0，只是正、逆反应速率相等。","B 项正确：平衡时各组分的浓度（物质的量、质量分数等）保持宏观不变，是判断平衡的重要标志。","C 项正确：同一组分的正反应速率与逆反应速率相等，是化学平衡的定义性特征。","D 项正确：平衡是动态平衡——反应仍在进行，只是正、逆两个方向的速率相等，宏观上不再变化。"]},"source":"原创同步练习","level":"综合"},{"id":"f01","topic":"定量分析","title":"配制溶液的计算","stem":"用NaCl固体配制250.0mL、0.200mol/L溶液，M(NaCl)=58.5g/mol。","type":"fill","points":4,"parts":[{"id":"a","prompt":"需称NaCl质量","kind":"numeric","answer":2.925,"points":2,"unit":"g","tolerance":0.005,"rubric":""},{"id":"b","prompt":"若定容时仰视刻度线，所配浓度相对目标值怎样？","kind":"text","answer":["偏低","降低"],"points":2,"unit":"","tolerance":0.01,"rubric":""}],"analysis":{"approach":"先用 n=cV 算溶质的物质的量，再用 m=nM 算质量；误差判断用公式 c=n/V，分别看 n 和 V 如何变化。","focus":"配制一定物质的量浓度溶液的计算与误差分析：n=cV、m=nM，仰视定容使体积偏大。","pitfalls":"单位换算最容易出错：体积要化成升（250.0 mL=0.2500 L）。误差分析用 c=n/V 分开判断：仰视定容时 n 不变、V 偏大，所以 c 偏低；不要笼统地说“看错刻度就偏低”。","steps":["（a）溶质的物质的量 n=cV=0.200 mol/L×0.2500 L=0.0500 mol。","（a）需称 NaCl 质量 m=nM=0.0500 mol×58.5 g/mol=2.925 g。","（b）定容时仰视刻度线，看到的液面与刻度线相平时，实际液面已经高于刻度线，溶液体积偏大。","（b）由 c=n/V，n 不变、V 偏大，所配溶液浓度偏低。"]},"source":"原创同步练习","level":"巩固"},{"id":"f02","topic":"元素及其化合物","title":"碳酸盐混合物","stem":"某Na₂CO₃、NaHCO₃混合固体与足量盐酸完全反应，产生0.100molCO₂，共消耗0.160molHCl。","type":"fill","points":4,"parts":[{"id":"a","prompt":"原混合物中Na₂CO₃物质的量","kind":"numeric","answer":0.06,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""},{"id":"b","prompt":"原混合物中NaHCO₃物质的量","kind":"numeric","answer":0.04,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""}],"analysis":{"approach":"设两个未知数列方程组：CO₂ 的总物质的量对应两种盐的物质的量之和（碳元素守恒），HCl 的消耗量按 Na₂CO₃ 耗 2、NaHCO₃ 耗 1 列式。","focus":"碳酸盐混合物的计算：用碳元素守恒与耗酸量列二元一次方程组。","pitfalls":"列方程时先写清两个反应式再配系数：Na₂CO₃+2HCl→2NaCl+CO₂↑+H₂O（耗酸 2），NaHCO₃+HCl→NaCl+CO₂↑+H₂O（耗酸 1）。注意两种盐各产生 1 mol CO₂，所以 CO₂ 总量等于两种盐的物质的量之和。","steps":["设原混合物中 Na₂CO₃ 为 x mol、NaHCO₃ 为 y mol。","按碳元素守恒，两种盐各产生 1 mol CO₂：x+y=0.100。","按耗酸量，Na₂CO₃ 每摩尔耗 2 mol HCl，NaHCO₃ 每摩尔耗 1 mol HCl：2x+y=0.160。","两式相减得 x=0.060 mol，代回得 y=0.040 mol。故 Na₂CO₃ 为 0.060 mol，NaHCO₃ 为 0.040 mol。"]},"source":"原创同步练习","level":"巩固"},{"id":"f03","topic":"反应原理","title":"平衡常数计算","stem":"恒温恒容2.00L容器中加入1.00molN₂O₄，平衡N₂O₄(g)⇌2NO₂(g)时剩余N₂O₄为0.600mol。Kc按mol/L代入。","type":"fill","points":4,"parts":[{"id":"a","prompt":"平衡时NO₂浓度","kind":"numeric","answer":0.4,"points":2,"unit":"mol/L","tolerance":0.01,"rubric":""},{"id":"b","prompt":"该温度下Kc数值","kind":"numeric","answer":0.5333,"points":2,"unit":"","tolerance":0.003,"rubric":""}],"analysis":{"approach":"用“三段式”列出初始、变化、平衡三行的物质的量，再除以体积换算成浓度，最后代入 Kc 表达式。","focus":"化学平衡常数的计算：三段式、物质的量与浓度的换算、Kc 表达式。","pitfalls":"Kc 用平衡浓度代入，不是初始浓度也不是物质的量；写 Kc 表达式时生成物浓度的幂是计量系数（NO₂ 是 2 次方）。计算前先把物质的量除以容器体积（2.00 L）换算成浓度。","steps":["三段式（单位 mol）：N₂O₄ 起始 1.00，平衡时剩余 0.600，消耗 0.400；按 1∶2 的计量关系，生成 NO₂ 0.800 mol。","换算为浓度（V=2.00 L）：平衡时 c(NO₂)=0.800/2.00=0.400 mol/L，c(N₂O₄)=0.600/2.00=0.300 mol/L。","（a）平衡时 NO₂ 浓度为 0.400 mol/L。","（b）Kc=c²(NO₂)/c(N₂O₄)=0.400²/0.300=0.160/0.300≈0.533。"]},"source":"原创同步练习","level":"巩固"},{"id":"f04","topic":"反应原理","title":"强酸强碱混合","stem":"25°C，100.0mL、0.100mol/LHCl与100.0mL、0.120mol/LNaOH混合，体积近似相加，Kw=1.0×10⁻¹⁴，忽略活度影响。","type":"fill","points":4,"parts":[{"id":"a","prompt":"混合后过量OH⁻浓度","kind":"numeric","answer":0.01,"points":2,"unit":"mol/L","tolerance":0.0001,"rubric":""},{"id":"b","prompt":"混合后pH","kind":"numeric","answer":12,"points":2,"unit":"","tolerance":0.02,"rubric":""}],"analysis":{"approach":"先分别算 H⁺ 与 OH⁻ 的物质的量，相减得到过量的 OH⁻；再除以混合后的总体积得到浓度，最后由 pOH 求 pH。","focus":"强酸强碱混合后的 pH 计算：先算过量离子的物质的量，再算浓度，最后换算 pH。","pitfalls":"混合后体积是两者之和（0.2000 L），不是原来任一溶液的体积。过量 OH⁻ 的浓度要先算物质的量再除以总体积；pH+pOH=14 只在 25 ℃（Kw=1.0×10⁻¹⁴）时成立。","steps":["n(H⁺)=0.100 mol/L×0.1000 L=0.0100 mol；n(OH⁻)=0.120 mol/L×0.1000 L=0.0120 mol。","H⁺ 与 OH⁻ 按 1∶1 中和，OH⁻ 过量 0.0120−0.0100=0.00200 mol。","混合后总体积 V≈0.1000+0.1000=0.2000 L，（a）过量 OH⁻ 浓度 c(OH⁻)=0.00200/0.2000=0.0100 mol/L。","pOH=−lg(0.0100)=2，25 ℃ 时 pH=14−pOH=12，故（b）混合后 pH 为 12。"]},"source":"原创同步练习","level":"巩固"},{"id":"f05","topic":"结构与有机","title":"原子结构","stem":"某主族元素X的原子最外层有7个电子，核外有3个电子层。","type":"fill","points":6,"parts":[{"id":"a","prompt":"元素符号","kind":"text","answer":["Cl","氯"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"原子序数","kind":"numeric","answer":17,"points":2,"unit":"","tolerance":0,"rubric":""},{"id":"c","prompt":"X的氢化物在水溶液中的酸性：填强酸或弱酸","kind":"text","answer":["强酸"],"points":2,"unit":"","tolerance":0.01,"rubric":""}],"analysis":{"approach":"电子层数 = 周期数，最外层电子数 = 主族序数：3 个电子层是最外层 7 个电子，定位为第三周期第ⅦA 族；再按电子排布数出核电荷数。","focus":"原子结构与元素推断：电子层数定周期，最外层电子数定族。","pitfalls":"元素周期表的位置由电子排布决定：周期数 = 电子层数，主族序数 = 最外层电子数。数核外电子总数时按 2、8、7 逐层相加，不要漏掉内层电子。","steps":["3 个电子层，X 位于第三周期；最外层 7 个电子，X 位于第ⅦA 族。","第三周期第ⅦA 族元素是氯，（a）元素符号为 Cl。","核外电子总数 2+8+7=17，（b）原子序数为 17。","X 的氢化物为 HCl，在水中完全电离，（c）是强酸。"]},"source":"原创同步练习","level":"巩固"},{"id":"f06","topic":"结构与有机","title":"燃烧数据推式","stem":"某只含C、H、O的化合物0.100mol完全燃烧，生成0.200molCO₂和0.300molH₂O。已知该样品质量4.60g，C=12、H=1、O=16。","type":"fill","points":6,"parts":[{"id":"a","prompt":"每个分子中C原子数","kind":"numeric","answer":2,"points":2,"unit":"","tolerance":0,"rubric":""},{"id":"b","prompt":"每个分子中H原子数","kind":"numeric","answer":6,"points":2,"unit":"","tolerance":0,"rubric":""},{"id":"c","prompt":"分子式","kind":"text","answer":["C2H6O","C₂H₆O"],"points":2,"unit":"","tolerance":0.01,"rubric":""}],"analysis":{"approach":"先由 CO₂ 和 H₂O 的量算出 C、H 的物质的量；再用样品总质量减去 C、H 的质量得到 O 的质量，换算成物质的量；最后按 0.100 mol 样品归一到每个分子。","focus":"燃烧法确定分子式：由燃烧产物算 C、H 的量，用质量差求 O 的量。","pitfalls":"不要忘记氧的质量是用总质量减出来的（燃烧产物里没有氧的数据，因为氧部分来自空气）。归一时以样品的物质的量（0.100 mol）为基准，逐个除以 0.100 得到每个分子中的原子数。","steps":["0.100 mol 样品完全燃烧生成 0.200 mol CO₂，含 C 0.200 mol；生成 0.300 mol H₂O，含 H 0.600 mol。","C 的质量 0.200×12=2.40 g，H 的质量 0.600×1=0.600 g，合计 3.00 g；样品质量 4.60 g，故 O 的质量为 4.60−3.00=1.60 g，即 O 0.100 mol。","每 0.100 mol 样品含 C 0.200 mol、H 0.600 mol、O 0.100 mol，除以 0.100 得每个分子含 C 2 个、H 6 个、O 1 个。","（a）C 原子数 2，（b）H 原子数 6，（c）分子式为 C₂H₆O。仅凭这些数据不能区分乙醇和二甲醚，二者是同分异构体。"]},"source":"原创同步练习","level":"巩固"},{"id":"f07","topic":"物质与反应","title":"电子守恒的应用","stem":"酸性纸面反应中，0.0200molMnO₄⁻全部还原为Mn²⁺，仅Fe²⁺被氧化为Fe³⁺。","type":"fill","points":4,"parts":[{"id":"a","prompt":"转移电子的物质的量","kind":"numeric","answer":0.1,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""},{"id":"b","prompt":"被氧化的Fe²⁺物质的量","kind":"numeric","answer":0.1,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""}],"analysis":{"approach":"氧化还原反应的核心是电子守恒：得电子总数 = 失电子总数。先按化合价变化算出 MnO₄⁻ 得电子数，再折算 Fe²⁺ 的量。","focus":"电子守恒的应用：用化合价升降数算电子转移量，再按守恒求另一反应物的量。","pitfalls":"电子转移数 = 化合价变化数 × 发生该变化的微粒物质的量。MnO₄⁻ 中 Mn 由 +7 降到 +2，变化 5 价，每摩尔转移 5 mol 电子，不要误算成 7。","steps":["MnO₄⁻ 中 Mn 由 +7 价降到 Mn²⁺ 的 +2 价，每摩尔 MnO₄⁻ 得 5 mol 电子。","（a）0.0200 mol MnO₄⁻ 全部还原，转移电子的物质的量为 0.0200×5=0.100 mol。","Fe²⁺ 被氧化为 Fe³⁺，每摩尔 Fe²⁺ 失 1 mol 电子。","（b）由电子守恒，被氧化的 Fe²⁺ 的物质的量为 0.100/1=0.100 mol。"]},"source":"原创同步练习","level":"巩固"},{"id":"f08","topic":"定量分析","title":"稀释与取样","stem":"将20.00mL、0.500mol/LCuSO₄溶液稀释至100.0mL，再取其中10.00mL。忽略其他反应。","type":"fill","points":4,"parts":[{"id":"a","prompt":"稀释后CuSO₄浓度","kind":"numeric","answer":0.1,"points":2,"unit":"mol/L","tolerance":0.0005,"rubric":""},{"id":"b","prompt":"取出的10.00mL溶液中Cu²⁺物质的量","kind":"numeric","answer":0.001,"points":2,"unit":"mol","tolerance":0.00001,"rubric":""}],"analysis":{"approach":"稀释前后溶质的物质的量不变，用 c₁V₁=c₂V₂；取样时溶液是均匀的，浓度不变，物质的量按取出的体积计算。","focus":"溶液的稀释与取样：稀释用溶质守恒，取样浓度不变。","pitfalls":"稀释计算用 c₁V₁=c₂V₂ 时，两边体积的单位要一致。取样不改变浓度，但物质的量要按实际取出的体积（10.00 mL=0.01000 L）重新计算，不要直接用稀释后的总量。","steps":["稀释前后溶质物质的量不变：c₂=c₁V₁/V₂=0.500 mol/L×20.00 mL/100.0 mL=0.100 mol/L，故（a）稀释后浓度为 0.100 mol/L。","溶液均匀，取出 10.00 mL 后浓度仍为 0.100 mol/L。","（b）取出的 Cu²⁺ 物质的量 n=cV=0.100 mol/L×0.01000 L=0.00100 mol。","注意 CuSO₄ 完全电离，n(Cu²⁺)=n(CuSO₄)，不需要再乘系数。"]},"source":"原创同步练习","level":"巩固"},{"id":"e01","topic":"实验探究","title":"酸碱滴定 · 操作与数据","stem":"用0.1000mol/LNaOH滴定25.00mLHCl，加入酚酞。三次消耗体积分别为24.98、25.02、25.00mL；均在教师确认的合适终点停止。","type":"experiment","points":10,"parts":[{"id":"a","prompt":"三次平均消耗体积","kind":"numeric","answer":25,"points":2,"unit":"mL","tolerance":0.01,"rubric":""},{"id":"b","prompt":"计算HCl浓度","kind":"numeric","answer":0.1,"points":2,"unit":"mol/L","tolerance":0.0002,"rubric":""},{"id":"c","prompt":"锥形瓶为何不能用待测HCl润洗？","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"润洗会额外引入HCl；使实际HCl物质的量增加、标准NaOH消耗增大，计算结果偏高。"},{"id":"d","prompt":"描述酚酞指示终点及观察操作。","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"边滴边振荡，溶液出现均匀浅粉红色且约半分钟不褪色；接近终点减慢滴速。"}],"analysis":{"approach":"先算三次消耗体积的平均值，再按 HCl+NaOH→NaCl+H₂O 的 1∶1 计量关系求浓度；开放题按量规核对要点：润洗引入额外溶质、终点现象与操作。","focus":"酸碱中和滴定：多次测量的平均值、计量关系求浓度、锥形瓶润洗的误差、酚酞终点的判断。","pitfalls":"终点与当量点是两个概念：当量点是理论上恰好完全反应的点，终点是靠指示剂颜色变化判断的实验停止点，二者不完全相同。平均体积要用末读数减初读数逐次算出消耗体积后再平均。","steps":["（a）三次消耗体积平均值：(24.98+25.02+25.00)/3=25.00 mL。","（b）HCl+NaOH→NaCl+H₂O，计量比 1∶1，c(HCl)=c(NaOH)·V(NaOH)/V(HCl)=0.1000×25.00/25.00=0.1000 mol/L。","（c）锥形瓶若用待测 HCl 润洗，会额外引入 HCl，使实际 HCl 物质的量增加，消耗的标准 NaOH 体积增大，计算结果偏高。锥形瓶只需用蒸馏水洗净，残留的水不改变溶质的物质的量。","（d）滴定终点：边滴边振荡，溶液出现均匀的浅粉红色且约半分钟内不褪色；接近终点时减慢滴速，逐滴或半滴加入，避免过量。"]},"source":"原创同步练习","level":"综合"},{"id":"e02","topic":"实验探究","title":"一定浓度溶液的配制","stem":"用Na₂CO₃固体配制250.0mL、0.100mol/L溶液，M=106g/mol。学校实验室提供天平、烧杯、玻璃棒、容量瓶和胶头滴管等仪器。","type":"experiment","points":10,"parts":[{"id":"a","prompt":"理论所需Na₂CO₃质量","kind":"numeric","answer":2.65,"points":2,"unit":"g","tolerance":0.005,"rubric":""},{"id":"b","prompt":"容量瓶规格","kind":"numeric","answer":250,"points":2,"unit":"mL","tolerance":0,"rubric":""},{"id":"c","prompt":"说明溶解后转移到容量瓶前应注意什么。","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"待溶液恢复室温再转移；用玻璃棒引流，避免溅失。"},{"id":"d","prompt":"为何要洗涤烧杯和玻璃棒，并把洗液一并转入？","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"将残留溶质定量转移，避免溶质损失导致所配浓度偏低。"}],"analysis":{"approach":"先用 n=cV、m=nM 算溶质质量；容量瓶规格按目标体积选择；开放题的关键是“定量转移”——溶质不能少、体积要准确。","focus":"配制一定物质的量浓度溶液：质量计算、容量瓶选择、冷却转移与洗涤的定量转移思想。","pitfalls":"容量瓶不能作为加热、直接溶解或长期储存的容器；溶解产生的热会使溶液体积膨胀，热溶液直接定容、冷却后体积会缩小，导致浓度偏高。转移时要用玻璃棒引流，避免液体溅出。","steps":["（a）n(Na₂CO₃)=cV=0.100 mol/L×0.2500 L=0.0250 mol，m=nM=0.0250×106=2.65 g。","（b）配制 250.0 mL 溶液，应选用 250 mL 容量瓶，规格与目标体积一致。","（c）溶解后应待溶液恢复至室温再转移到容量瓶；转移时用玻璃棒引流，避免液体溅失。","（d）烧杯和玻璃棒上残留少量溶质，洗涤并把洗液一并转入容量瓶，才能把溶质定量转移；否则溶质损失，所配溶液浓度偏低。"]},"source":"原创同步练习","level":"综合"},{"id":"e03","topic":"实验探究","title":"装置检漏与现象解释","stem":"研究小组准备用常温固液反应的密闭装置收集气体。装置含反应瓶、单孔塞和导气管。现仅讨论检漏与收集设计，不涉及危险气体制备。","type":"experiment","points":9,"parts":[{"id":"a","prompt":"连接好后，应先装药品还是先检漏？","kind":"text","answer":["先检漏","检漏","先检查气密性","检查气密性"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"提出一种可观察、可判断的检漏方案。","kind":"manual","answer":null,"points":4,"unit":"","tolerance":0.01,"rubric":"例如导管末端浸入水中，手握瓶身微热，观察气泡；停止加热后观察导管内形成一段稳定水柱。须说明封闭体系和判据。"},{"id":"c","prompt":"选择排水收集时，对气体与水的关系有什么要求？","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"气体在水中溶解度较小，并且不与水发生使收集受影响的反应；还需考虑安全与纯度。"}],"analysis":{"approach":"气密性检查的逻辑是“先检漏、后装药”：用加热使封闭体系内气体膨胀（或降温使体积收缩），观察是否产生可判断的现象；收集方法由气体与水的关系决定。","focus":"气体发生装置的气密性检查与收集方法选择：检漏的顺序、方案设计与判据、排水集气法的适用条件。","pitfalls":"检漏方案必须说清三点：体系如何封闭、怎样改变压强、观察到什么现象算气密性良好。只说“检查气密性”而不给判据，方案就不完整。具体方案应与装置结构相适应。","steps":["（a）应先检漏再装药品：若装药后再发现漏气，既无法定位泄漏点，也可能导致气体逸散或药品浪费。","（b）一种可行的方案：将导管末端浸入水中，用手握住反应瓶外壁微热，导管口有气泡冒出；松手冷却后，导管内形成一段稳定的水柱且一段时间内不回落，说明气密性良好。","（c）排水收集要求气体在水中的溶解度较小，并且不与水发生使收集受影响的反应；还要考虑安全性与纯度要求。","补充：若气体易溶于水或与水反应（如 HCl、NH₃），不能用排水法收集，应改用排空气法等其他方法。"]},"source":"原创同步练习","level":"综合"},{"id":"e04","topic":"实验探究","title":"速率实验 · 控制变量","stem":"用相同反应研究浓度与温度对速率的影响。实验A：20°C、[A]=0.10mol/L，某一反应进程用时80s；B：20°C、[A]=0.20mol/L，用时40s；C：30°C、[A]=0.10mol/L，用时35s。其他条件相同。","type":"experiment","points":10,"parts":[{"id":"a","prompt":"只研究浓度影响应比较哪两组？填如AB。","kind":"text","answer":["AB","A和B","A与B"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"只研究温度影响应比较哪两组？","kind":"text","answer":["AC","A和C","A与C"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"c","prompt":"B的平均相对速率约为A的多少倍？按同一进程所需时间的倒数比较。","kind":"numeric","answer":2,"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"d","prompt":"仅凭这些数据，能否断言反应是某个单一步基元反应？说明理由。","kind":"manual","answer":null,"points":4,"unit":"","tolerance":0.01,"rubric":"不能；宏观速率规律不唯一确定微观机理，且有限条件数据不足以排除其他机理。"}],"analysis":{"approach":"控制变量：研究浓度只比较温度相同的 A、B；研究温度只比较浓度相同的 A、C。同一反应进程的平均速率与所需时间成反比。","focus":"控制变量法设计对照实验：比较对象要“只有一个变量不同”，速率比较用时间的倒数。","pitfalls":"速率变快不等于平衡产率提高：速率说的是快慢，产率说的是最终转化程度，是两个不同的概念。宏观速率规律不能唯一确定微观反应机理。","steps":["（a）只研究浓度的影响，应比较 A 与 B：两者温度相同（20 ℃），只有反应物浓度不同（0.10 与 0.20 mol/L），填 AB。","（b）只研究温度的影响，应比较 A 与 C：两者浓度相同（0.10 mol/L），只有温度不同（20 ℃ 与 30 ℃），填 AC。","（c）同一反应进程，平均速率与所需时间近似成反比：v(B)/v(A)=t(A)/t(B)=80/40=2，B 的平均相对速率约为 A 的 2 倍。","（d）不能断言：宏观速率数据只能反映反应快慢随条件的变化，不能唯一确定微观机理；有限条件的数据也不足以排除其他机理。"]},"source":"原创同步练习","level":"综合"},{"id":"e05","topic":"实验探究","title":"未知盐溶液 · 证据链","stem":"一份只含一种常见可溶性盐的溶液，焰色观察显示黄色；另取样加入稀盐酸无明显现象，继续加入BaCl₂溶液出现白色沉淀，沉淀在该酸性条件下不消失。假定无其他干扰离子。","type":"experiment","points":10,"parts":[{"id":"a","prompt":"黄色焰色提示的阳离子符号","kind":"text","answer":["Na+","Na⁺","钠离子"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"白色酸不溶沉淀的化学式","kind":"text","answer":["BaSO4","BaSO₄"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"c","prompt":"在题设限制下，该盐最合理的化学式","kind":"text","answer":["Na2SO4","Na₂SO₄"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"d","prompt":"解释先加稀盐酸，再加BaCl₂的证据作用。","kind":"manual","answer":null,"points":4,"unit":"","tolerance":0.01,"rubric":"先酸化排除碳酸根等会形成酸溶性钡盐沉淀的干扰；选择盐酸而非硫酸避免人为引入SO₄²⁻。本题已限制其他干扰。"}],"analysis":{"approach":"按证据链推理：焰色黄色定阳离子为 Na⁺；先加盐酸无现象排除碳酸根等干扰；再加 BaCl₂ 产生酸不溶白色沉淀定阴离子为 SO₄²⁻；两者结合确定盐的化学式。","focus":"未知盐溶液的鉴定：焰色反应、酸化排除干扰、BaCl₂ 检验 SO₄²⁻，证据链缺一不可。","pitfalls":"先加稀盐酸的作用是排除干扰：若直接加 BaCl₂，BaCO₃、BaSO₃ 等白色沉淀也会出现，无法区分。选择盐酸而不是硫酸，是为了避免人为引入 SO₄²⁻。在题设“无其他干扰、只含一种盐”的限制下才能判为 Na₂SO₄；真实未知样品的检验需更完整的干扰控制。","steps":["（a）焰色反应呈黄色，提示阳离子为 Na⁺。","（b）先加稀盐酸无明显现象，再加 BaCl₂ 出现白色沉淀且在酸性条件下不消失，说明沉淀是 BaSO₄。","（c）该盐只含一种常见可溶性盐，阳离子为 Na⁺、阴离子为 SO₄²⁻，最合理的化学式为 Na₂SO₄。","（d）先加稀盐酸：酸化可排除 CO₃²⁻ 等会形成酸溶性钡盐沉淀的离子的干扰；若直接加 BaCl₂ 产生沉淀，无法确定是 BaSO₄ 还是 BaCO₃ 等。选用盐酸而非硫酸，是为了避免引入 SO₄²⁻ 造成假阳性。"]},"source":"原创同步练习","level":"综合"},{"id":"e06","topic":"实验探究","title":"结晶分离 · 方案与理由","stem":"KNO₃中混有少量NaCl。已知KNO₃溶解度随温度升高显著增大，NaCl随温度改变较小。仅讨论教师指导下的分离原理。","type":"experiment","points":9,"parts":[{"id":"a","prompt":"浓热溶液获得KNO₃晶体主要采用升温还是降温？","kind":"text","answer":["降温","冷却","降温结晶","冷却结晶"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"写出从混合固体到分离晶体的主要操作链。","kind":"manual","answer":null,"points":4,"unit":"","tolerance":0.01,"rubric":"用适量热水溶解，形成浓热溶液；冷却结晶，再过滤分离晶体。必要时重结晶提高纯度。"},{"id":"c","prompt":"为什么不能认为一次结晶就能得到绝对纯净的KNO₃？","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"晶体可夹带母液或含少量杂质，分离不是绝对选择性的；纯度需检验。"}],"analysis":{"approach":"分离依据是溶解度随温度变化的差异：KNO₃ 溶解度随温度升高显著增大，NaCl 变化很小。用热水溶解后降温，KNO₃ 大量析出，NaCl 留在母液中。","focus":"冷却结晶分离：利用两种溶质溶解度随温度变化的差异分离 KNO₃ 与 NaCl。","pitfalls":"一次结晶不是绝对纯化：晶体表面会夹带母液，晶体内部也可能包裹少量杂质，纯度需要检验，必要时重结晶。冷却结晶适用于溶解度随温度变化大的溶质；溶解度随温度变化小的 NaCl 通常用蒸发结晶。","steps":["（a）浓热溶液获得 KNO₃ 晶体主要采用降温（冷却结晶）：温度降低，KNO₃ 的溶解度显著减小，过饱和的部分以晶体析出。","（b）主要操作链：用适量热水溶解混合固体，形成 KNO₃ 的浓热溶液；冷却结晶；过滤分离出 KNO₃ 晶体。必要时可重结晶提高纯度。","（c）一次结晶得到的晶体可夹带母液或含有少量杂质，分离不是绝对选择性的，不能认为一次结晶就得到绝对纯净的 KNO₃；纯度需要检验。","补充：NaCl 的溶解度随温度变化较小，降温时主要留在母液中，从而实现与 KNO₃ 的分离。"]},"source":"原创同步练习","level":"综合"},{"id":"s13","topic":"物质与反应","title":"胶体的性质","stem":"下列关于 Fe(OH)₃ 胶体的说法，正确的是？","type":"single","points":4,"options":["胶体属于纯净物","用一束光照射，从侧面可看到一条光亮的通路","分散质粒子直径小于 1 nm","胶体一定是液态的"],"answer":1,"analysis":{"approach":"胶体是分散系，判断依据有三：分散质粒子直径 1~100 nm、丁达尔效应、分散质与分散剂的物态可以多样。逐项对照即可。","focus":"胶体的基本性质：分散系的分类、粒子直径范围、丁达尔效应、胶体的物态。","pitfalls":"胶体不是一种物质，而是一种分散系（混合物）。分散质粒子直径 1~100 nm 是胶体区别于溶液（小于 1 nm）与浊液（大于 100 nm）的关键。丁达尔效应是区分胶体与溶液的常用方法。","steps":["A 项错误：胶体是分散系，由分散质和分散剂组成，属于混合物，不是纯净物。","B 项正确：胶体能产生丁达尔效应，用一束光照射，从侧面可看到一条光亮的通路，这是胶体的特征现象。","C 项错误：胶体分散质粒子的直径为 1~100 nm；小于 1 nm 的是溶液中的离子或分子。","D 项错误：胶体不一定是液态的，气溶胶（如雾、烟）、固溶胶（如烟水晶、有色玻璃）同样属于胶体。"]},"source":"原创同步练习","level":"巩固"},{"id":"s14","topic":"物质与反应","title":"离子方程式的定量关系","stem":"向 NaHSO₄ 溶液中滴加 Ba(OH)₂ 溶液，恰好使溶液呈中性。该反应的离子方程式是？","type":"single","points":4,"options":["Ba²⁺+SO₄²⁻→BaSO₄↓","2H⁺+SO₄²⁻+Ba²⁺+2OH⁻→BaSO₄↓+2H₂O","H⁺+SO₄²⁻+Ba²⁺+OH⁻→BaSO₄↓+H₂O","2H⁺+SO₄²⁻+Ba²⁺+OH⁻→BaSO₄↓+2H₂O"],"answer":1,"analysis":{"approach":"先定比例：中性要求 H⁺ 与 OH⁻ 恰好完全中和；NaHSO₄ 提供 H⁺ 与 SO₄²⁻ 为 1∶1，Ba(OH)₂ 提供 Ba²⁺ 与 OH⁻ 为 1∶2。取 1 份 Ba(OH)₂（2 份 OH⁻）需 2 份 H⁺ 中和，即 2 份 NaHSO₄；此时共 2 份 SO₄²⁻，只有 1 份与 Ba²⁺ 沉淀。","focus":"离子方程式的定量关系：由“恰好中性”确定 H⁺ 与 OH⁻ 的比例，注意 Ba(OH)₂ 中 Ba²⁺ 与 OH⁻ 是 1∶2。","pitfalls":"定量关系题要先由条件确定两种反应物的物质的量之比，再写方程式；不要直接按 1∶1 配平。写完后检查元素守恒与电荷守恒，并验证“中性”条件是否真正满足（H⁺ 与 OH⁻ 是否恰好抵消）。","steps":["第一步：溶液恰好呈中性，要求 H⁺ 与 OH⁻ 恰好完全中和，二者物质的量相等。","第二步：Ba(OH)₂ 中 Ba²⁺ 与 OH⁻ 之比为 1∶2。取 1 mol Ba(OH)₂，提供 2 mol OH⁻，需 2 mol H⁺ 中和，即需 2 mol NaHSO₄，此时共引入 2 mol SO₄²⁻。","第三步：1 mol Ba²⁺ 只能沉淀 1 mol SO₄²⁻，另 1 mol SO₄²⁻ 留在溶液中（与 Na⁺ 结合成 Na₂SO₄，不写入离子方程式）。","第四步：离子方程式为 2H⁺+SO₄²⁻+Ba²⁺+2OH⁻→BaSO₄↓+2H₂O，选 B。","A 项漏写了 H⁺ 与 OH⁻ 生成水；C 项对应“SO₄²⁻ 恰好完全沉淀”（NaHSO₄ 与 Ba(OH)₂ 为 1∶1）的情形，此时 OH⁻ 有剩余，溶液呈碱性，不是中性；D 项电荷与氢元素都不守恒。"]},"source":"原创同步练习","level":"巩固"},{"id":"s15","topic":"物质与反应","title":"氧化还原的定量关系","stem":"反应 3Cl₂+8NH₃→6NH₄Cl+N₂ 中，被氧化的 NH₃ 与被还原的 Cl₂ 的物质的量之比是？","type":"single","points":4,"options":["3∶2","2∶3","1∶3","3∶1"],"answer":1,"analysis":{"approach":"先标化合价：NH₃ 中 N 为 −3 价，N₂ 中为 0 价，Cl₂ 中 Cl 为 0 价，NH₄Cl 中 Cl 为 −1 价。再数清“被氧化”的 NH₃ 只有生成 N₂ 的那部分，其余 6 mol NH₃ 只起酸碱作用。","focus":"氧化还原的定量关系：区分“参与氧化还原的反应物”与“只起酸碱作用的反应物”，再按电子守恒验算。","pitfalls":"NH₃ 在这个反应中有双重角色：2 mol 被氧化成 N₂，6 mol 与 HCl 结合成 NH₄Cl（N 的化合价不变）。算“被氧化的 NH₃”只能计入生成 N₂ 的 2 mol，不能把 8 mol 全算进去。","steps":["第一步：标化合价。NH₃ 中 N 为 −3 价，产物 N₂ 中 N 为 0 价；Cl₂ 中 Cl 为 0 价，NH₄Cl 中 Cl 为 −1 价。","第二步：8 mol NH₃ 中只有 2 mol 被氧化为 N₂（N 由 −3 升至 0，共失 6 mol 电子），其余 6 mol NH₃ 化合价不变，只与生成的 HCl 结合成 NH₄Cl。","第三步：3 mol Cl₂ 全部被还原为 Cl⁻（0→−1，共得 6 mol 电子），得失电子数相等，符合电子守恒。","第四步：被氧化的 NH₃（2 mol）与被还原的 Cl₂（3 mol）的物质的量之比为 2∶3，选 B。"]},"source":"原创同步练习","level":"巩固"},{"id":"s16","topic":"物质与反应","title":"氧化物的分类","stem":"下列关于氧化物分类的说法，正确的是？","type":"single","points":4,"options":["Na₂O₂ 是碱性氧化物","CO 是酸性氧化物","Al₂O₃ 是两性氧化物","SiO₂ 与水直接反应生成硅酸"],"answer":2,"analysis":{"approach":"按定义逐项判断：碱性氧化物是与酸反应只生成盐和水的氧化物；酸性氧化物是与碱反应只生成盐和水的氧化物；两性氧化物是既能与酸又能与碱反应生成盐和水的氧化物。","focus":"氧化物的分类：碱性氧化物、酸性氧化物、两性氧化物、不成盐氧化物的定义与实例。","pitfalls":"判断氧化物类型看“与酸或碱反应的产物”：Na₂O₂ 与酸反应还放出 O₂，不符合碱性氧化物的定义；CO、NO 等不能与酸或碱反应生成盐，属于不成盐氧化物。","steps":["A 项错误：Na₂O₂ 与酸反应除了生成盐和水，还放出 O₂，不符合碱性氧化物“只生成盐和水”的定义，它属于过氧化物。","B 项错误：CO 不能与碱反应生成盐，也没有对应价态的含氧酸，属于不成盐氧化物，不是酸性氧化物。","C 项正确：Al₂O₃ 既能与强酸反应生成铝盐和水，也能与强碱反应生成偏铝酸盐和水，是典型的两性氧化物。","D 项错误：SiO₂ 是酸性氧化物，但它不与水直接反应生成硅酸；酸性氧化物不一定都能与水反应。"]},"source":"原创同步练习","level":"巩固"},{"id":"s17","topic":"元素及其化合物","title":"钠的两种氧化物","stem":"关于 Na₂O 与 Na₂O₂ 的比较，正确的是？","type":"single","points":4,"options":["两者与水反应都只生成 NaOH","Na₂O₂ 与 CO₂ 反应生成 Na₂CO₃ 并放出 O₂","两者都能使滴有酚酞的水先变红后褪色","两者都是白色固体"],"answer":1,"analysis":{"approach":"对比两者的组成与反应：Na₂O 是普通氧化物，与水、CO₂ 反应只生成 NaOH、Na₂CO₃；Na₂O₂ 含过氧键（O—O），与水、CO₂ 反应都放出 O₂，且有强氧化性。","focus":"Na₂O 与 Na₂O₂ 的比较：与水、CO₂ 的反应、漂白性、颜色。","pitfalls":"Na₂O₂ 与水反应放出 O₂：2Na₂O₂+2H₂O→4NaOH+O₂↑；与 CO₂ 反应：2Na₂O₂+2CO₂→2Na₂CO₃+O₂。Na₂O₂ 使酚酞“先变红后褪色”：先是 NaOH 使酚酞变红，后是 Na₂O₂ 的强氧化性使红色褪去。","steps":["A 项错误：Na₂O 与水反应只生成 NaOH，但 Na₂O₂ 与水反应除了生成 NaOH 还放出 O₂，两者产物不同。","B 项正确：2Na₂O₂+2CO₂→2Na₂CO₃+O₂↑，生成 Na₂CO₃ 并放出 O₂。","C 项错误：只有 Na₂O₂ 能使滴有酚酞的水先变红后褪色（强氧化性漂白）；Na₂O 只生成 NaOH，只能使酚酞变红，不会褪色。","D 项错误：Na₂O 为白色固体，Na₂O₂ 为淡黄色固体，颜色不同。"]},"source":"原创同步练习","level":"巩固"},{"id":"s18","topic":"元素及其化合物","title":"氯水的漂白","stem":"新制氯水中，使有色布条褪色的微粒是？","type":"single","points":4,"options":["Cl₂","HClO","H⁺","Cl⁻"],"answer":1,"analysis":{"approach":"氯水中有多种微粒：Cl₂、HClO、H⁺、Cl⁻、ClO⁻、H₂O 等。漂白作用来自 HClO 的强氧化性，关键证据是干燥氯气不能使干燥有色布条褪色。","focus":"氯水的成分与漂白原理：起漂白作用的是 HClO，而不是 Cl₂ 本身。","pitfalls":"区分“氯气”与“氯水”：干燥的 Cl₂ 没有漂白性，Cl₂ 与水反应生成的 HClO 才有漂白性。HClO 漂白是氧化漂白，破坏有色物质的发色基团，褪色后不可复原。","steps":["A 项错误：干燥氯气不能使干燥有色布条褪色，说明 Cl₂ 本身没有漂白性。","B 项正确：Cl₂+H₂O⇌HCl+HClO，生成的 HClO 具有强氧化性，能破坏有色物质的发色基团，使有色布条褪色。","C 项错误：H⁺ 使溶液呈酸性，但没有漂白作用；盐酸不能使有色布条褪色。","D 项错误：Cl⁻ 性质稳定，没有氧化性，也没有漂白作用。"]},"source":"原创同步练习","level":"巩固"},{"id":"s19","topic":"元素及其化合物","title":"铁三角中的氧化还原","stem":"下列转化中，必须加入氧化剂才能实现的是？","type":"single","points":4,"options":["Fe³⁺→Fe²⁺","Fe²⁺→Fe³⁺","Fe³⁺→Fe(OH)₃","Fe₂O₃→Fe"],"answer":1,"analysis":{"approach":"先判断每个转化中 Fe 的化合价变化：升价是氧化，需加氧化剂；降价是还原，需加还原剂；化合价不变就不是氧化还原反应。","focus":"铁三角的转化：由化合价升降判断氧化与还原，再决定需要加入氧化剂还是还原剂。","pitfalls":"“必须加入氧化剂”只针对化合价升高的转化。Fe³⁺→Fe(OH)₃ 只是加碱生成沉淀，Fe 的化合价仍为 +3，不属于氧化还原反应，不需要氧化剂或还原剂。","steps":["A 项错误：Fe³⁺→Fe²⁺，Fe 由 +3 价降到 +2 价，得电子被还原，需要加入还原剂。","B 项正确：Fe²⁺→Fe³⁺，Fe 由 +2 价升到 +3 价，失电子被氧化，必须加入氧化剂（如氯水、H₂O₂ 等）。","C 项错误：Fe³⁺→Fe(OH)₃ 只是加入碱生成沉淀，Fe 的化合价没有变化，不是氧化还原反应。","D 项错误：Fe₂O₃→Fe，Fe 由 +3 价降到 0 价，得电子被还原，需要加入还原剂（如 CO、H₂ 等）。"]},"source":"原创同步练习","level":"巩固"},{"id":"s20","topic":"元素及其化合物","title":"铝及其化合物","stem":"下列有关铝及其化合物的说法，正确的是？","type":"single","points":4,"options":["铝在空气中稳定，说明铝的化学性质不活泼","Al(OH)₃ 既能溶于 NaOH 溶液，也能溶于盐酸","氧化铝坩埚可用于熔融 NaOH","铝制容器可长期盛放酸性食物"],"answer":1,"analysis":{"approach":"铝的活泼性与氧化膜保护是两个层面：铝本身活泼，但表面致密的 Al₂O₃ 薄膜使它在空气中稳定。Al₂O₃ 与 Al(OH)₃ 都是两性物质，既能与强酸反应又能与强碱反应。","focus":"铝及其化合物：氧化膜的保护作用、Al₂O₃ 与 Al(OH)₃ 的两性。","pitfalls":"两性物质的判断：既能与强酸反应生成盐和水，又能与强碱反应生成盐和水。Al₂O₃ 与 NaOH 反应生成 NaAlO₂，所以氧化铝坩埚不能熔融 NaOH；同理铝制品不宜长期接触酸性或碱性食物。","steps":["A 项错误：铝的化学性质比较活泼，在空气中稳定是因为表面形成了一层致密的氧化铝薄膜，阻止内部铝继续被氧化。","B 项正确：Al(OH)₃ 是两性氢氧化物，既能溶于盐酸（Al(OH)₃+3HCl→AlCl₃+3H₂O），也能溶于 NaOH 溶液（Al(OH)₃+NaOH→NaAlO₂+2H₂O）。","C 项错误：Al₂O₃ 是两性氧化物，能与熔融 NaOH 反应生成 NaAlO₂ 和水，会腐蚀坩埚，不能用氧化铝坩埚熔融 NaOH。","D 项错误：铝能与酸反应，酸性食物会破坏铝表面的氧化膜并腐蚀铝制品，所以铝制容器不宜长期盛放酸性食物。"]},"source":"原创同步练习","level":"巩固"},{"id":"s21","topic":"结构与有机","title":"同周期性质的递变","stem":"Na、Mg、Al 三种元素位于同一周期。下列比较正确的是？","type":"single","points":4,"options":["原子半径：Na<Mg<Al","金属性：Na>Mg>Al","最高价氧化物对应水化物的碱性：NaOH<Mg(OH)₂","第一电离能：Na>Mg"],"answer":1,"analysis":{"approach":"同周期从左到右：核电荷数增大，原子半径减小，金属性减弱，最高价氧化物对应水化物的碱性减弱。第一电离能总体呈增大趋势，但有反常（如 Mg 大于 Al）。","focus":"同周期元素性质的递变规律：原子半径、金属性、最高价氧化物对应水化物的碱性、第一电离能。","pitfalls":"原子半径的递变是同周期从左到右依次减小；金属性与最高价氧化物对应水化物的碱性同向变化。第一电离能要注意反常：Mg 的 3s² 为全满结构，第一电离能高于同周期相邻元素。","steps":["A 项错误：同周期从左到右原子半径依次减小，应为 Na>Mg>Al。","B 项正确：同周期从左到右金属性依次减弱，金属性 Na>Mg>Al。","C 项错误：金属性越强，最高价氧化物对应水化物的碱性越强，应为 NaOH>Mg(OH)₂，NaOH 碱性最强。","D 项错误：Mg 的 3s 轨道为全满结构，较稳定，第一电离能反而高于 Na，应为 Mg>Na。"]},"source":"原创同步练习","level":"巩固"},{"id":"s22","topic":"结构与有机","title":"化学键的类型","stem":"下列物质中，既含离子键又含共价键的是？","type":"single","points":4,"options":["NaCl","HCl","NaOH","CO₂"],"answer":2,"analysis":{"approach":"离子键存在于阴阳离子之间，共价键存在于原子之间（共用电子对）。判断时先看物质由哪些微粒构成，再看微粒内部与微粒之间各是什么键。","focus":"化学键的类型：离子键与共价键的判断，NaOH 中两种键共存。","pitfalls":"活泼金属与活泼非金属之间一般形成离子键；非金属原子之间一般形成共价键。含 OH⁻、NH₄⁺ 等原子团的离子化合物中，往往同时含有离子键与共价键。","steps":["A 项错误：NaCl 只含 Na⁺ 与 Cl⁻ 之间的离子键。","B 项错误：HCl 只含 H 与 Cl 之间的共价键。","C 项正确：NaOH 中 Na⁺ 与 OH⁻ 之间是离子键，OH⁻ 内部 O 与 H 之间是共价键，两种键都有。","D 项错误：CO₂ 只含 C 与 O 之间的共价键。"]},"source":"原创同步练习","level":"巩固"},{"id":"s23","topic":"结构与有机","title":"烯烃的同分异构","stem":"分子式为 C₄H₈、能使溴水褪色的链状化合物（不考虑顺反异构）共有几种？","type":"single","points":4,"options":["2","3","4","5"],"answer":1,"analysis":{"approach":"先算不饱和度：C₄H₈ 相比饱和烷烃 C₄H₁₀ 少 2 个 H，含一个碳碳双键或一个环。再列出链状单烯烃的全部结构，注意环烷烃不能使溴水褪色。","focus":"烯烃的同分异构体：由分子式定不饱和度，列出链状单烯烃的全部结构。","pitfalls":"“能使溴水褪色”是关键限制：环烷烃虽符合 C₄H₈，但与溴水不发生加成反应，不能使溴水褪色，不计入。列举时先定碳骨架，再定双键位置，用对称性去重。","steps":["第一步：C₄H₈ 的不饱和度为 1，链状结构只能是单烯烃（含一个碳碳双键）。","第二步：直链骨架上双键位置有两种：丁-1-烯（CH₂=CHCH₂CH₃）与丁-2-烯（CH₃CH=CHCH₃）。","第三步：支链骨架上只有一种：2-甲基丙烯（CH₂=C(CH₃)₂）。","第四步：合计 3 种，选 B。环烷烃（如环丁烷、甲基环丙烷）同样符合 C₄H₈，但不能使溴水因加成而褪色，不计入。"]},"source":"原创同步练习","level":"巩固"},{"id":"s24","topic":"结构与有机","title":"官能团的鉴别","stem":"下列化学方法能区分乙醇溶液和乙酸溶液的是？","type":"single","points":4,"options":["分别加入 NaHCO₃ 溶液，观察是否有气泡","分别加入 NaCl 溶液","分别滴加酚酞试液","分别加入 CuSO₄ 溶液"],"answer":0,"analysis":{"approach":"区分乙醇与乙酸，要找只与其中一种发生明显反应的试剂：乙酸含羧基（—COOH），酸性强于碳酸，能与 NaHCO₃ 反应放出 CO₂；乙醇的羟基不能与 NaHCO₃ 反应。","focus":"官能团的鉴别：羧基与羟基的性质差异，用 NaHCO₃ 检验羧基。","pitfalls":"鉴别题的试剂必须与两者产生“明显不同的现象”。酚酞在乙醇（中性）与乙酸（酸性）中都无色，无法区分；NaCl、CuSO₄ 与两者均无明显不同现象。","steps":["A 项正确：乙酸含羧基，与 NaHCO₃ 反应放出 CO₂，出现气泡：CH₃COOH+NaHCO₃→CH₃COONa+CO₂↑+H₂O；乙醇不与 NaHCO₃ 反应，无现象，两者可区分。","B 项错误：NaCl 与乙醇、乙酸均不反应，没有明显现象，无法区分。","C 项错误：酚酞在酸性与中性溶液中都无色，乙醇溶液与乙酸溶液滴加酚酞后都无色，无法区分。","D 项错误：CuSO₄ 与乙醇、乙酸均无明显不同的现象，无法区分。"]},"source":"原创同步练习","level":"巩固"},{"id":"s25","topic":"反应原理","title":"反应热与状态","stem":"已知 H₂(g)+½O₂(g)=H₂O(l) ΔH=−285.8 kJ/mol。下列说法正确的是？","type":"single","points":4,"options":["该反应为吸热反应","1 mol H₂ 完全燃烧生成液态水放出 285.8 kJ 热量","生成 1 mol 水蒸气放出的热量大于 285.8 kJ","反应物的总能量低于生成物的总能量"],"answer":1,"analysis":{"approach":"热化学方程式中 ΔH 的符号决定吸放热，数值对应方程式中各物质的量（1 mol H₂ 生成 1 mol 液态水）。物质的状态影响反应热：气态水变成液态水还要放热。","focus":"反应热与物质状态：ΔH 的符号与数值含义、反应物与生成物的总能量比较、气态水与液态水的反应热差异。","pitfalls":"ΔH<0 表示放热反应，此时反应物总能量高于生成物总能量。热化学方程式中的 ΔH 与物质的量和状态一一对应：生成 1 mol 水蒸气放出的热量小于生成 1 mol 液态水放出的热量（约 285.8−44=241.8 kJ）。","steps":["A 项错误：ΔH=−285.8 kJ/mol，小于 0，表示该反应为放热反应。","B 项正确：按方程式，1 mol H₂ 完全燃烧生成 1 mol 液态水，放出 285.8 kJ 热量。","C 项错误：气态水变为液态水还要放热，所以生成 1 mol 水蒸气放出的热量小于 285.8 kJ。","D 项错误：放热反应的反应物总能量高于生成物总能量，多余的能量以热的形式放出。"]},"source":"原创同步练习","level":"巩固"},{"id":"s26","topic":"反应原理","title":"影响速率的因素","stem":"对于 N₂(g)+3H₂(g)⇌2NH₃(g)，下列措施能同时加快正、逆反应速率的是？","type":"single","points":4,"options":["升高温度","增大容器体积","及时移走 NH₃","加入催化剂但降低温度"],"answer":0,"analysis":{"approach":"判断措施对正、逆反应速率的影响：升温使正、逆速率都增大；增大体积使浓度下降，正、逆速率都减小；移走产物只减小逆反应速率；催化剂与降温的作用方向相反。","focus":"影响化学反应速率的因素：温度、浓度、催化剂、移走产物对正、逆反应速率的不同影响。","pitfalls":"升高温度、加入催化剂、增大反应物浓度都能同时加快正、逆反应速率；移走产物只减小逆反应速率。注意 D 项是“加催化剂但降温”，两个作用方向相反，叠加后是否“同时加快”无法确定，不能选。","steps":["A 项正确：升高温度使活化分子百分数增大，正、逆反应速率都增大。","B 项错误：增大容器体积使各物质浓度下降，正、逆反应速率都减小。","C 项错误：及时移走 NH₃ 使生成物浓度下降，只减小逆反应速率，正反应速率基本不变。","D 项错误：催化剂能加快正、逆反应速率，但降低温度会使正、逆反应速率都减慢，两者叠加后是否同时加快无法确定。"]},"source":"原创同步练习","level":"巩固"},{"id":"m05","topic":"物质与反应","title":"离子反应的条件","stem":"关于离子反应，下列说法正确的有？","type":"multi","points":6,"options":["生成沉淀、放出气体或生成水，是复分解反应能够发生的条件","强酸与强碱反应的离子方程式一定都是 H⁺+OH⁻→H₂O","离子方程式能表示同一类反应的本质","难溶物在离子方程式中一律写成化学式"],"answer":[0,2],"analysis":{"approach":"逐项核对定义的严谨性：复分解的条件、离子方程式的适用范围、“一律”类绝对表述是否有例外。","focus":"离子反应的条件与离子方程式的书写规则：复分解条件、离子方程式的意义、微溶物的处理。","pitfalls":"看到“一律”“一定”“都是”这类绝对表述要格外警惕，找一个反例就能否定它。微溶物作反应物且为澄清溶液时拆写，作生成物或浑浊液时保留化学式。","steps":["A 项正确：复分解反应向生成沉淀、放出气体或生成弱电解质（如水）的方向进行，这些是复分解反应能够发生的条件。","B 项错误：不是所有强酸与强碱反应的离子方程式都是 H⁺+OH⁻→H₂O，例如 Ba(OH)₂ 与 H₂SO₄ 还要写出 Ba²⁺ 与 SO₄²⁻ 生成 BaSO₄ 沉淀。","C 项正确：离子方程式用实际参加反应的离子表示反应，能表示同一类反应的本质，例如 H⁺+OH⁻→H₂O 表示强酸与强碱的中和。","D 项错误：难溶物在离子方程式中一般写化学式，但“不是一律”——微溶物作反应物且为澄清溶液时可以拆写成离子。"]},"source":"原创同步练习","level":"综合"},{"id":"m06","topic":"元素及其化合物","title":"钠与氯的性质","stem":"下列有关钠、氯及其化合物的说法，正确的有？","type":"multi","points":6,"options":["钠保存在煤油中，是为了隔绝空气中的 O₂ 和水蒸气","氯气溶于水生成盐酸和次氯酸，次氯酸见光易分解","钠着火时可用水扑灭","漂白粉的有效成分是 Ca(ClO)₂"],"answer":[0,1,3],"analysis":{"approach":"逐项核对钠、氯及其化合物的性质与安全常识：钠的保存、氯水的成分与 HClO 的见光分解、钠着火的灭火方法、漂白粉的有效成分。","focus":"钠与氯的性质：金属钠的保存与灭火、氯水的成分、漂白粉的有效成分。","pitfalls":"钠着火绝对不能用水扑灭：钠与水剧烈反应生成氢气并放热，会加剧燃烧甚至爆炸，应用干燥沙土覆盖。氯气溶于水生成盐酸和次氯酸，HClO 见光易分解，所以氯水要避光保存。","steps":["A 项正确：钠化学性质活泼，易与空气中的 O₂、水蒸气反应，保存在煤油中可以隔绝空气。","B 项正确：Cl₂+H₂O⇌HCl+HClO，氯水的主要成分包括盐酸和次氯酸；HClO 见光易分解：2HClO→2HCl+O₂↑。","C 项错误：钠与水剧烈反应生成氢气并放热，会加剧燃烧甚至爆炸，钠着火应用干燥沙土覆盖，不能用水扑灭。","D 项正确：漂白粉的主要成分是 CaCl₂ 和 Ca(ClO)₂，有效成分是 Ca(ClO)₂，漂白作用来自它与酸或 CO₂ 作用生成的 HClO。"]},"source":"原创同步练习","level":"综合"},{"id":"m07","topic":"结构与有机","title":"晶体的性质","stem":"关于晶体类型与性质，下列说法正确的有？","type":"multi","points":6,"options":["离子晶体中一定含有金属元素","分子晶体的熔点通常低于离子晶体","金刚石是共价晶体，硬度很大","金属晶体能导电，是因为存在自由移动的电子"],"answer":[1,2,3],"analysis":{"approach":"四类晶体按构成微粒与微粒间作用力区分：离子晶体由离子构成，分子晶体由分子构成，共价晶体由原子通过共价键形成网络，金属晶体由金属阳离子与自由电子构成。","focus":"晶体类型与性质：离子晶体、分子晶体、共价晶体、金属晶体的构成与性质。","pitfalls":"离子晶体不一定含金属元素：铵盐（如 NH₄Cl）由 NH₄⁺ 与 Cl⁻ 构成，是离子晶体但不含金属元素。熔点高低一般为共价晶体 > 离子晶体 > 分子晶体（金属晶体差异较大）。","steps":["A 项错误：离子晶体不一定含有金属元素，例如 NH₄Cl 由 NH₄⁺ 与 Cl⁻ 构成，属于离子晶体，但不含金属元素。","B 项正确：分子晶体中分子间作用力较弱，熔点通常低于离子晶体（离子键较强）。","C 项正确：金刚石是共价晶体（原子晶体），碳原子通过共价键形成三维网络，硬度很大。","D 项正确：金属晶体中存在自由移动的电子，在外加电场作用下定向移动形成电流，所以金属能导电。"]},"source":"原创同步练习","level":"综合"},{"id":"m08","topic":"反应原理","title":"原电池与电解池","stem":"关于原电池与电解池，下列说法正确的有？","type":"multi","points":6,"options":["原电池中负极发生氧化反应","电解池中阳极发生氧化反应","原电池工作时，电解质溶液中阳离子向正极移动","电解池工作时，电子由阳极经外电路直接流向阴极"],"answer":[0,1,2],"analysis":{"approach":"原电池与电解池都遵循“负极/阳极发生氧化、正极/阴极发生还原”，区别在于能量转化方向与电子的来源。判断时先分清装置类型，再看电子与离子的移动路径。","focus":"原电池与电解池的比较：电极反应、离子移动方向、电子移动路径。","pitfalls":"电解池中电子的路径是：阳极失电子经外电路回到电源正极，阴极的电子由电源负极提供。电子不会直接从阳极流向阴极，也不会穿过电解质溶液。","steps":["A 项正确：原电池中负极失电子，发生氧化反应；正极得电子，发生还原反应。","B 项正确：电解池中阳极失电子，发生氧化反应；阴极得电子，发生还原反应。","C 项正确：原电池工作时，电解质溶液中的阳离子向正极移动，阴离子向负极移动，以保持电荷平衡。","D 项错误：电解池中阳极失电子后，电子经外电路回到电源正极；阴极的电子由电源负极提供。电子不是由阳极经外电路直接流向阴极。"]},"source":"原创同步练习","level":"综合"},{"id":"m09","topic":"定量分析","title":"阿伏加德罗常数的判断","stem":"设 NA 为阿伏加德罗常数，下列说法正确的有？","type":"multi","points":6,"options":["标准状况下 1 mol 任何气体的体积约为 22.4 L","1 L 1 mol/L NaCl 溶液中含 NA 个 Na⁺","常温常压下 32 g O₂ 含 2NA 个氧原子","1 mol Fe 与足量 Cl₂ 完全反应转移 2NA 个电子"],"answer":[0,1,2],"analysis":{"approach":"逐项验算：气体摩尔体积的适用条件、溶液中离子的物质的量、质量与原子数的换算、Fe 与 Cl₂ 反应的电子转移数。","focus":"阿伏加德罗常数的判断：气体摩尔体积、溶液浓度、质量换算、氧化还原的电子转移。","pitfalls":"气体摩尔体积 22.4 L/mol 只适用于标准状况下的气体；质量与物质的量、原子数的换算与温度、压强无关。Fe 与 Cl₂ 反应生成 FeCl₃（Fe 升到 +3 价），不要按生成 FeCl₂ 计算。","steps":["A 项正确：标准状况下 1 mol 任何气体的体积都约为 22.4 L。","B 项正确：1 L 1 mol/L NaCl 溶液中含 NaCl 1 mol，完全电离后含 Na⁺ 1 mol，即 N_A 个 Na⁺。","C 项正确：32 g O₂ 为 1 mol O₂ 分子，含氧原子 2 mol，即 2N_A 个氧原子；质量与原子数的换算与温度、压强无关。","D 项错误：Fe 与足量 Cl₂ 反应生成 FeCl₃，铁由 0 价升至 +3 价，1 mol Fe 转移 3 mol 电子，即 3N_A 个电子，不是 2N_A 个。"]},"source":"原创同步练习","level":"综合"},{"id":"f09","topic":"物质与反应","title":"氯气制备中的电子转移","stem":"实验室用 MnO₂ 与浓盐酸共热制取氯气：MnO₂+4HCl(浓) ∆ MnCl₂+Cl₂↑+2H₂O。","type":"fill","points":4,"parts":[{"id":"a","prompt":"每生成 1 mol Cl₂ 转移电子的物质的量","kind":"numeric","answer":2,"points":2,"unit":"mol","tolerance":0.001,"rubric":""},{"id":"b","prompt":"该反应中 HCl 表现的性质","kind":"text","answer":["既有酸性又有还原性","酸性且还原性","还原性和酸性"],"points":2,"unit":"","tolerance":0.01,"rubric":""}],"analysis":{"approach":"标化合价定电子转移：Mn 由 +4 降到 +2，Cl 由 −1 升到 0；再看 HCl 的去向：4 mol HCl 中 2 mol 被氧化成 Cl₂，2 mol 提供 Cl⁻ 生成 MnCl₂。","focus":"氯气制备中的电子转移与 HCl 的双重作用：MnO₂ 与浓盐酸的反应。","pitfalls":"HCl 在反应中表现两种性质：被氧化的部分体现还原性，生成 MnCl₂ 的部分体现酸性。数电子转移时按“生成 1 mol Cl₂”折算：2 个 Cl⁻ 各失 1 个电子，共转移 2 mol 电子。","steps":["MnO₂ 中 Mn 由 +4 价降到 MnCl₂ 中 +2 价，每摩尔 MnO₂ 得 2 mol 电子。","（a）每生成 1 mol Cl₂，有 2 mol Cl⁻ 由 −1 价升到 0 价，共失 2 mol 电子，故转移电子的物质的量为 2 mol。","（b）4 mol HCl 中，2 mol HCl 被氧化为 Cl₂，体现还原性；另 2 mol HCl 提供 Cl⁻ 生成 MnCl₂，体现酸性。","（b）故 HCl 在该反应中既表现酸性又表现还原性。"]},"source":"原创同步练习","level":"巩固"},{"id":"f10","topic":"元素及其化合物","title":"铁与酸的反应","stem":"5.6 g 铁粉与足量稀盐酸完全反应，M(Fe)=56 g/mol，标准状况下 Vm=22.4 L/mol。","type":"fill","points":4,"parts":[{"id":"a","prompt":"生成 H₂ 的物质的量","kind":"numeric","answer":0.1,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""},{"id":"b","prompt":"标准状况下 H₂ 的体积","kind":"numeric","answer":2.24,"points":2,"unit":"L","tolerance":0.01,"rubric":""}],"analysis":{"approach":"先由质量算 Fe 的物质的量，再按 Fe+2HCl→FeCl₂+H₂↑ 的 1∶1 关系求 H₂ 的物质的量，最后用 V=nVm 换算标准状况下的体积。","focus":"铁与稀盐酸反应的计算：质量—物质的量—气体体积的换算。","pitfalls":"铁与稀盐酸反应生成 Fe²⁺（FeCl₂），不是 Fe³⁺，方程式为 Fe+2HCl→FeCl₂+H₂↑，Fe 与 H₂ 的物质的量之比为 1∶1。标准状况下 Vm=22.4 L/mol，只适用于气体。","steps":["（a）n(Fe)=5.6 g/56 g/mol=0.100 mol。","按 Fe+2HCl→FeCl₂+H₂↑，Fe 与 H₂ 的物质的量之比为 1∶1，故生成 H₂ 的物质的量为 0.100 mol。","（b）标准状况下 V(H₂)=nVm=0.100 mol×22.4 L/mol=2.24 L。","注意：铁与稀盐酸生成 Fe²⁺ 而非 Fe³⁺；盐酸的氧化性不足以把铁氧化到 +3 价。"]},"source":"原创同步练习","level":"巩固"},{"id":"f11","topic":"元素及其化合物","title":"铝与强碱的反应","stem":"5.4 g 铝片与足量 NaOH 溶液完全反应：2Al+2NaOH+2H₂O=2NaAlO₂+3H₂↑。M(Al)=27 g/mol。","type":"fill","points":6,"parts":[{"id":"a","prompt":"铝的物质的量","kind":"numeric","answer":0.2,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""},{"id":"b","prompt":"生成 H₂ 的物质的量","kind":"numeric","answer":0.3,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""},{"id":"c","prompt":"标准状况下 H₂ 的体积","kind":"numeric","answer":6.72,"points":2,"unit":"L","tolerance":0.02,"rubric":""}],"analysis":{"approach":"先由质量算 Al 的物质的量，再按方程式 2Al→3H₂ 的计量比求 H₂ 的物质的量，最后换算成标准状况下的体积。","focus":"铝与强碱反应的计算：按方程式的计量比换算，再用气体摩尔体积求体积。","pitfalls":"方程式中 Al 与 H₂ 的计量比是 2∶3，不是 1∶1，换算时要乘以 3/2。计算体积时确认是标准状况（Vm=22.4 L/mol），并注意有效数字。","steps":["（a）n(Al)=5.4 g/27 g/mol=0.200 mol。","按 2Al+2NaOH+2H₂O→2NaAlO₂+3H₂↑，2 mol Al 生成 3 mol H₂。","（b）n(H₂)=0.200×3/2=0.300 mol。","（c）标准状况下 V(H₂)=0.300 mol×22.4 L/mol=6.72 L。"]},"source":"原创同步练习","level":"巩固"},{"id":"f12","topic":"结构与有机","title":"短周期元素推断","stem":"短周期元素 X、Y、Z：X 原子最外层电子数是内层电子数的 2 倍；Y 与 X 同周期，其最高正价与最低负价的绝对值之差为 2；Z 的阴离子与 Ne 原子电子层结构相同，且带 1 个单位负电荷。","type":"fill","points":6,"parts":[{"id":"a","prompt":"X 的元素符号","kind":"text","answer":["C","碳"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"Y 的元素符号","kind":"text","answer":["N","氮"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"c","prompt":"Z 的元素符号","kind":"text","answer":["F","氟"],"points":2,"unit":"","tolerance":0.01,"rubric":""}],"analysis":{"approach":"逐个突破：X 由“最外层是内层 2 倍”定出电子排布；Y 由“最高正价与最低负价绝对值之差为 2”定族；Z 由阴离子与 Ne 同电子层结构定元素。","focus":"短周期元素推断：电子排布定 X，化合价关系定 Y，离子电子层结构定 Z。","pitfalls":"主族元素的最高正价等于最外层电子数，最低负价等于最外层电子数减 8。Y 与 X 同周期（第二周期），最高正价与最低负价绝对值之差为 2，对应最外层 5 个电子。","steps":["（a）X 的内层只有 K 层 2 个电子，最外层电子数是内层的 2 倍，即 4 个，电子排布为 2、4，故 X 为碳（C）。","（b）Y 与 X 同周期（第二周期）。第二周期中，氮的最高正价为 +5、最低负价为 −3，绝对值之差为 5−3=2，故 Y 为氮（N）。","（c）Z 的阴离子与 Ne 原子电子层结构相同（2、8），且带 1 个单位负电荷，说明 Z 原子为 2、7，故 Z 为氟（F）。","总结：X 为 C，Y 为 N，Z 为 F。"]},"source":"原创同步练习","level":"巩固"},{"id":"f13","topic":"反应原理","title":"稀释与 pH","stem":"25 ℃，将 0.010 mol/L 盐酸稀释 100 倍，Kw=1.0×10⁻¹⁴。","type":"fill","points":4,"parts":[{"id":"a","prompt":"稀释后 c(H⁺)","kind":"numeric","answer":0.0001,"points":2,"unit":"mol/L","tolerance":0.000001,"rubric":""},{"id":"b","prompt":"稀释后溶液的 pH","kind":"numeric","answer":4,"points":2,"unit":"","tolerance":0.02,"rubric":""}],"analysis":{"approach":"稀释 100 倍，c(H⁺) 变为原来的 1/100；再由 pH=−lg c(H⁺) 计算。稀释后酸的浓度仍远大于水电离提供的 H⁺，可忽略水的贡献。","focus":"强酸稀释后的 pH 计算：稀释倍数与 pH 的变化关系。","pitfalls":"强酸稀释 10 倍 pH 增大 1，稀释 100 倍 pH 增大 2（在忽略水电离的前提下）。本题稀释后 c(H⁺)=1.0×10⁻⁴ mol/L，仍远大于水电离的 H⁺（约 1.0×10⁻⁷ mol/L），可忽略；若稀释到接近中性，则必须考虑水的电离。","steps":["（a）稀释 100 倍后，c(H⁺)=0.010/100=1.0×10⁻⁴ mol/L。","（b）pH=−lg c(H⁺)=−lg(1.0×10⁻⁴)=4。","验证：稀释后溶液中水电离提供的 H⁺ 约为 1.0×10⁻⁷ mol/L，远小于 1.0×10⁻⁴ mol/L，可以忽略。","规律：强酸稀释 100 倍，pH 增大 2（0.010 mol/L 盐酸 pH=2，稀释后 pH=4）。"]},"source":"原创同步练习","level":"巩固"},{"id":"f14","topic":"定量分析","title":"气体摩尔体积的计算","stem":"标准状况下 4.48 L CO₂，Vm=22.4 L/mol，M(CO₂)=44 g/mol。","type":"fill","points":4,"parts":[{"id":"a","prompt":"CO₂ 的物质的量","kind":"numeric","answer":0.2,"points":2,"unit":"mol","tolerance":0.0005,"rubric":""},{"id":"b","prompt":"CO₂ 的质量","kind":"numeric","answer":8.8,"points":2,"unit":"g","tolerance":0.02,"rubric":""}],"analysis":{"approach":"标准状况下先由 V=nVm 算物质的量，再由 m=nM 算质量。","focus":"气体摩尔体积的计算：体积—物质的量—质量的换算。","pitfalls":"标准状况下 Vm=22.4 L/mol，只适用于气体。换算时先算物质的量 n=V/Vm，再算质量 m=nM，两步不要颠倒。","steps":["（a）n(CO₂)=V/Vm=4.48 L/22.4 L/mol=0.200 mol。","（b）m(CO₂)=nM=0.200 mol×44 g/mol=8.8 g。","检查：0.200 mol CO₂ 的质量为 8.8 g，与题目数据自洽。"]},"source":"原创同步练习","level":"巩固"},{"id":"f15","topic":"结构与有机","title":"燃烧法确定分子式","stem":"某烃 0.100 mol 完全燃烧，生成 0.300 mol CO₂ 和 0.400 mol H₂O。","type":"fill","points":6,"parts":[{"id":"a","prompt":"每个分子中碳原子数","kind":"numeric","answer":3,"points":2,"unit":"","tolerance":0,"rubric":""},{"id":"b","prompt":"每个分子中氢原子数","kind":"numeric","answer":8,"points":2,"unit":"","tolerance":0,"rubric":""},{"id":"c","prompt":"该烃的分子式","kind":"text","answer":["C3H8","C₃H₈"],"points":2,"unit":"","tolerance":0.01,"rubric":""}],"analysis":{"approach":"由 CO₂ 的量算 C 的量，由 H₂O 的量算 H 的量（1 mol H₂O 含 2 mol H）；再以烃的物质的量为基准，归一到每个分子。","focus":"燃烧法确定烃的分子式：由燃烧产物定 C、H 原子数。","pitfalls":"1 mol H₂O 含 2 mol H 原子，算 H 的物质的量时要乘以 2。归一时以烃的物质的量（0.100 mol）为基准，逐个除以 0.100。","steps":["0.100 mol 烃完全燃烧生成 0.300 mol CO₂，含 C 0.300 mol；生成 0.400 mol H₂O，含 H 0.800 mol。","每个分子中 C 原子数=0.300/0.100=3，故（a）为 3。","每个分子中 H 原子数=0.800/0.100=8，故（b）为 8。","（c）该烃的分子式为 C₃H₈（丙烷）。"]},"source":"原创同步练习","level":"巩固"},{"id":"f16","topic":"反应原理","title":"转化率与平衡常数","stem":"恒温、1 L 恒容容器中发生 2SO₂(g)+O₂(g)⇌2SO₃(g)。起始投入 SO₂ 2.0 mol、O₂ 1.0 mol，平衡时 SO₃ 为 1.2 mol。","type":"fill","points":4,"parts":[{"id":"a","prompt":"SO₂ 的转化率（填百分数数值，如 60 表示 60%）","kind":"numeric","answer":60,"points":2,"unit":"%","tolerance":0.5,"rubric":""},{"id":"b","prompt":"该温度下的平衡常数 K","kind":"numeric","answer":5.625,"points":2,"unit":"","tolerance":0.02,"rubric":""}],"analysis":{"approach":"用三段式列出 SO₂、O₂、SO₃ 的初始、变化、平衡三行物质的量（容器 1 L，数值上浓度等于物质的量），再算转化率与 K。","focus":"转化率与平衡常数的计算：三段式、转化率的定义、K 的表达式。","pitfalls":"转化率 = 已转化的量 / 起始量 ×100%，分母是起始量不是平衡量。K 的表达式中各物质浓度要带计量系数作幂：K=c²(SO₃)/(c²(SO₂)·c(O₂))。容器体积为 1 L 时，物质的量数值上等于浓度数值，但概念上仍要换算。","steps":["三段式（单位 mol，V=1 L）：SO₂ 起始 2.0，O₂ 起始 1.0；生成 SO₃ 1.2 mol，消耗 SO₂ 1.2 mol、O₂ 0.6 mol；平衡时 SO₂ 0.8 mol、O₂ 0.4 mol、SO₃ 1.2 mol。","平衡浓度：c(SO₂)=0.8 mol/L，c(O₂)=0.4 mol/L，c(SO₃)=1.2 mol/L。","（a）SO₂ 的转化率=1.2/2.0×100%=60%。","（b）K=c²(SO₃)/(c²(SO₂)·c(O₂))=1.2²/(0.8²×0.4)=1.44/0.256=5.625。"]},"source":"原创同步练习","level":"巩固"},{"id":"e07","topic":"实验探究","title":"氯气的净化与漂白性验证","stem":"实验室用 MnO₂ 与浓盐酸共热制取氯气，并验证其漂白性。装置依次连接：发生装置→饱和食盐水→浓硫酸→干燥有色布条→尾气吸收。仅讨论原理与装置作用，不涉及实际操作。","type":"experiment","points":9,"parts":[{"id":"a","prompt":"饱和食盐水的作用","kind":"manual","answer":null,"points":2,"unit":"","tolerance":0.01,"rubric":"除去氯气中混有的 HCl 气体，同时减少 Cl₂ 的溶解损失。"},{"id":"b","prompt":"浓硫酸的作用","kind":"text","answer":["干燥","干燥氯气","除去水蒸气"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"c","prompt":"干燥有色布条不褪色、湿润布条褪色，说明什么","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"起漂白作用的是氯气与水反应生成的 HClO，而不是 Cl₂ 本身。"},{"id":"d","prompt":"尾气为什么要用 NaOH 溶液吸收","kind":"manual","answer":null,"points":2,"unit":"","tolerance":0.01,"rubric":"氯气有毒且污染空气，用碱液吸收生成次氯酸盐，防止逸出。"}],"analysis":{"approach":"按气体净化的顺序思考：先除杂（饱和食盐水除 HCl），后干燥（浓硫酸除水蒸气），再验证性质（干燥与湿润布条对比），最后处理尾气（NaOH 吸收）。","focus":"氯气的净化与漂白性验证：除杂与干燥的顺序、漂白性对比实验的设计、尾气处理。","pitfalls":"气体净化的通用顺序是“先除杂、后干燥”：若先干燥再除杂，除杂时又会引入水蒸气。漂白性验证的关键在于对比干燥与湿润条件，只做一组实验无法得出结论。","steps":["（a）饱和食盐水的作用：除去氯气中混有的 HCl 气体，同时 Cl⁻ 的同离子效应使 Cl₂ 在饱和食盐水中的溶解度减小，减少 Cl₂ 的溶解损失。","（b）浓硫酸的作用：干燥氯气，除去水蒸气。浓硫酸有吸水性，可作干燥剂，且不与 Cl₂ 反应。","（c）干燥有色布条不褪色、湿润布条褪色，说明起漂白作用的不是 Cl₂ 本身，而是氯气与水反应生成的 HClO。","（d）氯气有毒，逸出会污染空气，用 NaOH 溶液吸收可将 Cl₂ 转化为 NaCl 与 NaClO（Cl₂+2NaOH→NaCl+NaClO+H₂O），防止逸出。"]},"source":"原创同步练习","level":"综合"},{"id":"e08","topic":"实验探究","title":"碳酸氢钠热分解的定量测定","stem":"称取 Na₂CO₃ 与 NaHCO₃ 的混合物 10.0 g，加热至质量不再变化，冷却后称得固体 9.38 g。M(NaHCO₃)=84 g/mol，M(Na₂CO₃)=106 g/mol。仅考虑 NaHCO₃ 分解：2NaHCO₃ ∆ Na₂CO₃+H₂O↑+CO₂↑。","type":"experiment","points":9,"parts":[{"id":"a","prompt":"加热后固体减少的质量由什么物质组成","kind":"text","answer":["CO₂和H₂O","H2O和CO2","二氧化碳和水","水和二氧化碳"],"points":2,"unit":"","tolerance":0.01,"rubric":""},{"id":"b","prompt":"混合物中 NaHCO₃ 的质量","kind":"numeric","answer":1.68,"points":3,"unit":"g","tolerance":0.02,"rubric":""},{"id":"c","prompt":"混合物中 Na₂CO₃ 的质量分数（填百分数数值）","kind":"numeric","answer":83.2,"points":4,"unit":"%","tolerance":0.2,"rubric":""}],"analysis":{"approach":"用差量法：固体减少的质量就是逸出的 H₂O 与 CO₂ 的质量；每 2 mol NaHCO₃ 分解质量减少 62 g，由此算出 NaHCO₃ 的物质的量与质量，再求 Na₂CO₃ 的质量分数。","focus":"碳酸氢钠热分解的定量测定：差量法求 NaHCO₃ 的含量。","pitfalls":"差量法的关键是找准“减少的质量”对应的化学量：2 mol NaHCO₃（168 g）分解生成 1 mol Na₂CO₃（106 g），固体质量减少 62 g，即逸出的 H₂O（18 g）与 CO₂（44 g）之和。Na₂CO₃ 受热不分解，质量不变。","steps":["（a）加热后固体减少的质量为 10.0−9.38=0.62 g，由逸出的 H₂O 与 CO₂ 组成。","（b）按 2NaHCO₃→Na₂CO₃+H₂O↑+CO₂↑，每 2 mol NaHCO₃ 分解，固体质量减少 18+44=62 g。设 NaHCO₃ 为 x mol，则 62x/2=0.62，解得 x=0.0200 mol，质量为 0.0200×84=1.68 g。","（c）混合物中 Na₂CO₃ 的质量为 10.0−1.68=8.32 g，质量分数为 8.32/10.0×100%=83.2%。","补充：若样品已部分分解或含其他杂质，结果需修正；本计算以“仅 NaHCO₃ 分解、Na₂CO₃ 不变”为前提。"]},"source":"原创同步练习","level":"综合"},{"id":"e09","topic":"实验探究","title":"铁离子与碘离子反应的可逆性","stem":"取 5 mL 0.1 mol/L FeCl₃ 溶液，加入 1 mL 0.1 mol/L KI 溶液和几滴淀粉溶液，溶液变蓝；再滴加 KSCN 溶液，溶液变红。仅讨论现象推理。","type":"experiment","points":9,"parts":[{"id":"a","prompt":"溶液变蓝说明发生了什么反应","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"Fe³⁺ 把 I⁻ 氧化为 I₂，I₂ 遇淀粉变蓝；离子方程式 2Fe³⁺+2I⁻=2Fe²⁺+I₂。"},{"id":"b","prompt":"随后变红说明溶液中还存在什么","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"溶液中仍有 Fe³⁺ 剩余，说明 Fe³⁺ 未被完全消耗，反应没有进行到底。"},{"id":"c","prompt":"要证明该反应是可逆反应，还需要补充什么证据","kind":"manual","answer":null,"points":3,"unit":"","tolerance":0.01,"rubric":"还需证明 I⁻ 同样有剩余，或在同一条件下能观察到逆反应进行，即同一条件下正、逆反应同时存在。仅凭 Fe³⁺ 剩余不足以排除\"用量不足\"的解释。"}],"analysis":{"approach":"按现象链推理：变蓝说明生成了 I₂（Fe³⁺ 氧化 I⁻）；变红说明仍有 Fe³⁺ 剩余。但要证明可逆，还要排除“I⁻ 用量不足”的解释，或直接观察到逆反应。","focus":"Fe³⁺ 与 I⁻ 反应的可逆性：用剩余反应物推断反应未进行到底，以及严格证明可逆所需的证据。","pitfalls":"本题中 Fe³⁺ 的物质的量（0.5 mmol）远多于 I⁻（0.1 mmol），即使反应进行到底 Fe³⁺ 也会有剩余，所以仅凭“变红”不能证明反应可逆。严格证明可逆性，还需证明 I⁻ 同样有剩余，或在同一条件下能观察到逆反应（Fe²⁺ 与 I₂ 反应生成 Fe³⁺ 与 I⁻）进行。","steps":["（a）溶液变蓝说明 Fe³⁺ 把 I⁻ 氧化为 I₂，I₂ 遇淀粉变蓝；离子方程式为 2Fe³⁺+2I⁻→2Fe²⁺+I₂。","（b）随后滴加 KSCN 溶液变红，说明溶液中仍有 Fe³⁺ 剩余，Fe³⁺ 没有被完全消耗。","（c）要证明该反应是可逆反应，还需补充证据：证明 I⁻ 同样有剩余，或在同一条件下能观察到逆反应进行，即同一条件下正、逆反应同时存在。仅凭 Fe³⁺ 剩余不足以排除“用量不足”的解释。","补充：经典推理的逻辑是——若 Fe³⁺ 与 I⁻ 按化学计量恰好完全反应，则两者都不应剩余；但本题 Fe³⁺ 本来就过量，所以这个推理在此处需要补充证据才完整。"]},"source":"原创同步练习","level":"综合"}],"sources":[{"title":"人教社：高中化学教材与教学资源","url":"https://www.pep.com.cn/xw/zt/px/2019/huaxue/"}]};

/* 数量标签：为 0 时隐藏（错题本计数） */
(function(){
  function norm(){
    var el=document.getElementById('mistakeCount');
    if(!el)return;
    var v=(el.textContent||'').trim();
    el.classList.toggle('hide-zero', v===''||v==='0');
  }
  norm();
  var t=null;
  new MutationObserver(function(){clearTimeout(t);t=setTimeout(norm,30);})
    .observe(document.body,{subtree:true,childList:true,characterData:true});
})();

/* 导航重排：拆掉包装 div，按固定优先级重排 */
(function(){
  var RANK=[['doc','home',10],['cw-action','center',11],['study-enter','lesson',12],['study-enter','solve',13],['cw-kind','exp',14],['lab','practice',20],['cw-action','papers',21],['mod','exps',30],['mod','subs',40],['mod','apps',60],
            ['mod','mols',70],['teach','mistakes',80],['lab','games',85],['teach','lessons',90],['pt','1',110],['doc','bp',120]];
  function rankOf(el){
    var b=el.querySelector?el.querySelector('.nav-cat'):null;
    if(!b)return 999;
    for(var i=0;i<RANK.length;i++){
      var k=RANK[i][0],v=RANK[i][1];
      if(k==='pt'){if(b.hasAttribute('data-pt'))return RANK[i][2];}
      else if((b.getAttribute('data-'+k)||'')===v)return RANK[i][2];
    }
    return 900;
  }
  window.reorderNav=function(){
    var t=document.getElementById('navTree');if(!t)return;
    /* 拆掉非 .nav-group 的包装层 */
    Array.prototype.slice.call(t.children).forEach(function(c){
      if(!c.classList.contains('nav-group')){
        Array.prototype.slice.call(c.children).forEach(function(g){t.insertBefore(g,c);});
        if(c.parentNode===t)t.removeChild(c);
      }
    });
    Array.prototype.slice.call(t.children)
      .sort(function(a,b){return rankOf(a)-rankOf(b);})
      .forEach(function(el){t.appendChild(el);});
  };
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){setTimeout(window.reorderNav,0);});
  }else{setTimeout(window.reorderNav,0);}
  setTimeout(window.reorderNav,400);
  setTimeout(window.reorderNav,1200);
})();

/* 顶栏元素周期表入口；点击标题回到工作台 */
(function(){
  function bind(){
    var b=document.getElementById('btnPT');
    if(b&&!b._bound){
      b._bound=true;
      b.addEventListener('click',function(){
        var t=document.querySelector('#navTree [data-pt]');
        if(t)t.click();
      });
    }
    var br=document.querySelector('.brand');
    if(br&&!br._bound){
      br._bound=true;
      br.addEventListener('click',function(){
        var h=document.querySelector('#navTree [data-doc="home"]');
        if(h)h.click();
      });
    }
  }
  bind();
  setTimeout(bind,300);
  setTimeout(bind,1200);
})();

 return {schema:'chem-lesson-sop/1',id:l.id,title,grade,minutes,phases,criteria:d.criteria,teacher,student:learner,full:teacher+'\n\n---\n\n'+learner};
}

<script>
(function(){'use strict';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline=s=>escape(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
window.ChemLessonMarkdown=function(text){
 const lines=String(text).split('\n');let html='',i=0;
 while(i<lines.length){const line=lines[i];
  if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}:?\s*\|/.test(lines[i+1])){
   const heads=cells(line);html+='<table style="border-collapse:collapse;width:100%;margin:14px 0"><thead><tr>'+heads.map(x=>'<th style="border:1px solid #aab9b1;padding:9px;text-align:left">'+inline(x)+'</th>').join('')+'</tr></thead><tbody>';i+=2;
   while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){const row=cells(lines[i]);html+='<tr>'+heads.map((x,j)=>'<td style="border:1px solid #aab9b1;padding:9px;min-width:50px">'+inline(row[j]||'')+'</td>').join('')+'</tr>';i++;}
   html+='</tbody></table>';continue;
  }
  if(/^\s*- /.test(line)){html+='<ul>';while(i<lines.length&&/^\s*- /.test(lines[i])){html+='<li>'+inline(lines[i].replace(/^\s*- /,''))+'</li>';i++;}html+='</ul>';continue;}
  const heading=line.match(/^(#{1,3})\s+(.*)$/);
  if(heading)html+='<h'+heading[1].length+'>'+inline(heading[2])+'</h'+heading[1].length+'>';
  else if(line==='---')html+='<hr>';
  else if(line.trim())html+='<p>'+inline(line.replace(/^>\s?/,''))+'</p>';
  i++;
 }
 return html;
