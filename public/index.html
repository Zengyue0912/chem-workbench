function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const r=viewport.getBoundingClientRect();
  cv.width=Math.max(2,r.width*dpr);cv.height=Math.max(2,r.height*dpr);
  cv._dpr=dpr;cv._w=r.width;cv._h=r.height;
  if(VW.model){E3.cam.cx=r.width/2;E3.cam.cy=r.height*0.47;E3.cam.fov=Math.min(r.width,r.height)*0.86;}
  needsDraw=true;
}
window.addEventListener('resize',resize);
window.__calcDisp=calcDisp; /* 调试导出 */
/* ---------- 拆解位移 ---------- */
function calcDisp(){
  if(VW.cmp){ /* 分子对比：左右分列、中心归零（同步旋转、统一比例——同一相机同一世界单位） */
    const n=VW.model.parts.length,disp=[];
    const c=VW.cmp;
    const pa=[-c.dx/2-c.ca[0],-c.ca[1],-c.ca[2]];
    const pb=[c.dx/2-c.cb[0],-c.cb[1],-c.cb[2]];
    for(let i=0;i<n;i++)disp.push(i<c.nA?pa:pb);
    return disp;
  }
  if(VW.asm){ /* 装配挑战：已装零件归位，未装零件移出视野（y=-999） */
    const n=VW.model.parts.length,disp=[];
    for(let i=0;i<n;i++)disp.push([0,-999,0]);
    VW.asm.groups.forEach((g,gi)=>{
      if(gi<VW.asm.placed)for(let i=g[0];i<=g[1];i++)disp[i]=[0,0,0];
    });
    return disp;
  }
  const t=VW.explode,n=VW.model.parts.length;
  const disp=[];
  if(t<=0){for(let i=0;i<n;i++)disp.push([0,0,0]);return disp;}
  const s=t*VW.model.span*0.5;
  VW.model.parts.forEach(pt=>{disp.push(pt.dir?[pt.dir[0]*s,pt.dir[1]*s,pt.dir[2]*s]:[0,0,0]);});
  return disp;
}
/* ---------- 绘帧 ---------- */
function drawFrame(){
  const options={explode:VW.explode,disp:VW.model?calcDisp():[],labels:VW.labels,extra:VW.extra,focusPart:window.ChemPartGuide?.selected};
  if(VW.model&&window.ChemSpatial?.draw(VW.model,options,E3.cam,cv))return;
  ctx.setTransform(cv._dpr,0,0,cv._dpr,0,0);
  ctx.clearRect(0,0,cv._w,cv._h);
  if(!VW.model)return;
  E3.drawFloor(ctx,VW.model);
  E3.render(ctx,VW.model,options);
  if(options.focusPart)window.ChemPartGuide.drawPointer(ctx,VW.model,options.disp);
  /* 暗角：四角轻微压暗，增强舞台纵深 */
  const dark=document.body.dataset.theme==='dark';
  const vg=ctx.createRadialGradient(cv._w/2,cv._h*0.45,Math.min(cv._w,cv._h)*0.40,cv._w/2,cv._h*0.5,Math.max(cv._w,cv._h)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,dark?'rgba(0,0,0,.34)':'rgba(8,45,36,.10)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,cv._w,cv._h);
}
function loop(ts){
  const dt=Math.min(0.33,(ts-(loop._t||ts))/1000)||0.016;loop._t=ts;
  if(document.hidden){requestAnimationFrame(loop);return;}
  if(VW.auto&&VW.model&&window.UI?.view==='stage'){E3.cam.yaw+=dt*0.4;needsDraw=true;}
  if(Math.abs(VW.vyaw)>1e-4||Math.abs(VW.vpitch)>1e-4){
    E3.cam.yaw+=VW.vyaw;E3.cam.pitch=Math.max(-1.45,Math.min(1.45,E3.cam.pitch+VW.vpitch));
    VW.vyaw*=0.93;VW.vpitch*=0.93;needsDraw=true;
  }
  if(VW.exp&&VW.exp.playing&&!VW.exp.manual&&window.UI?.view==='stage'){ /* 低帧率时物理子步进：保持模拟速率且动画不跳跃 */
    let rem=dt;
    while(rem>0){const s=Math.min(0.1,rem);SIM.update(VW.exp,s);rem-=s;}
    needsDraw=true;
  }
  if(needsDraw){drawFrame();needsDraw=false;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* ---------- 视角与交互 ---------- */
function fitModel(){
  const r=viewport.getBoundingClientRect();
  const b=E3.fit(VW.model,Math.max(200,r.width),Math.max(200,r.height),0.84);
  VW.minD=b.span*0.8;VW.maxD=b.span*9;
  VW.baseD=E3.cam.dist; /* 拆解缩放基准：拆开后按倍率拉远，零件才不会飞出画面 */
  E3.cam.yaw=0.18;E3.cam.pitch=VW.expPitch!==undefined?VW.expPitch:0.26; /* 近正视：瓶身标签面正对相机，印刷文字默认可读 */
  VW.vyaw=VW.vpitch=0;
}
function resetView(){if(VW.model){fitModel();needsDraw=true;}}
const ptrs=new Map();let pinchD=0;
cv.tabIndex=0;
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('grabbing');hideHint();
  if(ptrs.size===2){const a=[...ptrs.values()];pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
  needsDraw=true;
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    E3.cam.yaw+=dx*0.0075;
    E3.cam.pitch=Math.max(-1.45,Math.min(1.45,E3.cam.pitch+dy*0.0075));
    VW.vyaw=dx*0.0022;VW.vpitch=dy*0.0022;
  }
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){
    const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0&&d>0){E3.cam.dist=Math.max(VW.minD,Math.min(VW.maxD,E3.cam.dist*pinchD/d));}
    pinchD=d;
  }
  needsDraw=true;
});
function ptrEnd(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0;if(!ptrs.size)cv.classList.remove('grabbing');}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  E3.cam.dist=Math.max(VW.minD,Math.min(VW.maxD,E3.cam.dist*Math.exp(e.deltaY*0.0011)));
  needsDraw=true;
},{passive:false});
cv.addEventListener('dblclick',resetView);
cv.addEventListener('keydown',e=>{
  const k=e.key;let used=true;
  if(k==='ArrowLeft')E3.cam.yaw-=0.12;
  else if(k==='ArrowRight')E3.cam.yaw+=0.12;
  else if(k==='ArrowUp')E3.cam.pitch=Math.min(1.45,E3.cam.pitch+0.1);
  else if(k==='ArrowDown')E3.cam.pitch=Math.max(-1.45,E3.cam.pitch-0.1);
  else if(k==='+'||k==='=')E3.cam.dist=Math.max(VW.minD,E3.cam.dist*0.9);
  else if(k==='-')E3.cam.dist=Math.min(VW.maxD,E3.cam.dist*1.11);
  else if(k===' '&&VW.exp){SIM.togglePlay();}
  else used=false;
  if(used){e.preventDefault();needsDraw=true;}
});
let hintT=0;
function hideHint(){const h=$('hudHint');if(h&&!h.classList.contains('fade')){clearTimeout(hintT);hintT=setTimeout(()=>h.classList.add('fade'),1800);}}
/* ---------- 实验模拟器 ---------- */
const M=B.M,{L,S,LN,D,F}=B;
function hexGlow(h,a){
  const c=h.length===4?'#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3]:h;
  return 'rgba('+parseInt(c.substr(1,2),16)+','+parseInt(c.substr(3,2),16)+','+parseInt(c.substr(5,2),16)+','+a+')';
}
const SIM={
  DUR:{na:[2.6,1.6,1.6,6.0,4.2],tit:[3,2.5,2.5,7,4,3.5],flame:[3,3.5,4,3.5],drill_na:[3,4.5,4.5],drill_h2so4:[3,4.5,4.5],asm_gas:[1,1,1,1],asm_dist:[1,1,1,1],static:[3.2,3.2,3.2,3.2,3.2,3.2]},
  durations(item){const preset=SIM.DUR[item.id]||SIM.DUR[item.sim]||[];return item.steps.map((_,i)=>Number.isFinite(preset[i])&&preset[i]>0?preset[i]:3.2);},
  init(item){
    const e={item:item,step:0,stepT:0,playing:false,done:false,st:{}};
    VW.exp=e;
    SIM.setup(item,e);
    SIM.panel();
  },
  setup(item,e){
    if(item.sim==='na')SIM.setupNa(e);
    else if(item.sim==='tit')SIM.setupTit(e);
    else if(item.sim==='flame')SIM.setupFlame(e);
    else if(item.sim==='drill')SIM.setupDrill(e);
    else if(item.sim==='asm')SIM.setupAsm(e);
    else SIM.setupStatic(e);
  },
  /* ===== 静态装置实验：模型就位，用"下一步"推进讲解 ===== */
  setupStatic(e){
    e.st={};
    const fn=e.item.scene;
    VW.model=(fn&&B.app[fn])?B.app[fn]():null;
    VW.expPitch=e.item.pitch!==undefined?e.item.pitch:0.2;
    if(VW.model)fitModel();
  },
  /* ===== 钠与水 ===== */
  setupNa(e){
    e.st={na:{x:0,z:0,r:0.28,vx:0.9,vz:0.6},bubbles:[],ripples:[],mist:[],flames:[],redR:0,redA:0,phDrop:false,inDrop:false};
    VW.model=(function(){
      const parts=[];
      parts.push(B.PT('烧杯',[L([[0.02,0],[1.35,0.02],[1.5,0.1],[1.55,0.3],[1.55,2.3],[1.63,2.36],[1.63,2.5],[1.55,2.52]],{alpha:.52})]));
      parts.push(B.PT('水（滴有酚酞）',[
        L([[0.02,0.14],[1.46,0.2],[1.48,0.4],[1.48,1.7]],{col:'#d9ecf4',alpha:.75,edge:null,flat:true,cull:true}),
        D([0,1.7,0],[0,1,0],1.46,'#e0f0f7',{flat:true,alpha:.68})
      ]));
      parts.push(B.PT('玻璃片（旁置）',[
        F([[-2.6,0.02,-0.9],[-1.2,0.02,-0.9],[-1.2,0.02,0.9],[-2.6,0.02,0.9]],'#eef4f7',{edge:'#c6d3da'}),
        F([[-2.5,0.03,-0.8],[-1.3,0.03,-0.8],[-1.3,0.03,0.8],[-2.5,0.03,0.8]],'#f8fbfd',{})
      ]));
      return B.fin(parts);
    })();
    VW.expPitch=-0.34; /* 俯视：课堂演示观察"浮、熔、游、红"水面现象的标准视角 */
    fitModel();
    E3.cam.dist*=0.72; /* 拉近镜头：聚焦烧杯反应区 */
  },
  na(e,dt){
    const st=e.st;
    const na=st.na;
    /* 钠块位置与大小 */
    if(e.step<2){na.x=-1.9;na.z=0;na.r=0.26;na.y=0.16;} /* 玻璃片上 */
    else if(e.step===2&&e.stepT<0.8){ /* 投入瞬间下落 */
      const k=e.stepT/0.8;
      na.x=0;na.z=0;na.y=1.9-k*0.3;na.r=0.26;
    }else{na.y=1.86;na.r=Math.max(0.16,0.26*(1-(e.step===3?e.stepT/6:(e.step>3?1:0))*0.5));}
    if(e.step===2&&!st.inDrop&&e.stepT>=0.8){ /* 钠粒入水激起水花 */
      st.inDrop=true;
      st.ripples.push({x:0,z:0,r:0.08,a:0.85});
      st.mist.push({x:0,y:1.75,z:0,r:0.12,vy:0.3,a:0.4});
    }
    if(e.step===1&&!st.phDrop&&e.stepT>=1.2){ /* 酚酞液滴入水 */
      st.phDrop=true;
      st.ripples.push({x:0.3,z:0.2,r:0.06,a:0.65});
    }
    /* 步骤≥2：钠已入水，隐藏旁置玻璃片让镜头聚焦烧杯 */
    if(VW.model&&VW.model.parts[2])VW.model.parts[2].hide=e.step>=2;
    if(e.step>=3){
      na.x+=na.vx*dt;na.z+=na.vz*dt;
      if(Math.abs(na.x)>1.05){na.x=Math.sign(na.x)*1.05;na.vx*=-1;st.ripples.push({x:na.x,z:na.z,r:0.07,a:0.7});}
      if(Math.abs(na.z)>1.05){na.z=Math.sign(na.z)*1.05;na.vz*=-1;st.ripples.push({x:na.x,z:na.z,r:0.07,a:0.7});}
      na.vx+=(Math.random()-0.5)*3*dt;na.vz+=(Math.random()-0.5)*3*dt;
      /* 游动涟漪：钠球走到哪里，哪里泛起细涟漪（"游"的视觉暗示） */
      st.trailT=(st.trailT||0)+dt;
      if(st.trailT>0.38){st.trailT=0;st.ripples.push({x:na.x,z:na.z,r:0.05,a:0.5});}
      const rate=e.step===3?(e.stepT<4?20:11):7;
      if(Math.random()<dt*rate)st.bubbles.push({x:na.x+(Math.random()-.5)*.55,y:1.18+Math.random()*0.38,z:na.z*0.4+0.2+(Math.random()-.5)*.5,r:0.07+Math.random()*0.09,vy:0.5+Math.random()*.4});
      /* 反应剧烈期燃起黄色火苗（贴钠球侧边，小而亮） */
      if(Math.random()<dt*(e.step===3?4.2:0.7))st.flames.push({x:na.x+(Math.random()-.5)*.34,y:1.98,z:na.z+(Math.random()-.5)*.34,r:0.06+Math.random()*.06,vy:0.55+Math.random()*.4,life:0.8+Math.random()*.4});
      /* 红色扩散前沿：酚酞遇 NaOH 变红并由钠球处向外扩散（反应即开始，快速渐进变红） */
      if(e.stepT>0.6)st.redR=Math.min(1.48,st.redR+dt*0.9);
      st.redA=Math.min(0.8,(st.redR/1.48)*0.78);
    }
    st.bubbles.forEach(b=>{b.y+=b.vy*dt;b.r+=dt*0.025;});
    st.bubbles=st.bubbles.filter(b=>{
      if(b.y>=1.70){ /* 气泡到水面破裂：激起小涟漪，带出水汽 */
        if(Math.random()<0.34)st.ripples.push({x:b.x,z:b.z,r:0.04,a:0.5});
        if(Math.random()<0.6)st.mist.push({x:b.x,y:1.74,z:b.z,r:0.09,vy:0.3,a:0.46});
        return false;
      }
      return true;
    });
    /* 涟漪半径夹在杯内，触壁即快速消散；同时限流，避免堆成一圈圈灰色年轮 */
    st.ripples.forEach(rp=>{
      rp.r=Math.min(1.40,rp.r+dt*0.9);
      rp.a-=dt*(rp.r>=1.40?1.9:0.55);
    });
    if(st.ripples.length>11)st.ripples=st.ripples.slice(st.ripples.length-11);
    st.ripples=st.ripples.filter(rp=>rp.a>0.02);
    /* 白雾限流：不限制会在十几秒内糊满整个视野，把烧杯与液体一并吞掉 */
    if(st.mist.length>14)st.mist=st.mist.slice(st.mist.length-14);
    st.mist.forEach(m=>{m.y+=m.vy*dt;m.r+=dt*0.15;m.a-=dt*0.06;});
    st.mist=st.mist.filter(m=>m.a>0.02);
    st.flames.forEach(f=>{f.y+=f.vy*dt;f.life-=dt;f.r+=dt*0.02;});
    st.flames=st.flames.filter(f=>f.life>0);
  },
  naExtra(e){
    const st=e.st,ex=[];
    const na=st.na;
    /* 动态 zBias：元素深度 - 其正下方水面 (x,1.7,z) 局部深度 + 0.1，
       把浮于水面之上的元素（钠球/火苗/白雾）恒提到其所在处水面之前绘制。
       注：本引擎 pitch 正方向为仰视（y 越高 view-z 越大越"远"），
       故高于水面的元素天然"远"于水面，必须显式提前，否则被大水面盘片盖住 */
    const zbAt=(x,y,z)=>Math.max(0,(E3.proj(x,y,z)[2]-E3.proj(x,1.7,z)[2])+0.1);
    if(na&&na.r>0.05&&e.step<4){
      const y=e.step<2?0.16+na.r*0.8:(e.step===2?(na.y||1.86):1.86);
      /* 钠球渲染优先级最高（zb+1.05）：教学演示必须看到银白钠球。
         双层球：蓝灰底衬（描边效果）+ 银白亮球——浅背景/红背景下都高对比醒目 */
      /* 钠球只比水面提前一点点：让它"泡在水里、隔着一层玻璃"，而不是浮在杯壁外面。
         玻璃已足够通透，透过前壁仍能清楚看到银白钠球 */
      const zb=zbAt(na.x,y,na.z)+0.18;
      ex.push({t:'glow',c:[na.x,y,na.z],r:na.r*4,col:'rgba(255,250,242,.30)',zBias:zb+0.06});
      ex.push(S([na.x,y,na.z],na.r*1.18,'#8fa4b8',{zBias:zb-0.02}));
      ex.push(S([na.x,y,na.z],na.r,'#f4f8fc',{glow:true,zBias:zb}));
      /* 浮动标注：指明银白小球是"钠"（课堂演示核心物质标识） */
      ex.push(F([[na.x-0.34,y+na.r+0.5,na.z],[na.x+0.34,y+na.r+0.5,na.z],[na.x+0.34,y+na.r+0.82,na.z],[na.x-0.34,y+na.r+0.82,na.z]],'#ffffff',{flat:true,txt:'钠',textCol:'#1d5f74',zBias:zb+0.1}));
      if(e.step===3)ex.push(LN([na.x,y,na.z],[na.x+0.5,y+0.35,na.z],0.03,'#c2c9d4'));
    }
    /* 气泡：细密小气泡从钠球周边散开上浮，层次介于红盘与钠球之间 */
    st.bubbles.forEach(b=>{
      ex.push(S([b.x,b.y,b.z],b.r,'#f2f8fc',{glow:true,zBias:0.55}));
    });
    /* 水面涟漪（深青色环，浅背景上清晰可见） */
    st.ripples.forEach(rp=>{
      ex.push({t:'ring',c:[rp.x,1.708,rp.z],n:[0,1,0],r0:Math.max(0.015,rp.r-0.12),r1:rp.r,col:'rgba(38,98,124,'+Math.min(0.9,rp.a).toFixed(2)+')',zBias:zbAt(rp.x,1.708,rp.z)});
    });
    /* 白雾（水汽，白色更醒目） */
    st.mist.forEach(m=>{
      ex.push({t:'glow',c:[m.x,m.y,m.z],r:m.r*2.6,col:'rgba(238,244,250,'+(m.a*0.8).toFixed(2)+')',zBias:zbAt(m.x,m.y,m.z)+0.4});
    });
    /* 黄色火苗（贴钠球侧边的小橙焰，偏移+0.3 确保浮于水面之上、低于钠球层级） */
    st.flames.forEach(f=>{
      const zb=zbAt(f.x,f.y,f.z)+0.10;
      ex.push({t:'glow',c:[f.x,f.y,f.z],r:f.r*2.4,col:'rgba(255,150,50,.34)',zBias:zb+0.04});
      ex.push(S([f.x,f.y,f.z],f.r,'#ff9d3c',{glow:true,zBias:zb}));
      ex.push(S([f.x,f.y+f.r*0.5,f.z],f.r*0.55,'#ffe08a',{glow:true,zBias:zb}));
    });
    /* 酚酞液滴（步骤1滴入） */
    if(e.step===1&&e.stepT<1.2){
      const k=e.stepT/1.2;
      ex.push(S([0.3,2.0-k*0.3,0.2],0.06,'#c062a8',{glow:true}));
    }
    /* 红色扩散：由钠球处向外扩散的红色前沿 + 整体变红（酚酞遇碱的玫红） */
    if(st.redA>0){
      ex.push(L([[0.02,0.14],[1.46,0.2],[1.48,0.4],[1.48,1.68]],{col:'#dd4f86',alpha:st.redA,edge:null,flat:true,cull:true}));
      ex.push(D([0,1.7,0],[0,1,0],1.46,'#d94a80',{alpha:Math.min(.85,st.redA+0.3),flat:true}));
      if(st.redR<1.44)ex.push({t:'ring',c:[0,1.71,0],n:[0,1,0],r0:Math.max(0.02,st.redR-0.08),r1:st.redR,col:'rgba(196,22,72,'+(0.75*(st.redA/0.8)).toFixed(2)+')',zBias:0.06});

  tit(e,dt){
    const st=e.st;
    if(e.manual){window.ChemTitration?.paint(e);return;}
    if(e.step===0){st.liqY=3.15+Math.sin(e.stepT*2)*0.12;}
    else if(e.step===1){st.liqY=3.3;}
    else if(e.step===2){st.liqY=3.25;}
    else if(e.step===3){
      st.liqY=Math.max(2.2,3.25-e.stepT*0.14);
      /* 尖嘴处液滴逐渐长大 → 脱落 */
      st.tipR=Math.min(0.11,st.tipR+dt*0.09);
      if(st.tipR>=0.104){st.drops.push({y:1.95,r:0.1,vy:1.1});st.tipR=0.036;}
      if(Math.random()<dt*1.4)st.swirls.push({ang:Math.random()*Math.PI*2,rad:0.26+Math.random()*0.14,y:1.0+Math.random()*0.3,r:0.12+Math.random()*0.08,alpha:0.55});
    }else if(e.step===4){
      st.liqY=Math.max(2.0,2.2-e.stepT*0.05);
      st.tipR=Math.min(0.11,st.tipR+dt*0.08);
      if(st.tipR>=0.104){st.drops.push({y:1.95,r:0.106,vy:1.0});st.tipR=0.036;}
      st.flaskRed=Math.min(0.55,e.stepT*0.45);
    }else{st.flaskRed=0.55;}
    st.drops.forEach(d=>{d.vy+=dt*1.5;d.y-=d.vy*dt;});
    st.drops=st.drops.filter(d=>{
      if(d.y<=1.37){ /* 液滴落液：激起涟漪 + 旋涡扩散 */
        st.splashes.push({r:0.06,alpha:0.6});
        const n=e.step>=4?3:2;
        for(let i=0;i<n;i++)st.swirls.push({ang:Math.random()*Math.PI*2,rad:0.24+Math.random()*0.18,y:1.0+Math.random()*0.34,r:0.12+Math.random()*0.1,alpha:0.6});
        return false;
      }
      return true;
    });
    st.splashes.forEach(s=>{s.r+=dt*0.75;s.alpha-=dt*0.32;});
    st.splashes=st.splashes.filter(s=>s.alpha>0.03);
    st.swirls.forEach(w=>{w.ang+=dt*2.4;w.alpha-=dt*0.2;});
    st.swirls=st.swirls.filter(w=>w.alpha>0.03);
  },

    let idx=e.step;
    if(idx===2&&e.stepT>=2)idx=3; /* 步骤3内：先钙（砖红）后铜（绿）分段演示 */
    if(idx===3)idx=4; /* 钾焰（透过钴玻璃） */

    st.inner=inner[idx]||'';

    st.particles=st.particles.filter(p=>p.y<2.85);
    st.sparks.forEach(s=>{s.y+=s.vy*dt;s.life-=dt;s.x+=Math.sin(s.y*10)*dt*0.06;});

  drill(e,dt){
    const st=e.st;
    if(e.item.drill==='na'){
      if(e.step<2||st.boom>0||(e.step===2&&!st.out)){ /* 步骤2未窒息前火持续燃烧（渐弱），救学逻辑：覆盖→窒息→熄灭 */
        const wk=e.step===2?0.55:1;
        if(Math.random()<dt*4*wk)st.flames.push({x:(Math.random()-.5)*.4,y:0.35,z:(Math.random()-.5)*.4,r:(0.09+Math.random()*.1)*wk,vy:(0.6+Math.random()*.5)*wk,life:0.7+Math.random()*.4});
      }
      if(st.boom>0)st.boom-=dt;
      if(e.step===1){
        if(!st.droped){
          st.droped=true;
          for(let i=0;i<5;i++)st.drops.push({y:2.6-i*0.28,vy:0,delay:i*0.16});
        }
        st.drops.forEach(d=>{if(d.delay>0){d.delay-=dt;return;}d.vy+=dt*3;d.y-=d.vy*dt;});
        st.drops=st.drops.filter(d=>{
          if(d.y<=0.35){
            if(!st.booming){st.booming=true;st.boom=1.8;}
            return false;
          }
          return true;
        });
        if(st.booming&&st.boom>0&&Math.random()<dt*26)st.flames.push({x:(Math.random()-.5)*1.3,y:0.4+Math.random()*1.2,z:(Math.random()-.5)*1.3,r:0.14+Math.random()*.16,vy:1.2+Math.random()*.9,life:0.8+Math.random()*.5});
      }
      if(e.step===2){
        if(!st.sanded){st.sanded=true;st.pile=[];st.piled=0;for(let i=0;i<30;i++)st.sands.push({x:(Math.random()-.5)*.9,y:2.4+Math.random()*.9,z:(Math.random()-.5)*.9,vy:0,r:0.07+Math.random()*.06,delay:Math.random()*1.1});}
        st.sands.forEach(s=>{if(s.delay>0){s.delay-=dt;return;}s.vy+=dt*2.6;s.y-=s.vy*dt;});
        st.sands=st.sands.filter(s=>{
          if(s.y<=0.2){ /* 落地留底：钠块上堆成沙丘、台面散落，直观呈现"覆盖" */
            if(st.pile.length<56){
              const on=Math.abs(s.x)<0.34&&Math.abs(s.z)<0.34;
              if(on)st.piled++;
              const h=on?0.2+Math.min(0.26,st.piled*0.009):0.04;
              st.pile.push({x:s.x,y:h+s.r*0.4,z:s.z,r:s.r});
            }
            return false;
          }
          return true;
        });
        if(e.stepT>2.2)st.out=1;
      }
      st.flames.forEach(f=>{f.y+=f.vy*dt;f.life-=dt*(e.step===2?(st.out?2.6:0.55):0.5);f.r+=dt*0.02;}); /* 窒息前慢衰减、窒息后快速熄灭 */
      st.flames=st.flames.filter(f=>f.life>0);
    }else{
      if(e.step===1&&!st.boiled&&e.stepT>0.9){
        st.boiled=true;
        for(let i=0;i<30;i++)st.splash.push({x:1.9+(Math.random()-.5)*.3,y:1.15,z:0.3+(Math.random()-.5)*.3,vx:(Math.random()-.5)*2.4,vy:1.6+Math.random()*1.6,vz:(Math.random()-.5)*2.4,r:0.05+Math.random()*.06});
        st.warn=2.2;
      }
      if(e.step===2){
        st.streaming=true;st.streamT+=dt;
        st.stream=[];
        for(let i=0;i<8;i++){
          const k=(st.streamT*1.6+i*0.14)%1;
          if(k<0.9){
            const sy=1.9-k*1.3;
            const sx=0.55-0.45*(sy-0.6)/1.3;
            st.stream.push({x:sx,y:sy,r:0.045});
          }
        }
        if(Math.random()<dt*3)st.mist.push({x:(Math.random()-.5)*.3,y:0.62,z:(Math.random()-.5)*.3,r:0.06+Math.random()*.05,a:0.3});
        if(e.stepT>2.6)st.done2=1;
      }
      st.splash.forEach(p=>{p.vy-=dt*3.2;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;});
      st.splash=st.splash.filter(p=>p.y>0.05);
      if(st.warn>0)st.warn-=dt;
      st.mist.forEach(m=>{m.y+=dt*0.25;m.r+=dt*0.12;m.a-=dt*0.08;});
      st.mist=st.mist.filter(m=>m.a>0.02);
    }
  },
  drillExtra(e){
    const st=e.st,ex=[];
    if(e.item.drill==='na'){
      st.flames.forEach(f=>{
        ex.push({t:'glow',c:[f.x,f.y,f.z],r:f.r*4,col:'rgba(255,150,50,.42)'});
        ex.push(B.S([f.x,f.y,f.z],f.r,'#ff9d3c',{glow:true}));
        ex.push(B.S([f.x,f.y+f.r*0.5,f.z],f.r*0.55,'#ffe08a',{glow:true}));
      });
      st.drops.forEach(d=>{if(d.delay<=0)ex.push(B.S([0,d.y,0],0.07,'#8fd0f2',{glow:true}));});
      st.sands.forEach(s=>ex.push(B.S([s.x,s.y,s.z],s.r,'#b5967a')));
      (st.pile||[]).forEach(p=>{
        const on=Math.abs(p.x)<0.34&&Math.abs(p.z)<0.34;
        ex.push(B.S([p.x,p.y,p.z],p.r*1.55,'#a9855a',{zBias:on?0.85:0.3})); /* 高y更远：zBias 前移避免被钠块顶面盖住 */
      });
      if(st.out){ /* 窒息后：整体沙丘掩埋钠块，处置结果一目了然 */
        ex.push(B.S([0,0.46,0],0.36,'#a9855a',{zBias:1.15}));
        ex.push(B.S([-0.24,0.34,0.1],0.24,'#a9855a',{zBias:1.05}));
        ex.push(B.S([0.24,0.34,-0.1],0.24,'#a9855a',{zBias:1.05}));
        ex.push(B.S([0.14,0.32,0.2],0.19,'#9c7748',{zBias:1.02}));
        ex.push(B.S([-0.14,0.32,-0.2],0.19,'#9c7748',{zBias:1.02}));
      }
      if(st.booming&&e.step===1){
        ex.push({t:'glow',c:[0,0.8,0],r:2.2,col:'rgba(220,45,45,'+(0.22*Math.min(1,Math.max(0,st.boom))).toFixed(2)+')'});
        ex.push(B.F([[-1.05,1.35,0],[1.05,1.35,0],[1.05,1.78,0],[-1.05,1.78,0]],'#e8564f',{flat:true,txt:'氢气爆燃 · 危险！',textCol:'#ffffff',txtScale:0.5,zBias:4,edge:'#a83832',lw:1.5}));
      }
      if(e.step===2&&!st.out)ex.push(B.F([[-1.05,1.3,0],[1.05,1.3,0],[1.05,1.72,0],[-1.05,1.72,0]],'#2a8f6f',{flat:true,txt:'沙土覆盖中…',textCol:'#ffffff',txtScale:0.45,zBias:4,edge:'#1d6b52',lw:1.5}));
      if(st.out)ex.push(B.F([[-1.05,1.3,0],[1.05,1.3,0],[1.05,1.72,0],[-1.05,1.72,0]],'#34c98e',{flat:true,txt:'窒息熄灭 √',textCol:'#ffffff',txtScale:0.5,zBias:4,edge:'#1d8a5f',lw:1.5}));
    }else{
      st.splash.forEach(p=>ex.push(B.S([p.x,p.y,p.z],p.r,'#e8d9a8',{glow:true})));
      (st.stream||[]).forEach(s=>ex.push(B.S([s.x,s.y,0.08],s.r,'#e8d9a8',{glow:true})));
      st.mist.forEach(m=>ex.push({t:'glow',c:[m.x,m.y,m.z],r:m.r*4,col:'rgba(220,228,238,'+m.a.toFixed(2)+')'}));
      if(e.step===1&&e.stepT<0.9)ex.push(B.F([[0.2,1.78,0.3],[3.6,1.78,0.3],[3.6,2.18,0.3],[0.2,2.18,0.3]],'#c99234',{flat:true,txt:'错误：把水倒入浓硫酸！',textCol:'#ffffff',txtScale:0.4,zBias:4,edge:'#8f6a22',lw:1.5}));
      if(st.warn>0){
        ex.push({t:'glow',c:[1.0,1.1,0.3],r:2.4,col:'rgba(220,45,45,'+(0.2*Math.min(1,st.warn/2)).toFixed(2)+')'});
        ex.push(B.F([[0.2,1.78,0.3],[3.6,1.78,0.3],[3.6,2.18,0.3],[0.2,2.18,0.3]],'#e8564f',{flat:true,txt:'暴沸飞溅 · 危险！',textCol:'#ffffff',txtScale:0.4,zBias:4,edge:'#a83832',lw:1.5}));
      }
      if(e.step===2&&!st.done2)ex.push(B.F([[-1.35,1.82,0],[1.35,1.82,0],[1.35,2.24,0],[-1.35,2.24,0]],'#2a8f6f',{flat:true,txt:'浓硫酸沿玻璃棒缓缓注入…',textCol:'#ffffff',txtScale:0.42,zBias:4,edge:'#1d6b52',lw:1.5}));
      if(st.done2)ex.push(B.F([[-1.35,1.82,0],[1.35,1.82,0],[1.35,2.24,0],[-1.35,2.24,0]],'#34c98e',{flat:true,txt:'酸入水 · 安全 √',textCol:'#ffffff',txtScale:0.5,zBias:4,edge:'#1d8a5f',lw:1.5}));
    }
    return ex;
  },
  /* ===== 装配挑战（灵感①：点击选择零件 · 顺序判定 · 实时纠错） ===== */
  setupAsm(e){
    const groups=[],parts=[];
    const flat=ss=>{const o=[];ss.forEach(s=>Array.isArray(s)?o.push(...s):o.push(s));return o;}; /* B.BOX 返回 FACE 数组：展平后才能被渲染器识别 */
    const add=(name,shapes)=>{const fs=flat(shapes);groups.push([parts.length,parts.length-0]);parts.push(B.PT(name,fs));groups[groups.length-1]=[parts.length-1,parts.length-1];};
    if(e.item.asm==='gas'){
      /* 固液制气：锥形瓶 + 长颈漏斗（插瓶口 x0） + 弯管导管（塞孔 x0.18 引出） + 集气瓶 */
      add('锥形瓶',[
        B.L([[0.02,0],[0.6,0.02],[0.8,0.14],[0.85,0.4],[0.85,0.6],[0.3,1.6],[0.3,1.95],[0.37,1.97],[0.37,2.1],[0.3,2.12]],{alpha:.5}),
        B.L([[0.02,0.1],[0.74,0.18],[0.78,0.42],[0.78,0.62],[0.4,1.3],[0.08,1.35],[0.02,1.0]],{col:'#d9ecf4',alpha:.7,edge:null,flat:true,cull:true})
      ]);
      add('长颈漏斗',[
        B.L([[0.02,2.98],[0.12,3.0],[0.52,3.14],[0.55,3.34]],{alpha:.55}), /* 平滑锥形喇叭：无台阶无翻边，长颈漏斗标准形 */
        B.L([[0.02,0.5],[0.1,0.55],[0.11,0.7],[0.11,2.96],[0.12,2.98]],{alpha:.55}) /* 长颈直插到近瓶底：下端没入液面形成液封 */
      ]);
      add('弯管导管',[
        B.TUBE([0.18,2.15,0],[0.18,2.62,0],0.09,{alpha:.5}),
        B.TUBE([0.18,2.62,0],[1.6,2.62,0],0.09,{alpha:.5}),
        B.TUBE([1.6,2.62,0],[2.5,1.35,0],0.09,{alpha:.5}),
        B.TUBE([2.5,1.35,0],[2.35,0.4,0],0.075,{alpha:.5}), /* 向上排空气法：导管沿瓶口左侧伸入瓶内下部 */
        B.S([0.18,2.62,0],0.115,'#e6f2f8'), /* 弯头节点：让"上→水平→斜下→入瓶"四段走向清晰可辨 */
        B.S([1.6,2.62,0],0.115,'#e6f2f8'),
        B.S([2.5,1.35,0],0.105,'#e6f2f8')
      ]);
      add('集气瓶',[
        B.L([[0.02,0],[0.55,0.02],[0.62,0.1],[0.64,0.3],[0.64,1.05],[0.7,1.1],[0.7,1.2],[0.64,1.22]],{alpha:.5,off:[2.7,0,0]}),
        B.BOX(2.7,0.04,0,1.05,0.08,1.05,'#e8f4f8',{edge:'#b9d3e0'}), /* 外凸底座：集气瓶标准形态 */
        B.F([[3.3,0.05,0.52],[4.26,0.05,0.52],[4.26,1.07,0.52],[3.3,1.07,0.52]],'#f4fafd',{flat:true,edge:'#8fb8cf',lw:1}) /* 磨口玻璃片侧立瓶旁：纯白平面示意，收集满 CO₂ 后取下盖口 */
      ]);
    }else{
      /* 蒸馏：圆底烧瓶+支管 → 温度计 → 冷凝管（斜置） → 接收锥形瓶 */
      add('圆底烧瓶',[
        B.L([[0.02,0],[0.4,0.02],[0.55,0.15],[0.6,0.6],[0.45,1.0],[0.22,1.15],[0.22,1.7],[0.3,1.72],[0.3,1.84],[0.22,1.86]],{alpha:.5}),
        B.TUBE([0.26,1.55,0],[1.0,1.95,0],0.1,{alpha:.5})
      ]);
      add('温度计',[
        B.LN([0,2.05,0],[0,1.5,0],0.05,'#dfe6ec'),
        B.S([0,1.5,0],0.07,'#cf5050')
      ]);
      add('直形冷凝管',[
        B.TUBE([1.0,1.95,0],[2.6,1.0,0],0.09,{alpha:.5}),
        B.TUBE([1.18,1.9,0],[2.42,1.06,0],0.21,{alpha:.3}),
        B.TUBE([1.45,1.75,0.2],[1.45,2.15,0.2],0.06,{alpha:.5}),
        B.TUBE([2.15,1.2,-0.2],[2.15,0.8,-0.2],0.06,{alpha:.5})
      ]);
      add('锥形瓶',[
        B.L([[0.02,0],[0.45,0.02],[0.6,0.12],[0.65,0.35],[0.65,0.5],[0.25,1.0],[0.25,1.2],[0.32,1.22],[0.32,1.32],[0.25,1.34]],{alpha:.5,off:[2.6,0,0]}),
        B.TUBE([2.6,1.0,0],[2.6,0.55,0],0.09,{alpha:.5})
      ]);
    }
    VW.model=B.fin(parts);
    VW.asm={groups:groups,placed:0};
    VW.expPitch=-0.32; /* 微俯视：横向长装置（锥形瓶→集气瓶）四部件互不遮挡、气路全程可见 */
    fitModel(); /* 装置跨度大（x0~3.4）：不再拉近镜头，保证弯管与集气瓶完整可见 */
  },
  asmToast(msg){ /* toast 函数在 UI 块 IIFE 内部，跨块不可见（window.toast 是 DOM 元素）——装配块内联提示 */
    const t=document.getElementById('toast');
    if(!t)return;
    t.textContent=msg;t.classList.add('show');
    clearTimeout(this._asmToastT);
    this._asmToastT=setTimeout(()=>t.classList.remove('show'),2400);
  },
  asmPick(e,i){
    if(e.done)return;
    if(i===e.step){
      e.step++;
      VW.asm.placed=e.step;
      if(e.step>=e.item.asmParts.length){
        e.done=true;
        SIM.onDone&&SIM.onDone(e);
        SIM.asmToast('装配完成 √ 装置就绪');
      }else SIM.asmToast('正确：'+e.item.asmParts[i]+' 已就位');
      SIM.panel();needsDraw=true;
    }else{
      const why=e.item.asmWhy?e.item.asmWhy[i]:'装配原则：先下后上、先主后辅';
      SIM.asmToast('顺序不对：'+why);
    }
  },
  /* ---------- 通用 ---------- */
  update(e,dt){
    if(!e.playing||e.manual)return;
    const sp=e.speed||1;
    e.stepT+=dt*sp;
    const durs=SIM.durations(e.item);
    if(e.stepT>=durs[e.step]){
      e.stepT=0;
      if(e.step<durs.length-1)e.step++;
      else{e.playing=false;e.done=true;SIM.onDone&&SIM.onDone(e);}
      SIM.panel();
    }
    if(e.item.sim==='na')SIM.na(e,dt*sp);
    else if(e.item.sim==='tit')SIM.tit(e,dt*sp);
    else if(e.item.sim==='flame')SIM.flame(e,dt*sp);
    else if(e.item.sim==='drill')SIM.drill(e,dt*sp);
    VW.extra=SIM.extra(e);
    SIM.syncSeek(e);
  },
  total(e){const d=SIM.durations(e.item);return d.reduce((s,v)=>s+v,0);},
  pos(e){let t=0;for(let i=0;i<e.step;i++)t+=SIM.durations(e.item)[i];return t+e.stepT;},
  /* 回放：拖动时间轴 → 跳到任意时刻（随机粒子重置，确定性状态按 stepT 恢复） */
  seek(t){
    const e=VW.exp;if(!e)return;
    const durs=SIM.durations(e.item);
    const total=SIM.total(e);
    t=Math.max(0,Math.min(total-0.01,t));
    let acc=0,step=durs.length-1,stepT=durs[durs.length-1];
    for(let i=0;i<durs.length;i++){
      if(t<acc+durs[i]){step=i;stepT=t-acc;break;}
      acc+=durs[i];
    }
    e.step=step;e.stepT=stepT;e.done=false;
    if(e.item.sim==='na'){
      e.st.bubbles=[];e.st.ripples=[];e.st.mist=[];e.st.flames=[];
      if(e.st.na){e.st.na.x=step>=3?0.2:-1.9;e.st.na.z=0;}
      if(step>=3){e.st.redR=Math.min(1.48,Math.max(0,stepT>0.6?stepT-0.6:0)*0.9);e.st.redA=Math.min(0.8,(e.st.redR/1.48)*0.78);}
      else{e.st.redR=0;e.st.redA=0;}
    }
    if(e.item.sim==='flame'){e.st.particles=[];e.st.sparks=[];}
    if(e.item.sim==='tit'){e.st.drops=[];e.st.swirls=[];e.st.splashes=[];}
    if(e.item.sim==='tit')SIM.tit(e,0);
    SIM.panel();SIM.extra(e);needsDraw=true;
  },
  syncSeek(e){ /* 播放中同步滑块位置（不重建 DOM） */
    const sk=$('expSeek');if(!sk)return;
    sk.value=Math.round(SIM.pos(e)/SIM.total(e)*1000);
    const tl=$('expSeekTxt');if(tl)tl.textContent=SIM.pos(e).toFixed(1)+'s / '+SIM.total(e).toFixed(0)+'s';
  },
  extra(e){
    VW.extra=[];
    if(e.item.sim==='na')VW.extra=SIM.naExtra(e);
    else if(e.item.sim==='tit')VW.extra=SIM.titExtra(e);
    else if(e.item.sim==='flame')VW.extra=SIM.flameExtra(e);
    else if(e.item.sim==='drill')VW.extra=SIM.drillExtra(e);
    return VW.extra;
  },
  togglePlay(){
    const e=VW.exp;if(!e)return;
    if(e.done)SIM.reset();
    e.playing=!e.playing;
    SIM.panel();
  },
  goStep(i){
    const e=VW.exp;if(!e)return;
    const durs=SIM.durations(e.item);
    e.step=Math.max(0,Math.min(durs.length-1,i));
    e.stepT=0;e.done=false;e.playing=true;
    if(e.item.sim==='na'){e.st.bubbles=[];}
    if(e.item.sim==='flame'){e.st.particles=[];}
    SIM.panel();
  },
  reset(){
    const e=VW.exp;if(!e)return;
    e.step=0;e.stepT=0;e.done=false;e.playing=false;e.manual=false;
    SIM.setup(e.item,e);
    VW.extra=[];
    SIM.panel();needsDraw=true;
  },
  panel(){
    const e=VW.exp;if(!e)return;
    if(e.item.id==='tit'&&window.ChemTitration?.isManual()){window.ChemTitration.render();return;}
    const p=$('expPanel');
    const durs=SIM.durations(e.item);
    const steps=e.item.steps;
    if(e.item.asm){ /* 装配挑战面板：零件选择 + 顺序判定 */
      let asmBtns='';
      e.item.asmParts.forEach((nm,i)=>{
        asmBtns+='<button data-asm="'+i+'" class="'+(i<e.step?'ok':'')+'">'+(i<e.step?'✓ ':'')+nm+'</button>';
      });
      p.innerHTML='<h4>'+e.item.name+' · 已装 '+e.step+'/'+e.item.asmParts.length+'</h4>'+
        '<div class="exp-steps">'+steps.map((s,i)=>'<div class="st'+(i<e.step?' done':i===e.step?' cur':'')+'"></div>').join('')+'</div>'+
        '<div class="step-txt">'+(e.done?'🎉 装置装配完成！可拖拽旋转检查整体，或在详情面板生成实验报告。':'装配提示：'+steps[e.step].txt)+'</div>'+
        (e.done?'':'<div class="asm-list">'+asmBtns+'</div>')+
        '<div class="exp-ctrl"><button data-act="rst">重新装配</button></div>';
      p.classList.add('show');
      p.querySelectorAll('button[data-asm]').forEach(b=>{
        b.addEventListener('click',()=>SIM.asmPick(e,parseInt(b.getAttribute('data-asm'),10)));
      });
      const rst=p.querySelector('button[data-act="rst"]');
      if(rst)rst.addEventListener('click',()=>SIM.reset());
      return;
    }
    const durs2=SIM.durations(e.item);
    let bars='';
    steps.forEach((s,i)=>{bars+='<div class="st'+(i<e.step?' done':i===e.step?(e.playing||e.done?' cur':' cur'):'')+'"></div>';});
    const pos=SIM.pos(e),tot=SIM.total(e);
    const speeds=[[0.25,'0.25×'],[0.5,'0.5×'],[1,'1×'],[2,'2×']];
    p.innerHTML='<h4>'+e.item.name+' · 步骤 '+(e.step+1)+'/'+steps.length+'</h4>'+
      '<div class="exp-steps">'+bars+'</div>'+
      '<div class="step-txt">'+steps[e.step].t+'：'+steps[e.step].txt+'</div>'+
      '<div class="exp-prog"><input type="range" id="expSeek" min="0" max="1000" value="'+Math.round(pos/tot*1000)+'" aria-label="实验回放进度"><span id="expSeekTxt">'+pos.toFixed(1)+'s / '+tot.toFixed(0)+'s</span></div>'+
      '<div class="exp-ctrl">'+
      '<button data-act="rst">重置</button>'+
      '<button data-act="prev">上一步</button>'+
      '<button class="primary" data-act="play">'+(e.playing?'暂停':'播放')+'</button>'+
      '<button data-act="next">下一步</button></div>'+
      '<div class="exp-speed">'+speeds.map(s=>'<button data-sp="'+s[0]+'" class="'+((e.speed||1)===s[0]?'on':'')+'">'+s[1]+'</button>').join('')+'<span class="sp-l">分步观察现象；静态讲解不含反应动画</span></div>';
    p.classList.add('show');
    p.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click',()=>{
        const a=b.getAttribute('data-act');
        if(a==='play')SIM.togglePlay();
        else if(a==='prev')SIM.goStep(e.step-1);
        else if(a==='next')SIM.goStep(e.step+1);
        else if(a==='rst')SIM.reset();
      });
    });
    const sk=$('expSeek');
    if(sk)sk.addEventListener('input',()=>{
      if(e.playing)e.playing=false; /* 拖动时暂停，便于精确定位 */
      SIM.seek(sk.value/1000*SIM.total(e));
    });
    p.querySelectorAll('.exp-speed button').forEach(b=>{
      b.addEventListener('click',()=>{e.speed=parseFloat(b.getAttribute('data-sp'));SIM.panel();});
    });
  }
};
window.SIM=SIM;
window.needsDraw=function(){needsDraw=true;};
window.fitModel=fitModel;window.resetView=resetView;window.resizeCv=resize;
/* 实验完成度记录（灵感⑦：学习环中的"观察"环节） */
SIM.onDone=function(e){
  if(e.item&&e.item.id){
    const done=store2.get('expdone',{});
    done[e.item.id]=Date.now();
    store2.set('expdone',done);
  }
};
/* localStorage 简易封装（SIM 块内独立于 UI 块的 store） */
function store2get(k,d){try{const v=localStorage.getItem('chem3d_'+k);return v!==null?JSON.parse(v):d;}catch(e){return d;}}
var store2={get:store2get,set:function(k,v){try{localStorage.setItem('chem3d_'+k,JSON.stringify(v));}catch(e){}}};
})();
</script>

<script>
(function(){'use strict';

/* ---------- 图标库（Lucide 风格） ---------- */
const I={

const EINFO={1:{u:"工业上主要用来合成氨造化肥，以及在炼油中给油品加氢；也是燃料电池和火箭的燃料。",a:["合成氨化肥","氢燃料电池车","石油精炼加氢","氢化植物油"]},2:{u:"沸点最低，是超导磁体唯一可行的冷却剂；化学上完全惰性，还用作保护气和深潜呼吸气。",a:["医院 MRI 磁体冷却","气球与飞艇","深海潜水混合气","半导体制造保护气"]},3:{u:"最轻的金属，储能能力极高，几乎所有可充电设备都靠它；碳酸锂还是双相情感障碍的经典药物。",a:["手机与电动车锂电池","双相障碍治疗药","耐热玻璃陶瓷炊具","高温润滑脂"]},4:{u:"又轻又硬且不产生火花，用于精密仪器与安全工具；对 X 射线几乎透明，是 X 光管的窗口材料。",a:["防爆无火花扳手","X 光机窗口","航天与卫星结构件","高端扬声器振膜"]},5:{u:"硼硅玻璃耐骤冷骤热，是实验室和烤箱玻璃器皿的基础；硼还能强烈吸收中子，用于反应堆控制。",a:["耐热玻璃锅具与量杯","洗涤剂中的硼砂","核反应堆控制棒","玻璃纤维与农用硼肥"]},6:{u:"所有有机物和生命的骨架元素。同一个元素能变成最软的石墨和最硬的金刚石，用途横跨整个工业。",a:["铅笔芯与电池电极（石墨）","切割工具与首饰（金刚石）","净水器与口罩活性炭","碳纤维车架与球拍"]},7:{u:"空气的主要成分。合成氨把它变成化肥，直接支撑了全球约一半人口的粮食供给。",a:["氮肥（哈伯法）","液氮冷冻与冷链","食品包装充氮保鲜","轮胎充氮"]},8:{u:"呼吸赖以为生，也是炼钢的关键 —— 现代炼钢靠吹氧脱碳。医疗与焊接同样离不开它。",a:["医用供氧与急救","炼钢吹氧","氧炔焊接与切割","污水处理曝气"]},9:{u:"牙膏里的氟化物能显著防蛀；聚四氟乙烯就是不粘锅涂层。制冷剂和大量药物也含氟。",a:["牙膏防蛀氟化物","不粘锅涂层（特氟龙）","空调冰箱制冷剂","含氟药物与铀浓缩"]},10:{u:"通电发出标志性的橙红色光，霓虹招牌因此得名；也用于高压指示灯和准分子激光。",a:["霓虹灯招牌","高压电指示灯","准分子激光器","低温制冷剂"]},11:{u:"以食盐形式进入每一餐，也是人体神经传导必需的电解质；工业上制烧碱、小苏打和路灯。",a:["食盐与人体电解质","小苏打与烧碱","高压钠灯路灯","钠冷快中子堆"]},12:{u:"密度最低的结构金属，笔记本外壳和汽车轻量化都靠镁铝合金；还是叶绿素的中心原子。",a:["笔记本与汽车镁合金件","烟花与照明弹","泻盐与抗酸胃药","叶绿素核心"]},13:{u:"轻、耐蚀、可无限回收，是用量仅次于铁的金属；从易拉罐到飞机机身都是它。",a:["易拉罐与铝箔","门窗与幕墙","飞机机身与轮毂","高压输电线"]},14:{u:"整个信息时代建立在硅晶圆上；同时以二氧化硅的形式构成玻璃、水泥和沙子。",a:["芯片与集成电路","太阳能电池板","玻璃与水泥","硅胶密封与干燥剂"]},15:{u:"生命的能量货币 ATP 和 DNA 骨架都含磷；农业上是三大肥料元素之一，缺它作物无法生长。",a:["磷肥","火柴头","DNA 与 ATP","阻燃剂与洗涤剂"]},16:{u:"硫酸产量常被用作衡量一国工业规模的指标；橡胶硫化让轮胎从黏软变得坚韧耐磨。",a:["硫酸（工业之母）","轮胎橡胶硫化","火药与烟花","农药杀菌与葡萄园"]},17:{u:"自来水消毒每年避免大量水源性疾病，是公共卫生史上最重要的措施之一；也是 PVC 塑料的原料。",a:["自来水与泳池消毒","84 消毒液与漂白剂","PVC 管材与地板","盐酸"]},18:{u:"空气中含量第三的气体，便宜又惰性，是焊接时隔绝氧气的首选保护气；也灌进中空玻璃隔热。",a:["氩弧焊保护气","中空玻璃填充","灯泡与荧光灯填充","金属冶炼保护气氛"]},19:{u:"与钠共同维持细胞内外的电位差，心跳和神经信号都依赖它；农业上是三大肥料元素之一。",a:["钾肥","香蕉等食物中的电解质","硝石（黑火药）","软肥皂与玻璃"]},20:{u:"骨骼和牙齿的主要成分；以石灰和水泥的形式，也是人类用量最大的建筑材料基础。",a:["骨骼与牙齿","水泥与石灰","钙片与牛奶","豆腐凝固剂、烟气脱硫"]},21:{u:"加进铝里能显著提高强度而几乎不增重，用于高端自行车架、棒球棒和航空部件。",a:["铝钪合金自行车架","棒球棒与航空件","金属卤化物灯","固体氧化物燃料电池"]},22:{u:"强度接近钢却轻得多，且与人体组织相容，是人工关节和牙种植体的标准材料。",a:["人工关节与牙种植体","飞机发动机与机体","钛白粉（涂料、防晒霜）","眼镜架与高端表壳"]},23:{u:"少量钒就能让钢的强度和韧性大幅提升，扳手、弹簧和工具钢都靠它；也用于大规模储能电池。",a:["铬钒钢工具与扳手","弹簧与轴承钢","钒液流储能电池","制硫酸催化剂"]},24:{u:"不锈钢之所以不锈，靠的就是铬在表面自发形成的致密氧化膜；电镀铬则提供镜面般的耐磨层。",a:["不锈钢餐具与厨具","水龙头与汽车镀铬件","皮革鞣制","颜料与耐火砖"]},25:{u:"炼钢时脱氧去硫，几乎所有钢材都含锰；高锰钢极耐冲击磨损，用于铁轨和挖掘机斗齿。",a:["钢铁脱氧与高锰钢铁轨","干电池正极","高锰酸钾消毒","铝合金与玻璃脱色"]},26:{u:"人类用量最大的金属，钢铁撑起了建筑、桥梁、汽车和铁路；在体内则是血红蛋白运氧的核心。",a:["钢筋、桥梁与汽车","血红蛋白运氧","永磁体与变压器铁芯","补铁剂与铁强化食品"]},27:{u:"锂电池正极的关键成分，也是维生素 B12 的中心原子；钴蓝自古就是最珍贵的蓝色颜料。",a:["锂电池正极材料","维生素 B12","钴蓝玻璃与陶瓷釉","超硬合金刀具、钴 60 放疗"]},28:{u:"不锈钢里的镍决定了它的韧性和耐蚀性；镍还广泛用于电镀、硬币和充电电池。",a:["不锈钢与耐蚀合金","镍氢/锂电池材料","硬币与电镀层","人造奶油氢化催化剂"]},29:{u:"导电性仅次于银而便宜得多，几乎所有电线和电路板都用铜；表面还能持续杀灭细菌。",a:["电线电缆与电路板","自来水管与暖气管","黄铜与青铜器件","医院抗菌门把手"]},30:{u:"镀锌是最经济有效的钢铁防锈手段，路灯杆和护栏都靠它；氧化锌还是物理防晒霜的主力成分。",a:["镀锌钢材防锈","物理防晒霜与痱子粉","黄铜","锌补充剂与干电池"]},31:{u:"氮化镓充电器之所以能做得又小又凉，就是因为镓基半导体损耗低；蓝光 LED 也是氮化镓做的。",a:["氮化镓快充充电器","蓝光与白光 LED","手机射频芯片","镓铟合金替代水银温度计"]},32:{u:"对红外线高度透明，是热成像和夜视镜头的标准材料；光纤中也靠掺锗调节折射率。",a:["热成像与夜视镜头","光纤芯掺杂","红外光学窗口","PET 塑料聚合催化剂"]},33:{u:"砷化镓芯片比硅更快更省电，手机射频前端普遍采用；三氧化二砷则是治疗白血病的有效药物。",a:["砷化镓射频芯片","高效太阳能电池","白血病治疗药物","曾用于木材防腐（现受限）"]},34:{u:"人体必需的微量元素，是抗氧化酶的活性中心；二硫化硒还是去屑洗发水的有效成分。",a:["抗氧化营养素","去屑洗发水","玻璃脱色与红色玻璃","复印机与激光打印感光鼓"]},35:{u:"溴系阻燃剂曾广泛用于电子外壳和家具泡沫；溴化银则是胶片摄影的感光核心。",a:["阻燃剂","胶片摄影感光材料","泳池消毒剂","镇静与抗癫痫药（历史）"]},36:{u:"比氩更重更惰性，灌进白炽灯能延长寿命、提高亮度；也用于高性能中空玻璃和摄影闪光灯。",a:["高效白炽灯与闪光灯","高性能中空玻璃","氪激光器","高速摄影光源"]},37:{u:"铷原子钟精度极高、成本远低于铯钟，广泛用于通信基站和卫星导航的时间同步。",a:["铷原子钟与基站授时","真空管吸气剂","光电倍增管","冷原子物理研究"]},38:{u:"烟花里那抹鲜艳的红色就是锶发出的；含锶牙膏则能封闭牙本质小管，缓解牙齿敏感。",a:["烟花与信号弹的红色","抗敏感牙膏","老式显像管玻璃","铁氧体永磁"]},39:{u:"白光 LED 的黄色荧光粉以钇为基础 —— 蓝光芯片加这层荧光粉才变成白光；也用于 YAG 激光。",a:["白光 LED 荧光粉","YAG 激光器","氧化锆陶瓷刀稳定剂","高温超导材料"]},40:{u:"几乎不吸收中子又耐高温高压，是核燃料棒包壳的唯一选择；氧化锆陶瓷则做成牙冠和陶瓷刀。",a:["核燃料棒包壳","氧化锆牙冠与陶瓷刀","止汗剂有效成分","耐火材料与铸造砂"]},41:{u:"铌钛超导线是 MRI 和粒子加速器磁体的标准材料；微量铌还能让管线钢更强更韧。",a:["MRI 与加速器超导磁体","高强度管线钢","电容器与首饰","喷气发动机超合金"]},42:{u:"含钼钢在高温下仍保持强度，用于刀具、钻头和高压管道；二硫化钼是耐极压的固体润滑剂。",a:["高速钢刀具与钻头","二硫化钼润滑剂","石油脱硫催化剂","植物必需微量元素"]},43:{u:"第一个人工合成的元素。锝 99m 是全世界使用最多的医用放射性同位素，每年数千万次显像检查靠它。",a:["核医学显像（骨扫描、心肌灌注）","甲状腺与肾功能检查","工业示踪"]},44:{u:"硬盘盘片中的钌薄层让磁记录密度大幅提升；也是电接触材料和多种工业催化剂的成分。",a:["硬盘磁记录层","电子接触与电阻","合成氨与制氢催化剂","耐磨钢笔尖"]},45:{u:"汽车三元催化器中最关键的一种金属，专门负责把氮氧化物还原成氮气，价格因此常年居高。",a:["汽车三元催化器","白金首饰的镀层","玻璃纤维成型模具","工业催化剂"]},46:{u:"能吸收自身体积数百倍的氢气，用于氢气提纯；也是汽车催化器和手机陶瓷电容的关键材料。",a:["汽车尾气催化器","手机中的陶瓷电容","氢气提纯与储存","牙科合金与首饰"]},47:{u:"导电导热性能均居所有金属之首，太阳能电池板正面的细密银浆栅线就是靠它导出电流；还有强抗菌性。",a:["太阳能电池银浆","首饰与餐具","抗菌敷料与伤口膏","电子触点与胶片摄影"]},48:{u:"镉黄、镉红是画家钟爱的鲜艳颜料；但镉毒性高且在体内蓄积，电池和电镀用途已大幅受限。",a:["镉黄/镉红颜料","镍镉电池（淘汰中）","量子点显示材料","核反应堆控制棒"]},49:{u:"氧化铟锡（ITO）既导电又透明，是所有触摸屏和液晶面板必需的透明电极，几乎无可替代。",a:["触摸屏与液晶透明电极","低熔点合金与保险丝","半导体与 LED","真空密封垫"]},50:{u:"熔点低又不易氧化，是电子焊锡的主角；镀在钢罐内壁就成了马口铁，用于食品罐头。",a:["电子焊锡","马口铁食品罐头","青铜器与乐器","PVC 塑料稳定剂"]},51:{u:"三氧化二锑是应用最广的阻燃增效剂，与溴系阻燃剂配合用于电视外壳和线缆；也用于铅酸电池板栅。",a:["阻燃剂增效成分","铅酸电池板栅","半导体与红外探测器","玻璃与陶瓷澄清剂"]},52:{u:"碲化镉薄膜太阳能电池成本低、弱光发电好，是大型光伏电站的重要技术路线；碲化铋则用于制冷片。",a:["碲化镉薄膜太阳能","半导体制冷片（车载冰箱）","易切削钢添加剂","可录光盘记录层"]},53:{u:"缺碘会导致甲状腺肿和儿童智力发育障碍，食盐加碘是覆盖人口最广的公共营养干预之一。",a:["碘盐防治甲状腺疾病","碘伏与碘酒消毒","X 光造影剂","碘钨灯"]},54:{u:"氙气大灯亮度接近日光且更省电；氙还是效率极高的太空离子推进剂，多个探测器靠它飞行。",a:["汽车氙气大灯","摄影闪光灯与影院灯","卫星与探测器离子推进","吸入式麻醉与医学成像"]},55:{u:"\"秒\"的国际定义就建立在铯 133 原子的跃迁频率上 —— 全球时间标准和 GPS 都以铯钟为基准。",a:["铯原子钟（秒的定义）","GPS 与电网授时","石油钻井高密度钻井液","光电与离子推进"]},56:{u:"硫酸钡不溶且不被吸收，喝下去能让消化道在 X 光下清晰显影，就是俗称的\"钡餐\"。",a:["钡餐消化道造影","石油钻井泥浆加重剂","烟花的绿色","玻璃与陶瓷釉"]},72:{u:"二氧化铪的高介电常数让晶体管在纳米尺度下不再漏电，是 45 纳米以下芯片能继续微缩的关键材料。",a:["芯片高 k 栅介质","核反应堆控制棒","等离子切割电极","喷气发动机超合金"]},73:{u:"钽电容体积小、容量大、性能稳定，是手机和笔记本主板上的常客；钽还与人体高度相容，用于骨科植入。",a:["手机与电脑钽电容","骨科与颅骨修复植入物","化工耐腐蚀反应器","硬质合金刀具"]},74:{u:"熔点是所有金属中最高的（3422 ℃）。碳化钨硬度仅次于金刚石，几乎所有金属切削刀具和钻头都用它。",a:["硬质合金刀具与钻头","白炽灯与卤素灯灯丝","飞镖与高尔夫配重","X 射线管靶材"]},75:{u:"地壳中最稀有的稳定元素之一。喷气发动机最热的涡轮叶片靠含铼超合金才能在接近熔点的环境下工作。",a:["喷气发动机涡轮叶片","汽油重整催化剂","高温热电偶","半导体与电子靶材"]},76:{u:"密度最大的天然元素。锇合金极耐磨，曾是高级钢笔尖和唱针的标准材料；四氧化锇是电镜染色剂。",a:["高级钢笔尖与唱针","电子显微镜染色剂","仪器轴承与触点","耐磨合金"]},77:{u:"铱火花塞电极极细且耐蚀，寿命可达普通火花塞数倍；地层中的铱异常还是恐龙灭绝小行星撞击的关键证据。",a:["长寿命铱火花塞","晶体生长坩埚","深空探测器热源包壳","恐龙灭绝的地质证据"]},78:{u:"汽车催化器中负责氧化一氧化碳和碳氢化合物；顺铂等铂类药物则是多种癌症化疗的一线方案。",a:["汽车尾气催化器","顺铂等抗癌药","首饰与实验室器皿","燃料电池催化剂"]},79:{u:"不氧化不变色且延展性极佳，电子接插件镀金是为了长期接触可靠；航天器也贴金膜隔绝红外辐射。",a:["首饰与金融储备","电子接插件镀金","牙科修复","航天器隔热金膜"]},80:{u:"唯一常温液态的金属。曾是温度计和血压计的标准，但因神经毒性正被全球逐步淘汰。",a:["温度计与血压计（淘汰中）","荧光灯与节能灯","牙科银汞合金","氯碱工业电解"]},81:{u:"毒性极强，曾作鼠药和\"继承粉\"而臭名昭著；如今主要用于心肌灌注显像和红外光学。",a:["心肌灌注显像","红外光学元件","高温超导材料","鼠药（已禁用）"]},82:{u:"密度大又便宜，是 X 光防护铅衣和铅板的标准材料；汽车启动电池至今仍以铅酸电池为主。",a:["汽车铅酸启动电池","X 光防护铅衣与铅玻璃","辐射屏蔽与配重","曾用于汽油与油漆（已禁）"]},83:{u:"毒性远低于同族的铅，正在多个场合取代铅：无铅焊料、无铅子弹、渔具配重；胃药\"次水杨酸铋\"也是它。",a:["止泻胃药（次水杨酸铋）","无铅焊料与子弹","化妆品珠光颜料","消防喷淋易熔合金"]},84:{u:"放射性极强，一克钋释放的热量足以让自身炽热。曾用于消除静电的电离器，也曾是航天器热源。",a:["静电消除器（工业与摄影）","航天器热源（历史）","中子源引发剂"]},85:{u:"地壳中最稀有的天然元素，全球任一时刻的总量不足一克。砹 211 正被研究用于靶向 α 放疗。",a:["靶向 α 放疗研究（癌症）"]},86:{u:"从土壤渗入室内的放射性气体，是仅次于吸烟的肺癌成因，许多国家要求新建住宅做氡检测。",a:["室内空气污染检测对象","地质与地震监测示踪","放射治疗（历史用途）"]},87:{u:"天然存在量极少，半衰期仅 22 分钟，从未被大量制得。没有实际用途，仅用于原子结构研究。",a:[]},88:{u:"居里夫妇发现的元素。曾大量用于夜光表盘，导致\"镭女郎\"职业中毒事件，如今已被安全材料全面取代。",a:["夜光表盘与早期放疗（均已淘汰）","工业射线探伤源（历史）"]},104:{u:"第一个超锕系元素。科学家逐个原子地研究它的化学性质，用以检验相对论效应是否会打乱周期律。",a:[]},105:{u:"半衰期仅数十秒。化学实验必须在合成后的几秒内完成，是「单原子化学」的极限挑战。",a:[]},106:{u:"以西博格命名，是首个以在世科学家命名的元素，当时曾引发不小的争议。",a:[]},107:{u:"命名自玻尔。实验证实它的化学性质与同族的铼相似，支持了周期表在超重区依然有效。",a:[]},108:{u:"已知密度最大的元素（推算约 41 g/cm³）。曾成功合成四氧化物，证明它确实像同族的锇。",a:[]},109:{u:"命名自发现核裂变理论解释的迈特纳。至今合成总量不足百个原子。",a:[]},110:{u:"命名自德国达姆施塔特的重离子研究所 —— 107 到 112 号元素都在那里首次合成。",a:[]},111:{u:"命名自 X 射线的发现者伦琴，恰好在其发现 X 射线一百周年前后被确认。",a:[]},112:{u:"命名自哥白尼。理论预测它可能像汞一样具有挥发性，实验结果也支持这一点。",a:[]},113:{u:"第一个由亚洲团队（日本理化学研究所）发现并命名的元素，名字取自日本的古称。",a:[]},114:{u:"命名自弗廖罗夫。它被认为接近理论预测的「稳定岛」—— 超重元素半衰期可能重新变长的区域。",a:[]},115:{u:"命名自莫斯科州。合成它需要用钙 48 离子束轰击镅靶，持续数月才能得到几个原子。",a:[]},116:{u:"命名自劳伦斯利弗莫尔国家实验室。半衰期仅数十毫秒，几乎在生成的瞬间就衰变。",a:[]},117:{u:"目前唯一需要专门在反应堆中培育锫靶材才能合成的元素，整个流程耗时两年以上。",a:[]},118:{u:"已知最重的元素，位于周期表最后一格。虽在稀有气体列，理论却预测它可能并不惰性，甚至可能是固体。",a:[]},57:{u:"镍氢电池的负极合金以镧为主，混合动力车电池长期依赖它；高折射率镧玻璃则用于相机镜头。",a:["镍氢电池负极合金","相机与望远镜镜头玻璃","石油催化裂化","打火石合金"]},58:{u:"储量最丰富的稀土。二氧化铈是玻璃抛光的行业标准，手机屏幕和镜片抛光几乎都用它。",a:["玻璃与屏幕抛光粉","汽车尾气催化储氧","自清洁烤箱涂层","打火石与防紫外玻璃"]},59:{u:"掺镨的玻璃能滤掉钠光的强黄光，是焊工和玻璃工护目镜的标准材料；也用于强永磁体。",a:["焊工与玻璃工护目镜","钕镨永磁体","玻璃与陶瓷黄绿着色","光纤放大器"]},60:{u:"钕铁硼是目前最强的永磁体，让耳机、硬盘、电动车电机和风力发电机得以做小做强 —— 现代生活到处是它。",a:["耳机与扬声器磁体","电动车驱动电机","风力发电机","硬盘音圈与磁力扣"]},61:{u:"唯一没有稳定同位素的轻稀土，自然界几乎不存在。曾用于夜光表盘，现主要作核电池和厚度计。",a:["核电池（航天与心脏起搏器研究）","厚度测量仪","夜光涂料（历史用途）"]},62:{u:"钐钴磁体在 300 ℃ 以上仍不退磁，用于航空航天和军用电机等钕磁体扛不住的高温场合。",a:["耐高温钐钴磁体","骨癌骨转移止痛放射药","核反应堆中子吸收","航空电机与传感器"]},63:{u:"发光效率极高的红色与蓝色荧光粉基础，彩色显示和节能灯的色彩靠它；欧元纸币的防伪荧光也含铕。",a:["显示器与节能灯红蓝荧光粉","欧元纸币防伪","LED 照明显色","核反应堆控制"]},64:{u:"钆的顺磁性极强，注射钆造影剂能让 MRI 中的血管和病灶大幅提高对比度，是临床最常用的 MRI 造影剂。",a:["MRI 造影剂","中子屏蔽与反应堆控制","磁制冷技术","绿色荧光粉与 X 光增感屏"]},65:{u:"三基色荧光灯里的绿色成分主要来自铽；铽合金还有极强的磁致伸缩效应，用于声呐和精密驱动器。",a:["荧光灯与显示器绿色荧光粉","声呐磁致伸缩换能器","磁光存储介质","固态照明"]},66:{u:"给钕磁体加镝能显著提高耐热性，电动车电机和风机在高温下不退磁全靠它 —— 也是最紧缺的稀土之一。",a:["电动车与风机磁体耐热添加","核反应堆控制棒","磁致伸缩材料","高强度激光材料"]},67:{u:"钬激光能在水中高效切割软组织，是碎肾结石和前列腺微创手术的主流器械。",a:["钬激光碎石与前列腺手术","磁体磁极片（磁矩最强）","玻璃与立方氧化锆着色","核反应堆控制"]},68:{u:"掺铒光纤放大器让光信号无需转成电信号就能直接放大，是跨洋海底光缆和整个互联网骨干的基础。",a:["光纤放大器（互联网骨干）","铒激光皮肤与牙科治疗","粉红色玻璃与釉","核燃料控制"]},69:{u:"最稀有的稳定稀土之一。铥同位素做成便携式 X 射线源，无需电源即可在野外和战地拍片。",a:["便携式 X 射线源","铥激光外科手术","高温超导材料","激光测距"]},70:{u:"掺镱光纤激光器电光转换效率极高，已成为工业金属切割和焊接的主力设备；也用于最精确的原子钟。",a:["光纤激光切割与焊接","光晶格原子钟","地震与地质应变计","不锈钢晶粒细化"]},71:{u:"硅酸镥晶体探测伽马射线又快又灵敏，是 PET 扫描仪的核心探测材料；镥 177 则用于靶向放疗。",a:["PET 扫描探测晶体","前列腺癌靶向放疗","石油裂化催化剂","发光二极管材料"]},89:{u:"锕 225 释放的 α 粒子射程极短，能在杀死癌细胞的同时几乎不伤及周围组织，是靶向放疗的前沿药物。",a:["靶向 α 放疗（前列腺癌等）","中子源"]},90:{u:"储量约为铀的三到四倍，且难以用于武器，钍基熔盐堆因此被视为下一代核能的重要路线之一。",a:["钍基核燃料研究","高折射率光学玻璃","气灯纱罩（历史）","高温合金与焊条"]},91:{u:"天然存在量极微且提取困难，价格昂贵。除同位素年代测定外没有实际应用。",a:["海洋沉积物年代测定"]},92:{u:"核电站的燃料，全球约十分之一的电力由铀裂变提供；贫铀密度极大，用于装甲和穿甲弹。",a:["核电站燃料","核武器","贫铀装甲与配重","铀玻璃（历史）"]},93:{u:"第一个超铀元素。主要作为生产钚 238 的原料，也用于探测高能中子的仪器。",a:["钚 238 生产原料","高能中子探测器"]},94:{u:"钚 238 的衰变热能稳定供电数十年，旅行者号、好奇号和毅力号等深空探测器都靠它工作。",a:["深空探测器同位素电池","核武器","心脏起搏器电源（历史）"]},95:{u:"离日常生活最近的锕系元素 —— 绝大多数离子式烟雾报警器里都有极微量的镅 241，靠它电离空气探测烟雾。",a:["离子式烟雾报警器","厚度与密度测量仪","中子源与石油测井"]},96:{u:"火星车上的 α 粒子 X 射线谱仪用锔 244 轰击岩石以测定成分 —— 勇气号、机遇号和好奇号都带着它。",a:["火星车岩石成分分析仪","同位素电源研究"]},97:{u:"只能在反应堆中以微克级合成。唯一实际用途是作为合成更重元素（如 117 号）的靶材。",a:["合成超重元素的靶材"]},98:{u:"极强的中子源，一微克每秒放出数百万个中子。用于金矿银矿勘探、反应堆启动和部分肿瘤的近距离治疗。",a:["便携中子源（探矿与测井）","反应堆启动中子源","中子俘获癌症治疗"]},99:{u:"在首次氢弹试验的残骸中被发现。产量以微克计，除基础研究外没有应用。",a:[]},100:{u:"目前只能通过中子俘获少量制得，且无法以称量级获得。仅用于核物理研究。",a:[]},101:{u:"为纪念门捷列夫命名。每次只能合成几个原子，仅用于验证锕系元素的化学行为。",a:[]},102:{u:"命名自诺贝尔。半衰期以分钟计，只能以单个原子的规模研究，没有任何实际用途。",a:[]},103:{u:"锕系的最后一个元素。它的电子排布曾长期存疑，2015 年的实验最终确认了周期表的排布方式。",a:[]}};

/* ---------- Toast ---------- */
let toastT=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- 导航树 ---------- */
function renderNav(){
  const tree=$('navTree');
  let h='';
  NAV.forEach(mod=>{
    if(mod.doc){
      h+='<div class="nav-group" data-core-nav><button class="nav-cat" data-doc="'+mod.id+'">'+svg(mod.icon,'ni')+'<span>'+mod.name+'</span></button></div>';
      return;
    }
    if(mod.pt){
      h+='<div class="nav-group" data-core-nav><button class="nav-cat" data-pt="1">'+svg(mod.icon,'ni')+'<span>'+mod.name+'<span class="cnt">118</span></span><span class="chev">'+svg('chev','')+'</span></button></div>';
      return;
    }
    const items=DATA[mod.kind];
    const gs=mod.groups.filter(g=>items.some(it=>g.match(it.sub)));
    h+='<div class="nav-group" data-core-nav><button class="nav-cat" data-mod="'+mod.id+'">'+svg(mod.icon,'ni')+'<span>'+mod.name+'<span class="cnt">'+items.length+'</span></span><span class="chev">'+svg('chev','')+'</span></button>';
    h+='<div class="subnav"><div class="subnav-inner">';
    let curBook=null,nBook=0;
    gs.forEach(g=>{
      if(g.book!==curBook){
        if(curBook!==null)h+='</div>';
        h+='<div class="nav-book"><span class="bk-dot"></span><span>'+g.book+'</span><span class="bk-chev">'+svg('chev','')+'</span></div><div class="book-body">';
        curBook=g.book;nBook++;
      }
      const list=items.filter(it=>g.match(it.sub));
      h+='<div class="sub-title" title="'+g.name+'"><span>'+g.name+'</span><span class="cnt2">'+list.length+'</span></div>';
      list.forEach(it=>{
        const f=favs[favKey(mod.kind,it.id)];
        h+='<button class="sub-item" data-kind="'+mod.kind+'" data-id="'+it.id+'"><span class="dot"></span><span>'+it.name+'</span>'+(f?'<span class="fav">'+svg('starF','')+'</span>':'')+'</button>';
      });
    });
    if(curBook!==null)h+='</div>';
    h+='</div></div></div>';
  });
  const template=document.createElement('template');
  template.innerHTML=h;
  const groups=template.content;
  groups.querySelectorAll('.nav-cat[data-pt]').forEach(btn=>{
    btn.addEventListener('click',()=>enterPT());
  });
  groups.querySelectorAll('.nav-cat').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const docId=btn.getAttribute('data-doc');
      if(docId){if(docId==='home')showHome();else showBP();return;}
      const sub=btn.nextElementSibling;
      if(!sub)return;
      btn.classList.toggle('open');
      sub.classList.toggle('open');
    });
  });
  /* 册标题可折叠 */
  groups.querySelectorAll('.nav-book').forEach(bk=>{
    bk.addEventListener('click',e=>{e.stopPropagation();bk.classList.toggle('collapsed');});
  });
  groups.querySelectorAll('.sub-item').forEach(btn=>{
    btn.addEventListener('click',()=>select(btn.getAttribute('data-kind'),btn.getAttribute('data-id')));
  });
  tree.querySelectorAll('[data-core-nav]').forEach(group=>group.remove());
  tree.prepend(groups);
  window.ChemSpatial?.sidebar();
}
function updateNavActive(){
  document.querySelectorAll('.sub-item').forEach(b=>b.classList.toggle('active',UI.sel&&b.getAttribute('data-kind')===UI.sel.kind&&b.getAttribute('data-id')===UI.sel.id));
  document.querySelectorAll('.nav-cat[data-pt]').forEach(b=>b.classList.toggle('open',!!(UI.sel&&UI.sel.kind==='pt')));
  document.querySelectorAll('.subnav').forEach(sn=>{
    const has=sn.querySelector('.sub-item.active');
    if(has){sn.classList.add('open');sn.previousElementSibling.classList.add('open');}
  });
}

/* ---------- 选择对象 ---------- */
function select(kind,id){
  const item=itemOf(kind,id);
  if(!item)return;
  UI.sel={kind,id};
  UI.view='stage';
  VW.exp=null;VW.expPitch=undefined;VW.cmp=null;VW.asm=null;$('expPanel').classList.remove('show');
  showStage();
  VW.explode=0;VW.labels=false;VW.extra=[];
  let model=null;
  if(kind==='sub'){item.model.txt=item.name;item.model.txt2=String(item.formula||'').replace(/<[^>]+>/g,'').replace(/（[^）]*）/g,'').slice(0,9);model=B.subs[item.model.kind](item.model);}
  else if(kind==='app')model=B.app[item.model.fn]();
  else if(kind==='mol')model=B.molecule(item,VW.molMode);
  else if(kind==='exp'){SIM.init(item);}
  if(model){VW.model=model;window.fitModel();}
  buildToolbar();
  renderInspector();
  renderCrumb();
  updateNavActive();
  addRecent(kind,id);
  window.dispatchEvent(new CustomEvent('chem:context'));
  closeMobile();
  window.needsDraw();
}
window.select=select;
/* ---------- 工具条 ---------- */
function buildToolbar(){
  const tb=$('toolbar');
  const kind=UI.sel?UI.sel.kind:null;
  let h='';
  h+='<button class="tool-btn'+(VW.auto?' on':'')+'" id="tbAuto" title="自动旋转">'+svg('rotate')+'<span>旋转</span></button>';
  if(kind==='mol'||kind==='app'||kind==='sub'){
    h+='<span class="tool-sep"></span><button class="tool-btn'+(VW.labels?' on':'')+'" id="tbLbl" title="显示标注">'+svg('tag')+'<span>标注</span></button>';
    h+='<div class="tool-slider"><label for="tbExp">拆解</label><input type="range" id="tbExp" min="0" max="100" value="'+Math.round(VW.explode*100)+'"><span id="tbExpV">'+Math.round(VW.explode*100)+'%</span></div>';
  }
  if(kind==='mol'){
    h+='<span class="tool-sep"></span><button class="tool-btn'+(VW.molMode==='space'?' on':'')+'" id="tbMode" title="切换球棍/空间填充">'+svg('layers')+'<span>'+(VW.molMode==='space'?'空间填充':'球棍模型')+'</span></button>';
  }
  h+='<span class="tool-sep"></span><button class="tool-btn" id="tbReset" title="复位视角">'+svg('reset')+'<span>复位</span></button>';
  tb.innerHTML=h;
  const auto=$('tbAuto');
  if(auto)auto.addEventListener('click',()=>{VW.auto=!VW.auto;auto.classList.toggle('on',VW.auto);window.needsDraw();});
  const lbl=$('tbLbl');
  if(lbl)lbl.addEventListener('click',()=>{VW.labels=!VW.labels;lbl.classList.toggle('on',VW.labels);window.needsDraw();});
  const ex=$('tbExp');
  if(ex)ex.addEventListener('input',()=>{
    VW.explode=ex.value/100;$('tbExpV').textContent=ex.value+'%';
    /* 拆解时同步拉远镜头：按拆解程度把模型压在视锥内，避免部件飞出画面 */
    if(VW.baseD)E3.cam.dist=VW.baseD*(1+VW.explode*0.85);
    window.needsDraw();
  });
  const md=$('tbMode');
  if(md)md.addEventListener('click',()=>{
    VW.molMode=VW.molMode==='space'?'ball':'space';
    store.set('molmode',VW.molMode);
    select('mol',UI.sel.id);
  });
  const rs=$('tbReset');
  if(rs)rs.addEventListener('click',()=>{window.resetView();toast('视角已复位');});
  window.ChemSpatial?.toolbar(tb);
}

const QUIZ={item:null,sel:{},submitted:false,mode:'after'};
function quizRightIdx(q){return q.type==='judge'?(q.ans?0:1):q.ans;}
function quizIsRight(i){
  const q=QUIZ.item.quiz[i],selA=QUIZ.sel[i];
  if(q.type==='multi'){
    return Array.isArray(selA)&&selA.length===q.ans.length&&q.ans.every(a=>selA.includes(a));
  }
  return selA===quizRightIdx(q);
}
function quizScore(){return QUIZ.item.quiz.reduce((s,q,i)=>s+(quizIsRight(i)?1:0),0);}
function quizPassLine(n){return Math.ceil(n*0.75);}
function openQuiz(item,mode){
  QUIZ.item=item;QUIZ.sel={};QUIZ.submitted=false;QUIZ.mode=mode||'after';
  if(QUIZ.mode==='preview'){
    const pv=store.get('pv_'+item.id,null);
    if(!pv)store.set('pv_'+item.id,{ts:Date.now()}); /* 预习环完成标记 */
  }

  renderQuiz();
}
function closeQuiz(){$('quizMask').classList.remove('show');}
function renderQuiz(){
  const item=QUIZ.item,qs=item.quiz,pass=quizPassLine(qs.length);
  const isPv=QUIZ.mode==='preview';
  const d=$('quizDialog');
  let h='<div class="quiz-head"><h3>'+item.name+' · '+(isPv?'预习自测':'课后练习')+'</h3><button class="btn-sub" id="qClose" aria-label="关闭答题">关闭</button></div>';
  if(isPv){
    h+='<div class="q-preview"><b>预习提示</b>：先了解本实验的原理与现象要点，再凭记忆作答。<ul>'+item.phenomena.map(p=>'<li>'+p+'</li>').join('')+'</ul><p>'+item.principle+'</p></div>';
    h+='<div class="quiz-sub">预习模式：凭印象作答即可，提交后逐题看解析；成绩不计入课后记录。</div>';
  }else{
    h+='<div class="quiz-sub">共 '+qs.length+' 题：单选 '+qs.filter(q=>q.type==='single').length+' · 多选 '+qs.filter(q=>q.type==='multi').length+' · 判断 '+qs.filter(q=>q.type==='judge').length+'；多选须全部选对才得分，达标线 '+pass+' 分。</div>';
  }
  if(QUIZ.submitted){
    const score=quizScore();
    h+='<div class="q-score"><div class="sc '+(score>=pass?'pass':'fail')+'">'+score+' / '+qs.length+'</div><div class="sd">'+(score>=pass?'已达 '+pass+' 分达标线，掌握得不错！':'未达 '+pass+' 分达标线，看看每题解析再试一次吧')+'</div></div>';
  }
  qs.forEach((q,i)=>{
    const selA=QUIZ.sel[i];
    const right=QUIZ.submitted&&quizIsRight(i);
    h+='<div class="q-item'+(QUIZ.submitted?(right?' ok':' bad'):'')+(QUIZ.submitted?' submitted':'')+'">';
    h+='<div class="q-top"><span class="q-no">'+String(i+1).padStart(2,'0')+'</span><span class="q-type '+q.type+'">'+(q.type==='single'?'单选':q.type==='multi'?'多选':'判断')+'</span><span class="q-txt">'+q.q+'</span></div>';
    const opts=q.type==='judge'?['正确','错误']:q.opts;
    h+='<div class="q-opts">';
    opts.forEach((o,j)=>{
      let cls='';
      if(QUIZ.submitted){
        const isAns=q.type==='multi'?q.ans.includes(j):(j===quizRightIdx(q));
        const picked=q.type==='multi'?(Array.isArray(selA)&&selA.includes(j)):(selA===j);
        if(isAns)cls=' right';
        else if(picked)cls=' wrong';
      }else{
        if(q.type==='multi'){if(Array.isArray(selA)&&selA.includes(j))cls=' sel';}
        else{if(selA===j)cls=' sel';}
      }
      h+='<div class="q-opt'+cls+'" data-q="'+i+'" data-o="'+j+'" role="button" tabindex="0"><span class="box"></span><span>'+String.fromCharCode(65+j)+'. '+o+'</span></div>';
    });
    h+='</div>';
    let ansTxt;
    if(q.type==='multi')ansTxt=q.ans.map(a=>String.fromCharCode(65+a)).join('、');
    else if(q.type==='judge')ansTxt=q.ans?'A（正确）':'B（错误）';
    else ansTxt=String.fromCharCode(65+q.ans);
    h+='<div class="q-why"><b>解析：</b>'+q.why+'（正确答案：'+ansTxt+'）</div>';
    h+='</div>';
  });
  h+='<div class="q-foot">';
  if(QUIZ.submitted)h+='<button class="btn-main" id="qRetry">重新作答</button>';
  else h+='<button class="btn-main" id="qSubmit">提交答案</button>';
  h+='<button class="btn-sub" id="qClose2">关闭</button></div>';
  d.innerHTML=h;
  d.querySelectorAll('.q-opt').forEach(el=>{
    const pick=()=>{
      if(QUIZ.submitted)return;
      const qi=+el.getAttribute('data-q'),oi=+el.getAttribute('data-o');
      const q=qs[qi];
      if(q.type==='multi'){
        const cur=Array.isArray(QUIZ.sel[qi])?QUIZ.sel[qi].slice():[];
        const idx=cur.indexOf(oi);
        if(idx>=0)cur.splice(idx,1);else cur.push(oi);
        cur.sort();
        QUIZ.sel[qi]=cur;
      }else QUIZ.sel[qi]=oi;
      renderQuiz();
    };
    el.addEventListener('click',pick);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
  });
  const submit=$('qSubmit');
  if(submit)submit.addEventListener('click',()=>{
    const unanswered=qs.map((q,i)=>i).filter(i=>{
      const v=QUIZ.sel[i];
      return v===undefined||(Array.isArray(v)&&!v.length);
    });
    if(unanswered.length){toast('还有 '+unanswered.length+' 题未作答');return;}
    QUIZ.submitted=true;
    const score=quizScore();
    if(!isPv){ /* 预习模式不计入课后成绩 */
      const prev=store.get('quiz_'+item.id,null);
      if(!prev||score>prev.score)store.set('quiz_'+item.id,{score:score,total:qs.length,ts:Date.now()});
      renderInspector();
    }
    renderQuiz();
  });
  const retry=$('qRetry');
  if(retry)retry.addEventListener('click',()=>{QUIZ.sel={};QUIZ.submitted=false;renderQuiz();});
  const qc=$('qClose');if(qc)qc.addEventListener('click',closeQuiz);
  const qc2=$('qClose2');if(qc2)qc2.addEventListener('click',closeQuiz);
  d.scrollTop=0;
}

function enterCmp(idA,idB){
  const itemA=itemOf('mol',idA),itemB=itemOf('mol',idB);
  if(!itemA||!itemB)return;
  const mA=B.molecule(itemA,VW.molMode);
  const mB=B.molecule(itemB,VW.molMode);
  const nA=mA.parts.length;
  /* 重映射 B 分子键的部件索引（gA/gB/g 均相对自身 parts），拼接后整体偏移 nA */
  mB.parts.forEach(pt=>pt.shapes.forEach(s=>{
    if(s.g!==undefined)s.g+=nA;
    if(s.gA!==undefined)s.gA+=nA;
    if(s.gB!==undefined)s.gB+=nA;
  }));
  const model=B.fin(mA.parts.concat(mB.parts));
  const dx=(mA.span+mB.span)*0.5+Math.max(mA.span,mB.span)*0.22;
  VW.cmp={a:itemA,b:itemB,nA:nA,dx:dx,ca:mA.center,cb:mB.center};
  VW.exp=null;VW.expPitch=undefined;$('expPanel').classList.remove('show');
  VW.explode=0;VW.labels=false;
  /* 名称标签：悬浮于各自分子上方，随旋转同步移动 */
  const labH=s=>s.box.mx[1]-0;
  const topA=(mA.box?mA.box.mx[1]:1)-mA.center[1]+1.4;
  const topB=(mB.box?mB.box.mx[1]:1)-mB.center[1]+1.4;
  const mkLab=(x,top,name)=>B.F([[x-1.35,top,0],[x+1.35,top,0],[x+1.35,top+0.5,0],[x-1.35,top+0.5,0]],'#0e6b57',{flat:true,txt:name,textCol:'#ffffff',txtScale:0.42,zBias:2});
  VW.extra=[mkLab(-dx/2,topA,itemA.name),mkLab(dx/2,topB,itemB.name)];
  UI.sel={kind:'mol',id:idA};
  UI.view='stage';
  showStage();
  VW.model=model;
  window.fitModel();
  buildToolbar();renderInspector();renderCrumb();updateNavActive();
  window.needsDraw();
  toast('对比模式：'+itemA.name+' vs '+itemB.name+'（同步旋转）');
}

function closePT(){

function atomStart(e){
  const cv=$('atomCv');if(!cv)return;
  const ctx=cv.getContext('2d');
  ATOM.e=e;ATOM.cv=cv;ATOM.ctx=ctx;ATOM.rot=0;ATOM.pitch=0;ATOM.dragging=false;
  const fit=()=>{
    const r=cv.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(2,r.width*dpr);cv.height=Math.max(2,r.height*dpr);
    ATOM.w=r.width;ATOM.h=r.height;ATOM.dpr=dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  fit();
  window.addEventListener('resize',fit,{once:true});
  if(ATOM.raf)cancelAnimationFrame(ATOM.raf);
  let last=performance.now();
  const loop=ts=>{
    const dt=Math.min(.05,(ts-last)/1000)||.016;last=ts;
    if(ATOM.spin&&!ATOM.dragging)ATOM.rot+=dt*0.42;
    atomDraw();
    ATOM.raf=requestAnimationFrame(loop);
  };
  ATOM.raf=requestAnimationFrame(loop);
}
function atomDraw(){
  const cv=ATOM.cv,ctx=ATOM.ctx,e=ATOM.e;if(!cv||!e)return;
  const w=ATOM.w,h=ATOM.h,dark=isDark();
  ctx.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2+8,base=Math.min(w,h)*0.44;
  const shells=e[17]||[];const col=ECAT[e[4]][1];
  const TAU2=Math.PI*2;
  /* 光晕 */
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,base*0.9);
  g.addColorStop(0,rgbaHex(col,dark?.16:.10));
  g.addColorStop(1,rgbaHex(col,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,base*0.9,0,TAU2);ctx.fill();
  if(ATOM.cloud){
    /* 电子云：按电子层权重撒点 */
    ctx.globalAlpha=dark?.55:.4;
    for(let i=0;i<shells.length;i++){
      const R=base*(0.26+0.74*(i+1)/Math.max(1,shells.length));
      const n=Math.min(160,shells[i]*14);
      for(let k=0;k<n;k++){
        const a=(k*2.399963+i*1.7), rr=R*(0.72+0.34*((k*37%100)/100));
        const cf=Math.max(0.08,Math.min(0.98,0.42+0.10*(i%3)+ATOM.pitch));
        const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*cf;
        ctx.fillStyle=rgbaHex(col,.5);
        ctx.beginPath();ctx.arc(x,y,1.1,0,TAU2);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }else{
    shells.forEach((n,i)=>{
      const R=base*(0.26+0.74*(i+1)/Math.max(1,shells.length));
      const squash=Math.max(0.06,Math.min(0.96,0.34+0.12*(i%3)+ATOM.pitch));
      const tilt=ATOM.rot*(1+i*0.06)+i*0.9;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);
      ctx.beginPath();ctx.ellipse(0,0,R,R*squash,0,0,TAU2);
      ctx.strokeStyle=dark?'rgba(226,248,240,.20)':'rgba(18,72,60,.16)';
      ctx.lineWidth=1;ctx.stroke();
      ctx.restore();
      for(let j=0;j<n;j++){
        const a=ATOM.rot*(2.4/(i+1))+j/n*TAU2+i*0.7;
        const px=Math.cos(a)*R, py=Math.sin(a)*R*squash;
        const x=cx+px*Math.cos(tilt)-py*Math.sin(tilt);
        const y=cy+px*Math.sin(tilt)+py*Math.cos(tilt);
        const depth=(Math.sin(a)+1)/2;
        const r=2.2+depth*2.0;
        ctx.shadowBlur=7;ctx.shadowColor=rgbaHex('#9fe6ff',.85);
        ctx.fillStyle=rgbaHex('#f2fbff',.45+depth*.55);
        ctx.beginPath();ctx.arc(x,y,r,0,TAU2);ctx.fill();
        ctx.shadowBlur=0;
      }
    });
  }
  /* 原子核：质子中子小球堆 */
  const nr=Math.max(13,Math.min(24,base*0.085));
  /* 核心外晕 */
  const halo=ctx.createRadialGradient(cx,cy,nr*.8,cx,cy,nr*2.6);
  halo.addColorStop(0,rgbaHex(col,.55));halo.addColorStop(1,rgbaHex(col,0));
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,nr*2.6,0,TAU2);ctx.fill();
  const ng=ctx.createRadialGradient(cx-nr*.32,cy-nr*.36,nr*.12,cx,cy,nr*1.2);
  ng.addColorStop(0,'#fff3d8');ng.addColorStop(.5,'#ffc98a');ng.addColorStop(.86,col);ng.addColorStop(1,rgbaHex(col,.9));
  ctx.fillStyle=ng;ctx.beginPath();ctx.arc(cx,cy,nr*1.16,0,TAU2);ctx.fill();
  if(!ATOM.cloud){
    for(let k=0;k<7;k++){
      const a=k*2.399963*1.7, rr=nr*0.55*((k%3)+1)/3;
      ctx.fillStyle=k%2?'rgba(255,255,255,.75)':'rgba(255,236,210,.8)';
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,nr*0.2,0,TAU2);ctx.fill();
    }
  }
}

/* 画布点击拾取（区分拖拽：位移 >5px 视为旋转） */
(function(){
  const cv=document.getElementById('cv');
  let down=null;
  cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
  cv.addEventListener('click',e=>{
    if(!UI.sel||UI.sel.kind!=='pt')return;
    if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
    const r=cv.getBoundingClientRect();
    const dpr=cv.width/r.width||1;
    const sx=(e.clientX-r.left)*dpr,sy=(e.clientY-r.top)*dpr;
    let best=-1,bd=1e9;
    DB.PT.forEach((el,i)=>{
      const x=(el[2]-9.5),z=(el[3]-5.5);
      const h=0.42+el[6]*0.26;
      const p=E3.proj(x,h,z);
      if(p[2]<0.3)return;
      const d=Math.hypot(p[0]-sx,p[1]-sy);
      if(d<bd){bd=d;best=i;}
    });
    const cellR=0.7*E3.cam.fov/E3.cam.dist; /* 块投影半径的近似 */
    if(best>=0&&bd<cellR*1.6)openPTDetail(best+1);
  });

DB.bp='<section class="title"><h1>工作室使用指南</h1><p>探索结构 · 手动实验 · 记录数据 · 随时提问</p></section><h2>1. 探索</h2><p>在左侧选择试剂、仪器、分子或实验；画布支持旋转、缩放与复位。分子可以同屏对比。实验会明确标注动态演示或静态装置讲解。</p><h2>2. 手动滴定</h2><p>选择酸碱中和滴定 → 开始手动滴定。观察溶液颜色，自行填写初末读数，再判断终点。可以重复测量、查看理论曲线和导出 CSV。适用模型：25°C 理想 HCl / NaOH，忽略活度与混合动力学，不能用作真实实验的精密预测。</p><h2>3. 报告与数据</h2><p>实验报告支持在线填写、自动本地保存、HTML 下载与打印为 PDF。数据保存在当前浏览器和当前访问地址下；清理浏览器数据会移除记录，请及时下载。通过文件和本机服务打开的记录可能位于不同存储空间。</p><h2>4. 化学助教</h2><p>点击右上角化学助教，再进入“模型配置”，可填写自己的兼容接口、模型名称和密钥，获取模型列表、测试并保存。支持环境变量、临时密钥或 Windows 加密保存；离线模式提供本站资料检索，界面会明确区分。助教可以查资料、了解当前步骤，并提出打开模型和同屏对比的操作按钮，点击后执行。</p><h2>5. 资料与边界</h2><p>图形为教学示意，结构文字为参考值，需结合物态、温度与实验条件理解；危险性图标须核对实际试剂 SDS。本站原有完整数据尚未逐项进行独立学术审定。</p><ul><li><a href="https://openstax.org/books/chemistry-2e/pages/14-7-acid-base-titrations" target="_blank" rel="noopener">OpenStax：酸碱滴定与终点</a></li><li><a href="https://openstax.org/books/chemistry/pages/18-4-structure-and-general-properties-of-the-nonmetals" target="_blank" rel="noopener">OpenStax：非金属与氧化态例外</a></li><li><a href="https://periodic-table.rsc.org/" target="_blank" rel="noopener">英国皇家化学会：元素数据</a></li><li><a href="https://www.inchem.org/documents/icsc/icsc/eics0362.htm" target="_blank" rel="noopener">ICSC：浓硫酸</a></li></ul>';
