<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e6b57">
<title>离线了 · 高中化学 3D 考点工作台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;color:#134e4a;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#f5fcfa 0%,#ffffff 45%,#c3e8db 100%)}
  .card{max-width:480px;width:100%;text-align:center;background:#fff;border:1px solid #cdeee7;border-radius:18px;padding:40px 28px;box-shadow:0 12px 32px rgba(14,107,87,.16)}
  .mark{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:#e6faf6;display:flex;align-items:center;justify-content:center;font-size:34px}
  h1{font-size:22px;margin-bottom:10px}
  p{font-size:14px;color:#5b8a85;margin-bottom:8px}
  .actions{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;min-height:44px;line-height:44px;padding:0 22px;border-radius:10px;font-size:14px;text-decoration:none}
  .primary{background:#0e6b57;color:#fff}
  .ghost{border:1px solid #cdeee7;color:#0e6b57;background:#fff}
  .tip{margin-top:22px;font-size:12px;color:#8aa8a1}
</style>
</head>
<body>
<div class="card">
  <div class="mark" aria-hidden="true">🧪</div>
  <h1>当前处于离线状态</h1>
  <p>网络连接似乎中断了。已缓存的工作台页面仍可使用，联网后可恢复完整功能。</p>
  <div class="actions">
    <a class="primary" href="/app.html">返回工作台</a>
    <a class="ghost" href="/">返回首页</a>
  </div>
  <p class="tip">高中化学 3D 考点工作台 · 江西师范大学</p>
</div>
</body>
</html>
